  return a < 0. && ap > 0. ? mix(tp, t, ap / (ap - a)) : t;
}

// The parked lander, in its own frame: y away from the planet, z forward, origin at ship.pos (about
// 1.4 m above the ground). part says which piece is nearest: 0 hull, 1 canopy, 2 engine ring, 3 legs, 4 lamp.
float sdEllipsoid(vec3 p, vec3 r) { float k0 = length(p / r), k1 = length(p / (r * r)); return k0 * (k0 - 1.) / max(k1, 1e-6); }
float sdCapsule(vec3 p, vec3 a, vec3 b, float r) {
  vec3 pa = p - a, ba = b - a;
  return length(pa - ba * clamp(dot(pa, ba) / dot(ba, ba), 0., 1.)) - r;
}
float lander(vec3 q, out float part) {
  float hull = min(sdEllipsoid(q - vec3(0., .05, 0.), vec3(1.35, .45, 1.35)), sdEllipsoid(q - vec3(0., .38, -.12), vec3(.85, .38, .85)));
  float canopy = length(q - vec3(0., .5, .45)) - .4;
  float ring = length(vec2(length(q.xz) - 1.27, q.y + .02)) - .085;
  vec3 a = vec3(abs(q.x), q.y, abs(q.z));   // four legs by symmetry
  float legs = min(sdCapsule(a, vec3(.68, -.15, .68), vec3(1.08, -1.24, 1.08), .065), sdEllipsoid(a - vec3(1.08, -1.3, 1.08), vec3(.22, .06, .22)));
  float lamp = length(q - vec3(0., .78, -.22)) - .07;
  float d = hull; part = 0.;
  if (canopy < d) { d = canopy; part = 1.; }
  if (ring < d) { d = ring; part = 2.; }
  if (legs < d) { d = legs; part = 3.; }
  if (lamp < d) { d = lamp; part = 4.; }
  return d;
}

// Standing stones, in their own frame (y up, origin on the ground at the middle of the ring): n places
// evenly round a ring, one of them (skip) empty. Each stone is a slab that narrows upward, its height by
// its place in the ring. The nearest stone is the one in this slice of the ring or the next on either side.
float stones(vec3 q, float n, float skip) {
  float slice = 6.2832 / n, here = floor(atan(q.x, q.z) / slice + .5), d = 1e3;
  for (int j = -1; j <= 1; j++) {
    float i = mod(here + float(j) + n, n);
    if (abs(i - skip) < .5) continue;
    float turn = i * slice, c = cos(turn), s = sin(turn), tall = 2.4 + 1.2 * fract(i * .618 + .37);
    vec3 p = vec3(q.x * c - q.z * s, q.y, q.x * s + q.z * c - ${HENGE.toFixed(1)});
    vec3 e = abs(p - vec3(0., tall * .5 - .5, 0.)) - vec3(.5 - .12 * clamp(p.y / tall, 0., 1.), tall * .5 + .5, .2);
    d = min(d, length(max(e, 0.)) + min(max(e.x, max(e.y, e.z)), 0.) - .1);
  }
  return d;
}
// a cairn: a waist-high pile of rounded stones, origin on the ground under it
float cairn(vec3 q) {
  float d = sdEllipsoid(q - vec3(0., .98, 0.), vec3(.3, .2, .28));
  d = min(d, sdEllipsoid(vec3(abs(q.x), q.y, abs(q.z)) - vec3(.36, .2, .36), vec3(.42, .3, .42)));
  return min(d, sdEllipsoid(vec3(abs(q.x), q.y, q.z) - vec3(.24, .62, .04), vec3(.34, .24, .32)));
}
// The shape of thing number what: 0 the ship, 1 standing stones (more holds how many and which is missing),
// 2 a wreck, which is the ship lying over on its side and half in the ground, 3 a cairn. part is the
// piece of the ship that is nearest, or 5 for stone.
float thing(vec3 q, float what, float more, out float part) {
  part = 5.;
  if (what > 2.5) return cairn(q);
  if (what > .5 && what < 1.5) return stones(q, floor(more / 16.), mod(more, 16.));
  if (what > 1.5) q = vec3(q.x * .82 + (q.y - .5) * .57, (q.y - .5) * .82 - q.x * .57, q.z);
  return lander(q, part);
}

// a capped cone from y = -h (radius r1) to y = +h (radius r2)
float sdCappedCone(vec3 p, float h, float r1, float r2) {
  vec2 q = vec2(length(p.xz), p.y), k1 = vec2(r2, h), k2 = vec2(r2 - r1, 2. * h);
  vec2 ca = vec2(q.x - min(q.x, q.y < 0. ? r1 : r2), abs(q.y) - h);
  vec2 cb = q - k1 + k2 * clamp(dot(k1 - q, k2) / dot(k2, k2), 0., 1.);
  float s = cb.x < 0. && ca.y < 0. ? -1. : 1.;
  return s * sqrt(min(dot(ca, ca), dot(cb, cb)));
}
// A fir in its own frame (y up, origin at the base): a trunk and three overlapping tiers of boughs with
// bushy edges. At fade 0 it is a small cone hidden inside the one the terrain already holds, so what
// shows there is the terrain's own tree, and a tree grows out of that as the fade rises.
float fir(vec3 q, float r, float h, float fade, float seed) {
  // outside the widest tier the distance to it is a safe step, so the exact shape is only worked out close by
  float wide = length(q.xz) - (r * 1.2 + .45);
  if (wide > .6) return wide;
  float d = sdCapsule(q, vec3(0.), vec3(0., h * .5, 0.), r * .09);
  for (int k = 0; k < 3; k++) {
    float fk = float(k), y0 = h * .25 * fk, th = h * (.48 + .02 * fk), R = r * (1.2 - .3 * fk) + .45;
    d = min(d, sdCappedCone(q - vec3(0., y0 + th * .5, 0.), th * .5, R, R * .06));
  }
  if (fade > .5) d += (n3(q * 2.6 + seed) - .5) * .11 * r;
  return mix(sdCappedCone(q - vec3(0., h * .3, 0.), h * .3, r * .7, 0.), d, fade);
}

// How much of the sun reaches p: the same rules as the march, along the ray to the sun. The soft edge of
// a shadow comes from how close the ray passes over the ground: 9 times that height over the distance
// gone, and past 15 m over 15 m, so a far shadow's edge is 1.7 m wide. With the width fixed, the ray
// may skip the ground wherever the maps put it more than that width above everything, and miss nothing.
float shadow(vec3 p) {
  float res = 1., t = .6, a = -1e9, room = 0., lv = 0., roof = 6.;
  bool air = false;
  for (int i = 0; i < 64; i++) {
    vec3 q = p + uSun * t;
    float r = length(q), alt = r - uR;
    if (r > uR + uTop) break;
    float rise = dot(uSun, q) / r, across = max(sqrt(max(1. - rise * rise, 0.)), .05);
    if (!air) {
      if (a < -1e8) {
        a = alt - ground(q);
        res = min(res, 9. * a / min(t, 15.));
        if (res < .02) break;
      }
      if (a <= 1.2 || room != 0.) {
        float go = clamp(a, .6, room > 0. ? max(room / across, 1.2) : 2.5);
        if (room > 0. && a > room / across) lv = min(lv + 1., floor(roof));
        room = room > 0. ? max(room - go * across, 0.) : min(room + go * across, 0.);
        roof = min(roof + .25, 6.);
        t += go; a = -1e9;
        continue;
      }
    }
    vec2 hi = textureLod(uTops, q, lv).rg;
    float c = alt - hi.x, block = uBlock * exp2(lv);
    if (9. * c >= res * 15.) {
      // above everything near by more than the soft edge: nothing on the way can deepen the shadow until
      // the ray has come down to within that edge of it, or gone a block sideways
      air = true; room = 0.;
      float side = block / across, drop = (c - res * 15. / 9.) / max(-rise, 1e-3);
      t += max(min(side, drop), .6); a = -1e9;
      if (side < drop) lv = min(lv + 1., floor(roof));
      roof = min(roof + .25, 6.);
      continue;
    }
    air = false;
    if (hi.y >= 1.7 && lv > 0.) { roof = lv - 1.; lv = max(lv - 2., 0.); }
    else room = hi.y < 1.7 ? block : -3. * block;
  }
  return clamp(res, 0., 1.);
}

float cloudAt(vec3 d);
float ringBand(float r);
// what dims the sun at p besides the terrain: cloud, the ring's shadow, the parked ship
float skyShade(vec3 p) {
  float v = 1.;
  if (uCloud.w > 0. && length(p) < uR + uCloud.y) {
    vec2 s = sphere(p, uSun, uR + uCloud.y);
    v *= 1. - .75 * uCloud.w * cloudAt(normalize(p + uSun * s.y));
  }
  if (uRing.z > 0.) {
    float k = -dot(p, uRingN) / dot(uSun, uRingN);
    if (k > 0.) v *= 1. - .8 * ringBand(length(p + uSun * k));
  }
  if (uShip.w > 0.) {
    vec3 sc = uShip.xyz - p;
    float along = dot(sc, uSun);
    if (along > 0.) v *= mix(.35, 1., smoothstep(1.1, 1.8, length(sc - uSun * along)));
  }
  // a wreck and a cairn throw a soft patch of shade the same way
  for (int k = 0; k < 3; k++) {
    if (uFind[k].w < 1.5) continue;
    vec3 sc = uFind[k].xyz + normalize(uFind[k].xyz) * .6 - p;
    float along = dot(sc, uSun), wide = uFind[k].w < 2.5 ? 1.2 : .5;
    if (along > 0.) v *= mix(.4, 1., smoothstep(wide, wide + .7, length(sc - uSun * along)));
  }
  return v;
}

float cloudAt(vec3 d) {
  vec3 q = d * uCloud.z + vec3(uTime * .006, 0., uTime * .004);
  float w = fbm(q * .6 + 11.);
  return smoothstep(uCloud.x, uCloud.x + .2, fbm(q + w * 1.4));
}
vec3 sunTint(float mu, float k) { return exp(-uBeta * uAtmo * .25 * k / max(mu + .15, .05)); }
vec3 skyCol() { return uBeta / max(max(uBeta.r, uBeta.g), max(uBeta.b, 1e-6)); }

vec3 cloudLit(vec3 d) {
  float mu = dot(d, uSun);
  float thick = cloudAt(normalize(d + uSun * .025));
  return uCloudCol * (uSunCol * sunTint(mu, .7) * smoothstep(-.12, .2, mu) * mix(1., .4, thick)
                      + skyCol() * smoothstep(-.3, .2, mu) * .15 + .01);
}

float ringBand(float r) {
  float x = (r - uRing.x) / (uRing.y - uRing.x);
  if (x < 0. || x > 1.) return 0.;
  float b = .3 + .7 * n3(vec3(x * 9. + uRing.w, .5, .5));
  return b * smoothstep(0., .05, x) * (1. - smoothstep(.92, 1., x)) * smoothstep(.02, .05, abs(x - .58)) * uRing.z;
}

// a material with an outline of its own, as opposed to a kind of ground
bool solid(float m) { return m == ${TREE}. || m == ${CRYSTAL}. || m == ${SPIRE}. || m == ${LAVA}.; }

vec3 surface(vec3 ro, vec3 rd, float t) {
  vec3 p = ro + rd * t, d = normalize(p);
  float lod = clamp(log2(t * uPix / uTexel), 0., 6.);
  float h = textureLod(uHeight, d, 0.).r;
  vec3 n = normalize(textureLod(uNormal, d, lod).xyz * 2. - 1.);
  // seen edge-on a pixel covers a long strip of ground, so the colour comes from a coarser level, one at most:
  // more than that and anything thin, a lava vein above all, is averaged away
  vec4 al = textureLod(uAlbedo, d, min(lod - log2(max(dot(n, -rd), .5)), 6.));
  vec3 alb = pow(al.rgb, vec3(2.2));
  bool sea = uSea.a > .5 && h < 0.;
  if (sea) n = d;

  // F is the size, in metres on the surface, of the smallest patch the picture can show here: about
  // four characters wide and two tall. It grows with distance and, a lot, with how edge-on the surface
  // is seen. Every pattern below fades out before it gets finer than that: the picture would show a
  // finer one only as static, and on flat ground as dashed stripes.
  float F = t * uPix * max(8., 6. / max(dot(n, -rd), .04));

  // Which material: the map has one answer per texel, about a metre, so where two kinds of ground meet
  // the border would be drawn as a staircase. Close up the lookup wobbles by about a texel, which makes
  // the border ragged. Trees, crystals, rocks and lava keep their own outline: a wobble there puts their
  // material on the ground beside them, or the ground's on them.
  mat = floor(textureLod(uMat, d, 0.).r * 255. + .5);
  if (!sea && F < 2.5 && !solid(mat)) {
    vec3 md = normalize(d + (vec3(n3(p * 1.7), n3(p * 1.7 + 13.), n3(p * 1.7 + 29.)) - .5) * (1.6 * uTexel / uR));
    float m1 = floor(textureLod(uMat, md, 0.).r * 255. + .5);
    if (!solid(m1)) mat = m1;
  }
  if (sea) mat = uSea.a > 1.5 ? ${LAVA}. : ${WATER}.;

  // Props get the structure the height map is too coarse to hold (it has about a metre per point).
  // Only their sides get it: the top of a spire and the ground round a foot are flat and stay plain.
  float side = 1. - smoothstep(.8, .97, dot(n, d)), alt = length(p) - uR;
  if (!sea && F < 7. && side > 0.) {
    vec3 g = (vec3(n3(p * 2.4), n3(p * 2.4 + 17.), n3(p * 2.4 + 31.)) - .5) * fine(F, .42) * side;
    if (mat == ${TREE}.) {
      // boughs in tiers about 1.6 m apart, dark underneath and light at the tips; clumps of needles;
      // a little variety from tree to tree. The tiers go by the height of the point itself: on a
      // near-vertical side the height map's own value hardly changes from top to bottom.
      float tier = fract(alt * .62 + n3(p * .35) * .5);
      n = normalize(n + g * 1.3);
      float boughs = .25 + 1.05 * smoothstep(.05, .5, tier) + .3 * smoothstep(.8, 1., tier);
      alb *= mix(1., boughs, fine(F, 1.6) * side) * mix(1., .6 + .8 * n3(p * 3.1), fine(F, .32) * side) * (.8 + .4 * n3(p * .2));
    } else if (mat == ${SPIRE}.) {
      // thick rock strata, light and dark, with cracks
      float layer = sin(alt * 2.4 + n3(p * .3) * 3.);
      n = normalize(n + g * .8);
      alb *= mix(1., .72 + .32 * layer, fine(F, 2.6) * side) * mix(1., .75 + .5 * n3(p * 1.9), fine(F, .53) * side);
    } else if (mat == ${CRYSTAL}.) {
      // facets: the normal snaps toward a few planes, so each face is flat and catches the light on its own
      n = normalize(mix(n, floor(n * 2.5 + .5) / 2.5, .85 * fine(F, 1.5)));
    }
  }

  float mu = dot(d, uSun), day = smoothstep(-.25, .25, mu);
  vec3 amb = skyCol() * day * .1 + vec3(.03, .035, .05);
  float ndl = max(dot(n, uSun), 0.), vis = 1.;
  if (ndl > 0.) vis = shadow(p + n * .3);
  if (ndl > 0. || sea) vis *= skyShade(p);   // a face turned from the sun has no use for it
  vec3 sun = uSunCol * sunTint(mu, 1.5) * vis;
  vec3 light = sun * ndl + amb;
  // headlamp, only once it gets dark
  light += vec3(1.5, 1.4, 1.15) * (1. - day) * max(dot(n, -rd), 0.) / (1. + t * t / 250.);
  for (int i = 0; i < 5; i++) {
    vec4 b = uBeacon[i];
    if (b.w <= 0.) continue;
    vec3 q = p - b.xyz, v = normalize(b.xyz);
    float along = dot(q, v);
    // the far side of the planet lies on the same axis: without the smoothstep the ground opposite every beacon glows too
    light += uBeaconCol * b.w * (1. - .5 * day) * smoothstep(-2. * uR, -1.9 * uR, along) / (1. + (dot(q, q) - along * along) / 14.);
  }

  if (!sea) {
    // Mottling of the ground, at the finest scale the picture resolves here: specks at your feet,
    // patches a few metres across further off, and nothing past that, where the colour map takes over.
    // On a wall the scale goes by the short side of what a sample covers, or a cliff seen from close by
    // and at an angle would be blotched with patches metres across; seen too edge-on for that scale,
    // the mottling fades out.
    float Fd = mix(F, t * uPix * 8., side);
    float l = max(log2(Fd / .27), 0.), i = floor(l), sc = 3.7 * exp2(-i);
    float det = mix(n3(p * sc + i * 7.3), n3(p * sc * .5 + i * 7.3 + 7.3), l - i);
    alb *= mix(1., .55 + .9 * det, (1. - smoothstep(3., 6., l)) * fine(F, 1.5 * Fd));
    float em = step(.01, al.a) * (al.a - .004);
    // each crystal facet glows at its own brightness
    if (mat == ${CRYSTAL}.) em *= mix(1., .35 + .9 * abs(dot(n, normalize(vec3(.4, .8, .45)))), fine(F, 1.5));
    glow = em;
    return alb * light + alb * em * uEmit;
  }
  if (uSea.a > 1.5) {
    float crust = smoothstep(.38, .6, mix(.5, n3(p * .22 + vec3(0., uTime * .02, 0.)), fine(F, 4.5)) * .6 + mix(.5, n3(p * .9), fine(F, 1.1)) * .4);
    glow = (1. - crust) * .3;
    return mix(vec3(2.2, .38, .035), vec3(.03, .015, .012) * light, crust);
  }
  vec3 wc = mix(uShallow, uSea.rgb, 1. - exp(h * .3));
  wc = mix(alb, wc, 1. - exp(h * 1.4));
  // Ripples. Where they are smaller than the picture can show they stop moving the normal and widen
  // the sun's glint instead, which is what a camera sees of far water: a smooth path of light, not sparks.
  float calm = 1. - fine(F, .9);
  vec3 rip = vec3(n3(p * 1.1 + uTime * .5), n3(p * 1.1 + 9. - uTime * .4), n3(p * 1.1 + 17. + uTime * .3)) - .5;
  vec3 wn = normalize(d + rip * .1 * (1. - calm));
  float fres = pow(clamp(1. - dot(-rd, wn), 0., 1.), 5.);
  float sp = max(dot(reflect(rd, wn), uSun), 0.);
  float glint = pow(sp, mix(90., 34., calm)) * mix(4., 1.1, calm);
  glow = min(glint * .06, 1.) * vis;
  return wc * light * (1. - fres) + (skyCol() * day * .3 + .008) * fres + sun * (glint + pow(sp, 10.) * .2);
}

vec3 stars(vec3 rd) {
  vec3 q = rd * 95.;
  float h = hash(q);
  if (h < .986) return vec3(0.);
  float b = (h - .986) / .014;
  float tw = .75 + .25 * sin(uTime * (1.5 + b * 4.) + b * 60.);
  return mix(vec3(1., .85, .7), vec3(.75, .85, 1.), fract(b * 7.3)) * (1. - smoothstep(.1, .5, length(fract(q) - .5))) * (.25 + b * b * 1.5) * tw;
}

// sun and moon; they stay visible through a daytime sky, the stars do not
vec3 lights(vec3 ro, vec3 rd) {
  float sd = max(dot(rd, uSun), 0.);
  vec3 col = uSunCol * (smoothstep(.99965, .9999, sd) * 60. + pow(sd, 900.) * 4. + pow(sd, 50.) * .2);
  glow = smoothstep(.9992, .9999, sd);
  vec2 s = sphere(ro - uMoon.xyz, rd, uMoon.w);
  if (uMoon.w > 0. && hits(s)) {
    vec3 n = normalize(ro + rd * s.x - uMoon.xyz);
    col = vec3(.5, .48, .45) * (.45 + fbm(n * 3.5 + 3.)) * (uSunCol * max(dot(n, uSun), 0.) + .004);
    glow = 0.;
    mat = ${ROCK}.;
  }
  return col;
}

// single scattering: light picked up along the view ray, and how much of what is behind survives
vec3 atmosphere(vec3 ro, vec3 rd, float tMax, out vec3 trans) {
  trans = vec3(1.);
  if (uAtmo <= 0.) return vec3(0.);
  vec2 s = sphere(ro, rd, uR + uAtmo);
  float t0 = max(s.x, 0.), t1 = min(s.y, tMax);
  if (t1 <= t0) return vec3(0.);
  float hs = uAtmo * .25, ds = (t1 - t0) / 8., od = 0.;
  vec3 sum = vec3(0.);
  for (int i = 0; i < 8; i++) {
    vec3 p = ro + rd * (t0 + (float(i) + .5) * ds);
    float dens = exp(-max(length(p) - uR, 0.) / hs) * ds;
    od += dens;
    // the planet's shadow is a cylinder behind it. Its edge is spread over the width of one step, so a step
    // fades in as it crosses the edge; whole steps switching on and off would show as eight hard bands in
    // the dusk sky
    float pb = dot(p, uSun), wide = .5 * ds * length(rd - uSun * dot(rd, uSun)) + .01;
    float lit = pb > 0. ? 1. : smoothstep(uR * .99 - wide, uR * .99 + wide, sqrt(max(dot(p, p) - pb * pb, 0.)));
    if (lit <= 0.) continue;
    float dl = sphere(p, uSun, uR + uAtmo).y / 4., ods = 0.;
    for (int j = 0; j < 4; j++) ods += exp(-max(length(p + uSun * ((float(j) + .5) * dl)) - uR, 0.) / hs) * dl;
    sum += lit * dens * exp(-uBeta * (od + ods));
  }
  trans = exp(-uBeta * od);
  float mu = dot(rd, uSun), m = max(mu, 0.);
  // rayleigh, plus a forward lobe round the sun that carries the sunset colours
  return sum * uSunCol * uAdapt * (uBeta * .45 * (1. + mu * mu) + (.012 * pow(m, 6.) + .09 * pow(m, 90.)) / hs);
}

// The nearest trees, drawn as real shapes. Each blends back into the plain cone the terrain already has
// before it reaches the edge of that set (uTreeFade), so a tree never changes shape from one frame to the
// next. Checked before any shading, so the terrain behind a tree is never shaded for nothing.
bool trees(vec3 ro, vec3 rd, inout float tEnd, out vec3 col) {
  bool found = false;
  col = vec3(0.);
  for (int i = 0; i < 12; i++) {
    if (i >= uTreeN) break;
    vec4 tr = uTree[i];
    float r = uTreeB[i].x, h = tr.w, seed = uTreeB[i].y;
    vec3 up = normalize(tr.xyz), o = ro - tr.xyz;
    float fade = 1. - smoothstep(uTreeFade.x, uTreeFade.y, length(o));
    if (fade <= 0.) continue;
    vec2 b = sphere(o - up * (h * .5), rd, length(vec2(h * .56, r * 1.3 + .6)));
    if (b.y <= 0. || b.x >= tEnd) continue;
    vec3 ax = normalize(cross(up, abs(up.y) < .9 ? vec3(0., 1., 0.) : vec3(1., 0., 0.))), az = cross(ax, up);
    vec3 lo = vec3(dot(o, ax), dot(o, up), dot(o, az)), ld = vec3(dot(rd, ax), dot(rd, up), dot(rd, az));
    // with the eye in among the boughs the tree melts back into its cone: every ray would hit it at
    // once and fill the screen with one colour
    fade *= smoothstep(.1, .8, fir(lo, r, h, 1., seed));
    if (fade <= 0.) continue;
    float ts = max(b.x, 0.);
    bool hit = false;
    for (int k = 0; k < 36; k++) {
      float dd = fir(lo + ld * ts, r, h, fade, seed);
      if (dd < .004 * (1. + ts)) { hit = true; break; }
      ts += dd * .9;
      if (ts > b.y || ts > tEnd) break;
    }
    if (!hit || ts >= tEnd) continue;
    vec3 q = lo + ld * ts, p = ro + rd * ts;
    const vec2 e = vec2(.006, -.006);
    vec3 nl = normalize(e.xyy * fir(q + e.xyy, r, h, fade, seed) + e.yyx * fir(q + e.yyx, r, h, fade, seed)
                      + e.yxy * fir(q + e.yxy, r, h, fade, seed) + e.xxx * fir(q + e.xxx, r, h, fade, seed));
    vec3 n = nl.x * ax + nl.y * up + nl.z * az;
    float mu = dot(up, uSun), day = smoothstep(-.25, .25, mu), ndl = max(dot(n, uSun), 0.);
    float vis = ndl > 0. ? shadow(p + n * .3) * skyShade(p) : 1.;
    // darker toward the trunk and under each tier, clumps of needles
    float occ = .4 + .6 * clamp(length(q.xz) / (r * 1.1), 0., 1.);
    vec3 alb = uTreeCol * occ * (.65 + .7 * n3(q * 4. + seed));
    vec3 light = uSunCol * sunTint(mu, 1.5) * vis * ndl + skyCol() * day * .1 + vec3(.03, .035, .05)
               + vec3(1.5, 1.4, 1.15) * (1. - day) * max(dot(n, -rd), 0.) / (1. + ts * ts / 250.);
    col = alb * light + alb * uTreeGlow * 3.2;
    glow = uTreeGlow;
    tEnd = ts;
    mat = ${TREE}.;
    found = true;
  }

  return found;
}

void main() {
  vec3 ro = uPos, rd = normalize(uFwd + uRight * vUv.x * uFov.x + uUp * vUv.y * uFov.y);
  float t = march(ro, rd), tEnd = t > 0. ? t : 1e5;
  vec3 col, st = vec3(0.);
  glow = 0.;
  mat = ${VOID}.;
  if (trees(ro, rd, tEnd, col)) {}
  else if (t > 0.) col = surface(ro, rd, t);
  else { col = lights(ro, rd); st = mat == ${ROCK}. ? vec3(0.) : stars(rd); }   // no stars in front of the moon

  // The parked ship and the things to find. Each is marched in its own frame (y away from the planet, z
  // the way it faces) inside a sphere that holds it.
  for (int k = 0; k < 4; k++) {
    int j = max(k - 1, 0);
    vec4 at = k == 0 ? uShip : uFind[j];
    if (at.w <= 0.) continue;
    float what = k == 0 ? 0. : at.w, more = k == 0 ? 0. : uFindB[j].w;
    vec3 face = k == 0 ? uShipFwd : uFindB[j].xyz;
    vec3 up = normalize(at.xyz), fw = normalize(face - up * dot(face, up)), rt = cross(up, fw);
    vec3 o = ro - at.xyz, lo = vec3(dot(o, rt), dot(o, up), dot(o, fw)), ld = vec3(dot(rd, rt), dot(rd, up), dot(rd, fw));
    // the sphere: 2.2 m round the ship's hull; round the others it is centred a little above the ground
    vec2 b = what < .5 ? sphere(lo, ld, 2.2) : sphere(lo - vec3(0., what < 1.5 ? 1.4 : .7, 0.), ld, what < 1.5 ? ${(HENGE + 1.8).toFixed(1)} : what < 2.5 ? 2.7 : 1.6);
    float inside;
    // with the eye inside the shape every ray would hit it at once and fill the screen: leave it out then
    if (b.y > 0. && b.x < tEnd && (b.x > 0. || thing(lo, what, more, inside) > .05)) {
      float ts = max(b.x, 0.), part = 0.;
      bool hit = false;
      for (int i = 0; i < 64; i++) {
        float dd = thing(lo + ld * ts, what, more, part);
        if (dd < .002 * (1. + ts)) { hit = true; break; }
        ts += dd;
        if (ts > b.y || ts > tEnd) break;
      }
      if (hit && ts < tEnd) {
        vec3 q = lo + ld * ts;
        const vec2 e = vec2(.004, -.004);
        float pp;
        vec3 nl = normalize(e.xyy * thing(q + e.xyy, what, more, pp) + e.yyx * thing(q + e.yyx, what, more, pp) + e.yxy * thing(q + e.yxy, what, more, pp) + e.xxx * thing(q + e.xxx, what, more, pp));
        vec3 n = nl.x * rt + nl.y * up + nl.z * fw;
        float ndl = max(dot(n, uSun), 0.), spec = pow(max(dot(n, normalize(uSun - rd)), 0.), part == 1. ? 120. : 40.);
        // the ship's hull shades what is under its rim
        float under = what < .5 ? (1. - smoothstep(-.5, -.1, q.y)) * step(length(q.xz), 1.3) : 0.;
        // a hill, a cloud or the ring shades it too (a wreck or a cairn is asked 3 m up, clear of the patch
        // of shade it throws itself)
        vec3 sunL = uSunCol * sunTint(dot(up, uSun), 1.) * (1. - .75 * under) * smoothstep(-.1, .1, dot(up, uSun))
                  * shadow(at.xyz + up * .6) * skyShade(at.xyz + up * (what > 1.5 ? 3. : 0.));
        vec3 amb = skyCol() * .12 * smoothstep(-.25, .25, dot(up, uSun)) + vec3(.04, .045, .055);
        // the things to find are lit by the headlamp once it is dark, like the ground; the ship has lights of its own
        if (what > .5) amb += vec3(1.5, 1.4, 1.15) * (1. - smoothstep(-.25, .25, dot(up, uSun))) * max(dot(n, -rd), 0.) / (1. + ts * ts / 250.);
        // a wreck is the ship's shape gone dull: dust on the hull, no light in the ring or the lamp
        float dead = what > 1.5 ? 1. : 0.;
        glow = 0.;
        if (part > 4.5) {
          // stone: the planet's own rock, streaked down its faces
          col = uRock * (1.1 + .9 * n3(vec3(q.x * 2.5, q.y * .5, q.z * 2.5))) * (sunL * ndl + amb);
        } else if (part < .5) {
          // hull: light panels with darker seams, and a dark band above the engine ring
          float f = fract(atan(q.z, q.x) * 1.2732), seam = 1. - smoothstep(0., .03, min(f, 1. - f));
          vec3 base = mix(vec3(.62, .64, .68), vec3(.28, .3, .33), max(seam * .7, (1. - smoothstep(0., .05, abs(q.y - .2))) * .8));
          col = mix(base, uRock * 1.6 + .05, dead * .6) * (sunL * ndl + amb) + sunL * spec * .35 * (1. - dead);
        } else if (part < 1.5) {
          // canopy: dark glass that reflects the sky
          col = vec3(.03, .05, .07) * (sunL * ndl + amb) + (skyCol() * .3 * pow(clamp(1. - dot(n, -rd), 0., 1.), 3.) + sunL * spec * 1.6) * (1. - .8 * dead);
        } else if (part < 2.5 && dead < .5) {
          col = uBeaconCol * 2.2;
          glow = .9;
        } else if (part < 3.5 || dead > .5) {
          col = vec3(.22, .23, .25) * (sunL * ndl + amb) + sunL * spec * .2;
        } else {
          float on = step(.5, fract(uTime * .8));
          col = vec3(4., .3, .2) * on + vec3(.15, .02, .02);
          glow = on;
        }
        tEnd = ts;
        mat = part > 4.5 ? (what < 1.5 ? ${SPIRE}. : ${ROCK}.) : ${SHIP}.;
        st = vec3(0.);
      }
    }
  }

  // The ring has its place in depth. From the ground it is the farthest thing in the sky, so it goes in
  // before the clouds and the air, which then tint and fade it like anything else far away; from orbit
  // the near half of it is in front of the planet's air, and goes in after.
  float ringA = 0., airTop = uAtmo > 0. ? max(uAtmo, uCloud.y) : 0.;   // how high the air and its clouds go
  vec3 ringC = vec3(0.);
  bool ringFar = false;
  if (uRing.z > 0.) {
    float k = -dot(ro, uRingN) / dot(rd, uRingN);
    if (k > 0. && k < tEnd) {
      vec3 q = ro + rd * k;
      ringA = ringBand(length(q));
      ringC = uRingCol * uSunCol * (hits(sphere(q, uSun, uR)) ? .03 : 1.) * .5;
      vec2 shell = sphere(ro, rd, uR + airTop);
      ringFar = airTop > 0. && shell.y > 0. && k > max(shell.x, 0.);
    }
  }
  if (ringA > 0. && ringFar) {
    // From down in the air it has to be bright to show at all against a daytime sky, as the moon does.
    // From above the air it is drawn as it is, or it would change brightness where it passes behind
    // the planet's edge.
    float deep = 1. - smoothstep(.5, 1., (length(ro) - uR) / airTop);
    col = mix(col, ringC * mix(1., 2.4, deep), ringA);
    st *= 1. - ringA;
    glow *= 1. - ringA;
    if (ringA > .3) mat = ${RING}.;
  }

  float tAir = tEnd;
  if (uCloud.w > 0.) {
    vec2 s = sphere(ro, rd, uR + uCloud.y);
    for (int i = 0; i < 2; i++) {
      float tc = i == 0 ? s.y : s.x;
      if (tc <= 0. || tc >= tEnd) continue;
      vec3 d = normalize(ro + rd * tc);
      float a = cloudAt(d) * uCloud.w * smoothstep(0., 3., tc);
      if (a < .002) continue;   // clear sky here: nothing to light
      col = mix(col, cloudLit(d), a);
      tAir = mix(tAir, tc, a);
      glow *= 1. - a;
      st *= 1. - a;
      if (a > .5) mat = ${CLOUD}.;
    }
    // flying through the layer itself, within 8 m of it
    float band = 1. - smoothstep(0., 8., abs(length(ro) - uR - uCloud.y));
    if (band > 0.) col = mix(col, cloudLit(normalize(ro)), cloudAt(normalize(ro)) * uCloud.w * band * .9);
  }

  vec3 tr;
  float halo = dot(col, vec3(1.));   // the sun's glow, where the ray is in open space
  vec3 sc = atmosphere(ro, rd, tAir, tr);
  col = (col + st * clamp(1. - dot(sc, vec3(4.)), 0., 1.)) * tr + sc;
  // open sky, moon included; and the glow round the sun in space, which is light and not a field of marks
  if (t < 0. && tEnd > 9e4 && mat != ${CLOUD}. && mat != ${RING}. && (dot(sc, vec3(1.)) > .03 || (mat == ${VOID}. && halo > .05))) mat = ${SKY}.;

  // the ring, when it is this side of the air
  if (ringA > 0. && !ringFar) {
    col = mix(col, ringC, ringA);
    if (ringA > .3) mat = ${RING}.;
  }

  float seen = tEnd;   // how far off what is in this pixel is: a beam in front of the sky is not as far as the sky
  for (int i = 0; i < 5; i++) {
    vec4 b = uBeacon[i];
    if (b.w <= 0.) continue;
    // closest approach between the view ray and the beam
    vec3 v = normalize(b.xyz), w = ro - b.xyz;
    float bb = dot(rd, v), dd = dot(rd, w), e = dot(v, w), den = 1. - bb * bb;
    float reach = uR * .5, sb = clamp(den < 1e-4 ? e : (e - bb * dd) / den, 0., reach);
    float tb = clamp(sb * bb - dd, 0., tEnd);
    float dist = length(ro + rd * tb - b.xyz - v * sb), wid = .3 + tb * .0035;
    float g = 1. / (1. + dist * dist / (wid * wid));
    float pulse = .75 + .25 * sin(uTime * 3. - sb * .08 + float(i));
    col += mix(vec3(.6), uBeaconCol, step(.5, b.w)) * b.w * g * pulse * 2.6 * (1. - smoothstep(reach * .35, reach, sb));
    glow = max(glow, g * b.w);
    if (g * b.w > .45) { mat = ${SPIRE}.; seen = min(seen, tb); }
  }

  col = 1. - exp(-col * 1.3);
  o = vec4(pow(max(col, 0.), vec3(.4545)), 1.);
  info = vec4(mat / 255., clamp(glow, 0., 1.), 1. - exp(-seen / 120.), 1.);
}`;

// pass 2: one pixel per character cell. picks the character and its two colours
const CELLS = `#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;
uniform sampler2D uScene, uInfo, uTables;   // uTables: rows 0-1 glyph shapes; row 2 + m, material m's characters
uniform vec2 uGrid;
uniform int uCount;
uniform float uInk;
uniform float uBack[${RAMPS.length}], uGain[${RAMPS.length}];
const float DITHER = .06, FAR_TONE = .6, EDGE_FAR = .75;
layout(location = 0) out vec4 o0;
layout(location = 1) out vec4 o1;
layout(location = 2) out vec4 o2;

void main() {
  vec2 cell = floor(gl_FragCoord.xy);
  vec3 c[6], avg = vec3(0.), dark;
  float d[6], top = 0., lo = 9., low = 9., em = 0., first = 0., nearest = 1.;
  bool mixed = false;   // do the six samples see more than one material
  // the info buffer holds ids, so read whole texels rather than sampling on the corners they share
  ivec2 per = textureSize(uInfo, 0) / ivec2(uGrid), part = per / ivec2(2, 3);
  for (int k = 0; k < 6; k++) {
    vec2 uv = (cell + vec2((float(k & 1) + .5) * .5, 1. - (float(k >> 1) + .5) / 3.)) / uGrid;
    c[k] = textureLod(uScene, uv, 0.).rgb;
    avg += c[k] / 6.;
    vec4 info = texelFetch(uInfo, ivec2(cell) * per + ivec2(k & 1, 2 - (k >> 1)) * part + part / 2, 0);
    em += info.g / 6.;
    nearest = min(nearest, info.b);
    if (k == 0) first = info.r; else mixed = mixed || abs(info.r - first) > .002;
    float l = dot(c[k], vec3(.299, .587, .114));
    if (l < low) { low = l; dark = c[k]; }
    d[k] = min(1., pow(l, 1.5) * 1.15) * uInk;
    top = max(top, d[k]);
    lo = min(lo, d[k]);
  }
  // push the samples apart so an edge inside the cell survives the match
  if (top > 0.) for (int k = 0; k < 6; k++) d[k] = top * pow(d[k] / top, 1.4);

  vec3 a = vec3(d[0], d[1], d[2]), b = vec3(d[3], d[4], d[5]);
  float edge = smoothstep(.1, .3, (top - lo) / uInk);
  // noise with no pattern to it: an ordered one alternates two characters column by column, like a weave
  uint hc = uint(cell.x) * 1973U + uint(cell.y) * 9277U;
  hc ^= hc >> 16; hc *= 0x7feb352dU; hc ^= hc >> 15; hc *= 0x846ca68bU; hc ^= hc >> 16;
  float dither = float(hc >> 8) / 16777216. - .5;
  float mean = (a.x + a.y + a.z + b.x + b.y + b.z) / 6.;
  vec3 ca = a - mean, cb = b - mean;
  float spread = dot(ca, ca) + dot(cb, cb);   // how far the cell is from flat

  // a flat cell takes the character its material uses at this brightness;
  // a cell with an edge in it takes whichever character has the closest shape
  vec4 centre = texelFetch(uInfo, ivec2(cell) * per + per / 2, 0);
  int m = int(centre.r * 255. + .5);
  // inside open sky, cloud or space a change in brightness is a glow, never an edge: the halo round
  // the sun, taken for one, would be a ring of blank cells
  bool air = m == ${SKY} || m == ${CLOUD} || m == ${VOID} || m == ${RING};
  if (air && !mixed) edge = 0.;
  // Distance thins the picture out: far ground is drawn with lighter characters and far outlines are
  // left to the colour behind them, so what is near you is what has texture and hard edges.
  edge *= 1. - EDGE_FAR * nearest;
  float tone01 = mean / uInk * (air ? 1. : mix(1., FAR_TONE, centre.b));
  // the noise spans a whole step between characters, so one character gives way to the next through a
  // stipple of the two, not along a line
  int level = int(clamp(tone01 + dither * (air ? .08 : DITHER) * smoothstep(0., .05, tone01), 0., 1.) * 15. + .5);
  int tone = int(texelFetch(uTables, ivec2(level, 2 + m), 0).r * 255. + .5), glyph = tone;
  float best = 1e9;
  for (int i = 0; i < uCount; i++) {
    if (i != tone && texelFetch(uTables, ivec2(i, 2 + m), 0).g < .5) continue;
    vec3 ga = texelFetch(uTables, ivec2(i, 0), 0).rgb, gb = texelFetch(uTables, ivec2(i, 1), 0).rgb;
    float gm = (ga.x + ga.y + ga.z + gb.x + gb.y + gb.z) / 6.;
    vec3 sa = ga - gm - ca, sb = gb - gm - cb;
    // another character only replaces the tone when it really has the shape of this edge
    if (i != tone && dot(sa, sa) + dot(sb, sb) > .6 * spread) continue;
    vec3 da = ga - a, db = gb - b;
    float e = dot(da, da) + dot(db, db);
    e = i == tone ? e * edge : e + 1. - edge;
    if (e < best) { best = e; glyph = i; }
  }

  vec3 fg = vec3(0.);
  float w = 0.;
  for (int k = 0; k < 6; k++) { fg += c[k] * (d[k] + .001); w += d[k] + .001; }
  fg /= w;
  // ink covers a fraction of the cell, so it is drawn brighter than the scene: a little inside
  // a surface, where it is only texture, and a lot along an edge, where it is the outline
  fg = max(mix(vec3(dot(fg, vec3(.299, .587, .114))), fg, 1.2), 0.) * mix(uGain[m], 2., edge);
  fg /= max(1., max(fg.r, max(fg.g, fg.b)));

  o0 = vec4(fg, float(glyph) / 255.);
  // lighter characters carry less of the brightness, so far off the colour behind them carries more
  o1 = vec4((m == ${VOID} ? dark : avg) * (air ? uBack[m] : mix(uBack[m], max(uBack[m], .9), centre.b)), 1.);
  o2 = vec4(avg * em, 1.);
}`;

// pass 3: stamp the characters at full resolution, add bloom, lay the interface text on top
const FINAL = `#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;
uniform sampler2D uScene, uC0, uC1, uGlow, uAtlas, uText, uFont;
uniform vec2 uRes, uCell, uGrid, uAtlasGrid, uTextCell;
uniform float uRaw;
out vec4 o;

float ink(sampler2D atlas, int g, vec2 f) { return textureLod(atlas, (vec2(float(g % 16), float(g / 16)) + f) / uAtlasGrid, 0.).r; }

void main() {
  vec2 px = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec2 cf = px / uCell, f = fract(cf);
  ivec2 ci = ivec2(cf.x, uGrid.y - 1. - floor(cf.y));
  vec2 uv = vec2(cf.x, uGrid.y - cf.y) / uGrid;

  // interface text, on its own grid. styles: 1 plain, 2 dim, 3 status bar, 4 highlighted block, 5 accent, 6 dim on the bar, 7 accent on the bar, 8 faint
  vec2 tf = px / uTextCell;
  ivec2 tx = ivec2(texelFetch(uText, ivec2(tf), 0).rg * 255. + .5);
  if (tx.y > 0) {
    const vec3 accent = vec3(.36, 1., .84);
    vec3 fg = tx.y == 8 ? vec3(.2) : tx.y == 2 || tx.y == 6 ? vec3(.46) : tx.y == 4 ? vec3(0.) : tx.y == 5 || tx.y == 7 ? accent : vec3(.9);
    vec3 bg = tx.y == 4 ? accent : tx.y == 3 || tx.y >= 6 ? vec3(.085) : vec3(0.);
    o = vec4(mix(bg, fg, ink(uFont, tx.x, fract(tf))), 1.);
    return;
  }
  if (uRaw > .5) { o = vec4(textureLod(uScene, uv, 0.).rgb, 1.); return; }
  vec4 a = texelFetch(uC0, ci, 0);
  // the colour behind the characters is blended between cell centres, so it has no steps
  vec3 col = mix(textureLod(uC1, uv, 0.).rgb, a.rgb, ink(uAtlas, int(a.a * 255. + .5), f));
  // light spilling from what glows. It levels off, so it cannot push a cell to plain white and hide its character
  vec3 bl = textureLod(uGlow, uv, 1.).rgb * .45 + textureLod(uGlow, uv, 2.5).rgb * .35 + textureLod(uGlow, uv, 4.).rgb * .25;
  col += bl / (1. + 1.5 * bl);
  // half a step of noise breaks up the banding a smooth 8-bit gradient would show
  col += (fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(.06711056, .00583715)))) - .5) / 255.;
  o = vec4(col, 1.);
}`;

let scene, cells, final, sceneFbo, cellFbo;
function initGL() {
scene = program(QUAD, SCENE); cells = program(QUAD, CELLS); final = program(QUAD, FINAL);

gl.disable(gl.DITHER);   // material and glyph ids are stored in colour channels
texture(0, gl.TEXTURE_CUBE_MAP, gl.LINEAR);                  // height
texture(1, gl.TEXTURE_CUBE_MAP, gl.LINEAR_MIPMAP_LINEAR);    // normal
texture(2, gl.TEXTURE_CUBE_MAP, gl.LINEAR_MIPMAP_LINEAR);    // albedo
texture(3, gl.TEXTURE_3D, gl.LINEAR, gl.REPEAT);             // noise
const sceneTex = [texture(4, gl.TEXTURE_2D, gl.LINEAR), texture(10, gl.TEXTURE_2D, gl.NEAREST)];
texture(5, gl.TEXTURE_2D, gl.NEAREST);                       // glyph shapes, and each material's characters
const cellTex = [texture(6, gl.TEXTURE_2D, gl.NEAREST), texture(7, gl.TEXTURE_2D, gl.LINEAR), texture(8, gl.TEXTURE_2D, gl.LINEAR_MIPMAP_LINEAR)];
texture(9, gl.TEXTURE_2D, gl.NEAREST);                       // glyph atlas
texture(11, gl.TEXTURE_CUBE_MAP, gl.NEAREST);                // material
texture(12, gl.TEXTURE_CUBE_MAP, gl.NEAREST_MIPMAP_NEAREST); // highest ground and steepest slope in blocks of the height map, in a pyramid
texture(13, gl.TEXTURE_2D, gl.NEAREST);                      // interface text
texture(15, gl.TEXTURE_2D, gl.NEAREST);                      // interface font
gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
{
  const n = new Uint8Array(32 * 32 * 32), r = mulberry(7);
  for (let i = 0; i < n.length; i++) n[i] = r() * 256;
  gl.activeTexture(gl.TEXTURE3);
  gl.texImage3D(gl.TEXTURE_3D, 0, gl.R8, 32, 32, 32, 0, gl.RED, gl.UNSIGNED_BYTE, n);
}
sceneFbo = gl.createFramebuffer(); cellFbo = gl.createFramebuffer();
gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFbo);
sceneTex.forEach((t, i) => gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, t, 0));
gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
gl.bindFramebuffer(gl.FRAMEBUFFER, cellFbo);
cellTex.forEach((t, i) => gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, t, 0));
gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1, gl.COLOR_ATTACHMENT2]);
gl.bindVertexArray(gl.createVertexArray());
}

function uploadPlanet() {
  const cube = (unit, faces, internal, format, type, mips, size = S) => {
    gl.activeTexture(gl.TEXTURE0 + unit);
    for (let f = 0; f < 6; f++) gl.texImage2D(gl.TEXTURE_CUBE_MAP_POSITIVE_X + f, 0, internal, size, size, 0, format, type, faces[f]);
    if (mips) gl.generateMipmap(gl.TEXTURE_CUBE_MAP);
  };
  cube(0, planet.height, gl.R16F, gl.RED, gl.FLOAT, false);
  cube(1, planet.normal, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, true);
  cube(2, planet.albedo, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, true);
  cube(11, planet.mat, gl.R8, gl.RED, gl.UNSIGNED_BYTE, false);
  gl.activeTexture(gl.TEXTURE12);
  planet.tops.forEach((faces, level) => {
    for (let f = 0; f < 6; f++) gl.texImage2D(gl.TEXTURE_CUBE_MAP_POSITIVE_X + f, level, gl.RG16F, SB >> level, SB >> level, 0, gl.RG, gl.FLOAT, faces[f]);
  });
