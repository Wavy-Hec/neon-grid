<div id="pad2"><button data-k="tab" aria-label="map">map</button><button data-k="j" aria-label="log">log</button><button data-k="t" aria-label="today">today</button><button data-k="m" aria-label="sound">sound</button><button data-k="n" aria-label="new">new</button></div>
<div id="notice" hidden>graphics reset, restoring</div>

<script>
'use strict';

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const len = a => Math.hypot(a[0], a[1], a[2]);
const norm = a => mul(a, 1 / (len(a) || 1));
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
  return h >>> 0;
}
function mulberry(a) {
  return () => {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rnd = Math.random;
const rf = (a, b) => a + rnd() * (b - a);
const ri = (a, b) => Math.floor(rf(a, b + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const hex = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16) / 255);
const linear = c => c.map(v => v ** 2.2);

// ---- noise

let noise;
// the table Perlin noise is built on: the numbers 0..255 in the planet's own order, twice over
function shuffled() {
  const p = new Uint8Array(512);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1)), t = p[i];
    p[i] = p[j]; p[j] = t;
  }
  for (let i = 0; i < 256; i++) p[i + 256] = p[i];
  return p;
}
function noiseOf(p) {
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  const grad = (h, x, y, z) => {
    h &= 15;
    const u = h < 8 ? x : y, v = h < 4 ? y : h === 12 || h === 14 ? x : z;
    return (h & 1 ? -u : u) + (h & 2 ? -v : v);
  };
  return (x, y, z) => {
    const fx = Math.floor(x), fy = Math.floor(y), fz = Math.floor(z);
    x -= fx; y -= fy; z -= fz;
    const xi = fx & 255, yi = fy & 255, zi = fz & 255;
    const u = fade(x), v = fade(y), w = fade(z);
    const a = p[xi] + yi, aa = p[a] + zi, ab = p[a + 1] + zi;
    const b = p[xi + 1] + yi, ba = p[b] + zi, bb = p[b + 1] + zi;
    return lerp(
      lerp(lerp(grad(p[aa], x, y, z), grad(p[ba], x - 1, y, z), u),
           lerp(grad(p[ab], x, y - 1, z), grad(p[bb], x - 1, y - 1, z), u), v),
      lerp(lerp(grad(p[aa + 1], x, y, z - 1), grad(p[ba + 1], x - 1, y, z - 1), u),
           lerp(grad(p[ab + 1], x, y - 1, z - 1), grad(p[bb + 1], x - 1, y - 1, z - 1), u), v), w);
  };
}
function fbm(x, y, z, oct) {
  let s = 0, a = 1, n = 0;
  for (let i = 0; i < oct; i++) {
    s += a * noise(x, y, z); n += a;
    a *= .5; x *= 2.02; y *= 2.02; z *= 2.02;
  }
  return s / n;
}
function ridge(x, y, z, oct) {
  let s = 0, a = 1, n = 0, w = 1;
  for (let i = 0; i < oct; i++) {
    let v = 1 - Math.abs(noise(x, y, z));
    v *= v * w; w = clamp(v * 1.6, 0, 1);
    s += a * v; n += a;
    a *= .5; x *= 2.1; y *= 2.1; z *= 2.1;
  }
  return s / n;
}

// ---- planets

const S = 1024;   // cube map face size

// Every surface is drawn with its own set of characters, listed light to heavy. Land is dots, commas and
// crosses. The ones that run together into long lines across the screen (- ~ =) are kept off the land:
// they are for what really is level and moves, water and lava (dim cloud has ~ too, the lander - and =).
const VOID = 0, SKY = 1, CLOUD = 2, WATER = 3, SAND = 4, GRASS = 5, DRY = 6, ROCK = 7, SNOW = 8, TREE = 9, LAVA = 10, ICE = 11, CRYSTAL = 12, SPIRE = 13, SHIP = 14, RING = 15, AURORA = 16, METEOR = 17;
const RAMPS = [
  " .'`+*",       // void
  ' .',           // sky
  ' .:~',         // cloud
  ' .-~=',        // water
  ' .,:;',        // sand
  ' .,;+',        // grass
  ' .,:;+',       // dry ground
  ' .:^+#',       // rock
  ' .:+*',        // snow
  ' .:+*%&#',     // tree
  ' .:~=*%#@',    // lava
  ' .,:;+',       // ice
  ' .:+<>*#',     // crystal
  ' .:|!#',       // spire
  ' .:-=+*#',     // ship
  ' .:;',         // ring
  " .':!|",       // aurora: its rays are strokes
  ' .-+*',        // meteor
];
// how much of the surface colour fills the cell behind the character. high values read as
// solid shapes with a light texture, low values as loose characters on black
const BACKING = [.9, .92, .9, .75, .8, .8, .8, .78, .85, .82, .5, .8, .5, .6, .78, .9, .85, .9];
// how much brighter than the scene the characters are drawn on a flat surface. low on sky and
// cloud, so their dots read as a fine grain over the colour rather than a pattern of their own
const GAIN = [1.45, 1.12, 1.15, 1.45, 1.45, 1.45, 1.45, 1.45, 1.45, 1.45, 1.45, 1.45, 1.45, 1.45, 1.45, 1.15, 1.25, 1.45];
// how far a material's middle tones are lifted toward its heavier characters (1 for none). Firs are
// dark, and without it the lit ends of their branches would get the same dots as their shade
const LIFT = [1, 1, 1, 1, 1, 1, 1, 1, 1, .72, 1, 1, 1, 1, 1, 1, 1, 1];

// heights are metres, colour stops run from the shore (0) to the highest peak (1),
// tau is how much red/green/blue light the air scatters straight overhead,
// ground is the material of the shore, the wetter land and the drier land
const KINDS = [
  {
    label: 'temperate', cf: 1.2, bias: [-.08, .1], low: 8, mount: 34, deep: 15, rough: 1.5,
    ramp: [[0, '#d8c48c'], [.05, '#7da04a'], [.3, '#3e6d34'], [.58, '#6b6a5a'], [1, '#8d8a80']],
    dry: [[0, '#dfcf9c'], [.07, '#aaa35c'], [.35, '#80804c'], [.65, '#7a7361'], [1, '#8d8a80']],
    rock: '#59544c', ice: '#f1f5fa', snow: .6, polar: 1.3, bed: '#c9b783', ground: [SAND, GRASS, DRY],
    sea: 1, deepCol: '#051d44', shallow: '#1b8088',
    tau: [.05, .12, .3], atmo: .36, cover: [.45, .6], cloudCol: '#ffffff',
    props: [{ mat: TREE, n: 7000, col: '#356b30', r: [1.3, 2.1], h: [4, 9], hn: [.03, .42], wet: .42 }],
    signal: '#ff6a3d',
  },
  {
    label: 'ocean', cf: 1.7, bias: [-.3, -.18], low: 7, mount: 24, deep: 18, rough: 1.2,
    ramp: [[0, '#f0e2b0'], [.08, '#69b05a'], [.4, '#2f7a45'], [.75, '#6f7a62'], [1, '#8d8a80']],
    dry: [[0, '#f4e8c0'], [.1, '#a6c064'], [.45, '#5d8a4a'], [.75, '#7a7361'], [1, '#8d8a80']],
    rock: '#5e5a50', ice: '#f1f5fa', snow: .9, polar: .8, bed: '#e6d6a0', ground: [SAND, GRASS, GRASS],
    sea: 1, deepCol: '#03254f', shallow: '#22b8b0',
    tau: [.045, .11, .28], atmo: .36, cover: [.38, .5], cloudCol: '#ffffff',
    props: [{ mat: TREE, n: 5000, col: '#3a8538', r: [1.3, 2], h: [5, 10], hn: [.04, .6], wet: .3 }],
    signal: '#ffa53a',
  },
  {
    label: 'arid', cf: 1.4, bias: [.22, .4], low: 9, mount: 26, deep: 0, rough: 1.1, terrace: 5,
    ramp: [[0, '#e9dcb8'], [.04, '#d9a15f'], [.3, '#c26a3a'], [.6, '#8f4a2e'], [1, '#6e3b2a']],
    dry: [[0, '#f1e6c8'], [.05, '#e3b877'], [.35, '#cf8a4d'], [.65, '#9a5a3a'], [1, '#74432f']],
    rock: '#633c2c', ice: '#f4ead8', snow: 2, polar: 0, bed: '#e9dcb8', ground: [SAND, DRY, SAND],
    sea: 0, deepCol: '#000000', shallow: '#000000',
    tau: [.17, .11, .06], atmo: .33, cover: [.64, .76], cloudCol: '#f3dcc4',
    props: [{ mat: SPIRE, n: 2200, col: '#8a4f33', r: [2.5, 5], h: [8, 20], hn: [.02, .5], wet: 0, flat: 1 }],
    signal: '#7cc8ff',
  },
  {
    label: 'frozen', cf: 1.3, bias: [.02, .22], low: 6, mount: 30, deep: 0, rough: 1,
    ramp: [[0, '#b5dcea'], [.05, '#dfeef5'], [.4, '#f4f8fb'], [.7, '#9fb4c4'], [1, '#7b8ea0']],
    dry: [[0, '#9fcde2'], [.06, '#cfe4ee'], [.4, '#e9f1f6'], [.7, '#8fa5b6'], [1, '#74879a']],
    rock: '#5b6b7a', ice: '#ffffff', snow: .5, polar: .5, bed: '#b5dcea', ground: [ICE, SNOW, ICE],
    sea: 0, deepCol: '#000000', shallow: '#000000',
    tau: [.03, .07, .14], atmo: .34, cover: [.5, .66], cloudCol: '#eef6ff',
    props: [{ mat: CRYSTAL, n: 3200, col: '#7ff2ff', r: [.9, 1.6], h: [4, 13], hn: [0, .5], wet: .5, glow: .8 }],
    signal: '#ff4f6a',
  },
  {
    label: 'molten', cf: 1.5, bias: [-.04, .12], low: 6, mount: 32, deep: 6, rough: 2.2,
    ramp: [[0, '#3a1a12'], [.05, '#1e1615'], [.4, '#2c2525'], [.7, '#3b3333'], [1, '#4b4141']],
    dry: [[0, '#40190e'], [.06, '#251917'], [.4, '#302727'], [.7, '#3b3333'], [1, '#4b4141']],
    rock: '#161313', ice: '#5c5252', snow: .78, polar: 0, bed: '#3a1208', ground: [ROCK, ROCK, ROCK], veins: '#ff7a1a',
    sea: 2, deepCol: '#000000', shallow: '#000000',
    tau: [.1, .05, .03], atmo: .36, cover: [.5, .62], cloudCol: '#40302c',
    props: [{ mat: SPIRE, n: 1500, col: '#231c1c', r: [2, 4], h: [6, 16], hn: [.03, .5], wet: 0 }],
    signal: '#a6dcff',
  },
  {
    // a moor: moor grass by the water, heather in flower above it, copper bracken on the dry slopes, lichen
    // on the heights, under a periwinkle sky. Its firs are dark by day and at night glow with foxfire
    label: 'overgrown', cf: 1.25, bias: [-.05, .12], low: 8, mount: 30, deep: 14, rough: 1.6,
    ramp: [[0, '#cbbda2'], [.05, '#7f8a4a'], [.2, '#86507a'], [.45, '#68485f'], [.72, '#6b6a58'], [1, '#9a968a']],
    dry: [[0, '#d2c3a4'], [.06, '#a8803e'], [.3, '#96562f'], [.6, '#62524a'], [1, '#9a968a']],
    rock: '#4a4248', ice: '#efe9f0', snow: .68, polar: 1, bed: '#a89a84', ground: [SAND, GRASS, DRY],
    sea: 1, deepCol: '#062a2b', shallow: '#3f8a7e',
    tau: [.07, .09, .17], atmo: .38, cover: [.45, .6], cloudCol: '#f4f0f4',
    props: [{ mat: TREE, n: 7000, col: '#2c4a3c', r: [1.2, 2], h: [3, 8], hn: [.03, .45], wet: .45, glow: .35, glowCol: '#9ef07c', night: true }],
    signal: '#ffd23f',
  },
  {
    label: 'airless', cf: 1.6, bias: [.3, .5], low: 5, mount: 22, deep: 0, rough: 1, craters: 90,
    ramp: [[0, '#6f6b66'], [.3, '#8a8680'], [.7, '#a39e97'], [1, '#b8b3ab']],
    dry: [[0, '#625c55'], [.3, '#7d766d'], [.7, '#99938a'], [1, '#b8b3ab']],
    rock: '#4f4c48', ice: '#ffffff', snow: 2, polar: 0, bed: '#6f6b66', ground: [DRY, ROCK, DRY],
    sea: 0, deepCol: '#000000', shallow: '#000000',
    tau: [0, 0, 0], atmo: 0, cover: [1, 1], cloudCol: '#000000',
    props: [{ mat: CRYSTAL, n: 500, col: '#ffb040', r: [.9, 1.5], h: [3, 9], hn: [0, .6], wet: .55, glow: .9 }],
    signal: '#ff3a2a',
  },
];
const SUNS = [[1.3, 1.24, 1.14], [1.3, 1.24, 1.14], [1.4, 1.08, .8], [1.14, 1.22, 1.38]];

const planet = { height: [], normal: [], albedo: [], mat: [] };
for (let f = 0; f < 6; f++) {
  planet.height.push(new Float32Array(0));   // filled by buildFaces
  planet.normal.push(new Uint8Array(S * S * 4));
  planet.albedo.push(new Uint8Array(S * S * 4));
  planet.mat.push(new Uint8Array(S * S));
}
const wet = new Uint8Array(S * S * 6);

// the point (s, t), each -1..1, on cube face f; same face order and orientation as WebGL's cube maps
const faceVec = (f, s, t) => f === 0 ? [1, -t, -s] : f === 1 ? [-1, -t, s] : f === 2 ? [s, 1, t]
                           : f === 3 ? [s, -1, -t] : f === 4 ? [s, -t, 1] : [-s, -t, -1];

// faceVec is linear in s and t, so a face is three vectors: its centre and the steps along s and t
const AXES = [0, 1, 2, 3, 4, 5].map(f => {
  const a = faceVec(f, 0, 0);
  return [...a, ...sub(faceVec(f, 1, 0), a), ...sub(faceVec(f, 0, 1), a)];
});
// unit direction of the centre of texel (i, j) of face f
function faceDir(f, i, j, out = [0, 0, 0]) {
  const A = AXES[f], s = (2 * i + 1) / S - 1, t = (2 * j + 1) / S - 1, l = 1 / Math.sqrt(1 + s * s + t * t);
  out[0] = (A[0] + s * A[3] + t * A[6]) * l;
  out[1] = (A[1] + s * A[4] + t * A[7]) * l;
  out[2] = (A[2] + s * A[5] + t * A[8]) * l;
  return out;
}
// the directions of one whole face at a time, for the passes that visit every texel and its neighbours
const D = new Float32Array(S * S * 3);
function faceDirs(f) {
  const d = [0, 0, 0];
  for (let j = 0, k = 0; j < S; j++) for (let i = 0; i < S; i++, k += 3) {
    faceDir(f, i, j, d);
    D[k] = d[0]; D[k + 1] = d[1]; D[k + 2] = d[2];
  }
}

function cubeUV(d) {
  const [x, y, z] = d, ax = Math.abs(x), ay = Math.abs(y), az = Math.abs(z);
  let f, s, t;
  if (ax >= ay && ax >= az) { f = x > 0 ? 0 : 1; s = (x > 0 ? -z : z) / ax; t = -y / ax; }
  else if (ay >= az) { f = y > 0 ? 2 : 3; s = x / ay; t = (y > 0 ? z : -z) / ay; }
  else { f = z > 0 ? 4 : 5; s = (z > 0 ? x : -x) / az; t = -y / az; }
  return [f, (s + 1) * .5 * S - .5, (t + 1) * .5 * S - .5];
}
// height of texel (i, j) of face f. One texel past the edge it reads the neighbouring face, the way
// the GPU's seamless cube filtering does, so what you stand on matches what is drawn across the seams
function texelH(f, i, j) {
  if (i >= 0 && i < S && j >= 0 && j < S) return planet.height[f][j * S + i];
  const [g, u, v] = cubeUV(faceVec(f, (2 * i + 1) / S - 1, (2 * j + 1) / S - 1));
  return planet.height[g][clamp(Math.round(v), 0, S - 1) * S + clamp(Math.round(u), 0, S - 1)];
}
function heightAt(d) {
  const [f, u, v] = cubeUV(d), x = Math.floor(u), y = Math.floor(v), fx = u - x, fy = v - y;
  return lerp(lerp(texelH(f, x, y), texelH(f, x + 1, y), fx), lerp(texelH(f, x, y + 1), texelH(f, x + 1, y + 1), fx), fy);
}
// material under a direction, nearest texel
function matAt(d) {
  const [f, u, v] = cubeUV(d);
  return planet.mat[f][clamp(Math.round(v), 0, S - 1) * S + clamp(Math.round(u), 0, S - 1)];
}
// the surface the ship stops at: terrain, or the sea if there is one
const groundAt = d => Math.max(heightAt(d), planet.sea ? 0 : -1e9);

function rampTable(stops) {
  const t = new Float32Array(256 * 3), cols = stops.map(s => hex(s[1]));
  for (let i = 0; i < 256; i++) {
    const x = i / 255;
    let k = 1;
    while (k < stops.length - 1 && x > stops[k][0]) k++;
    t.set(mix3(cols[k - 1], cols[k], smooth(stops[k - 1][0], stops[k][0], x)), i * 3);
  }
  return t;
}

// Worlds are named with plain words from rock, weather and the sea, and a number from a catalogue. A seed
// that is such a word already (glacier, kelp-412) names its world itself; any other gets one of these.
const NOUNS = ['basalt', 'flint', 'shale', 'scree', 'tor', 'esker', 'moraine', 'drumlin', 'tarn', 'fell', 'loess', 'marl',
  'chert', 'gneiss', 'karst', 'tuff', 'slate', 'schist', 'gabbro', 'butte', 'talus', 'ochre', 'cinder', 'pumice',
  'squall', 'sleet', 'gale', 'haar', 'rime', 'hail', 'thaw', 'cirrus', 'nimbus', 'shoal', 'skerry', 'firth',
  'sound', 'brine', 'swell', 'strand', 'ebb', 'neap', 'wrack', 'delta'];
function worldName(seed) {
  const m = /^([a-z]+)(?:-(\d+))?$/.exec(seed), r = mulberry(hashStr(seed + ' name'));
  const [word, num] = m ? [m[1], m[2]] : [NOUNS[Math.floor(r() * NOUNS.length)], String(1 + Math.floor(r() * 999))];
  return word[0].toUpperCase() + word.slice(1) + (num ? ' ' + num : '');
}
const onSphere = () => {
  const z = rf(-1, 1), a = rf(0, Math.PI * 2), r = Math.sqrt(1 - z * z);
  return [r * Math.cos(a), z, r * Math.sin(a)];
};

function design(seed) {
  rnd = mulberry(hashStr(seed));
  const perm = shuffled();
  noise = noiseOf(perm);
  const K = pick(KINDS), R = Math.round(rf(480, 660));
  // Mountains, roughness and forests keep the size in metres they have on a planet of radius 285 m, so a
  // bigger planet has more of them rather than bigger ones. Continents grow a little with the planet.
  const k = R / 285;
  Object.assign(planet, {
    seed, K, R, k, kc: k ** .6, perm, sea: K.sea,
    // names used to be drawn from this stream here, four or five numbers: they are still taken, so every
    // world after them stays as it was
    name: (rnd(), rnd(), rnd() < .35 && rnd(), rnd(), worldName(seed)),
    lush: rampTable(K.ramp), dry: rampTable(K.dry),
    atmo: K.atmo * R, cover: rf(K.cover[0], K.cover[1]), cloudAlt: R * rf(.085, .11), cloudF: rf(2.6, 3.6),
    bias: rf(K.bias[0], K.bias[1]),
    off: [rf(-99, 99), rf(-99, 99), rf(-99, 99)],
    dayLen: rf(420, 600), tilt: rf(-.35, .35), sunCol: pick(SUNS), key: ri(0, 11),
    ring: rnd() < .3 && {
      n: norm([rf(-.5, .5), 1, rf(-.5, .5)]), inner: R * rf(1.5, 1.8), outer: R * rf(2.2, 2.7),
      col: linear(hex(pick(['#d8c8a8', '#b8c4d8', '#e0b090']))), alpha: rf(.5, .85), seed: rf(0, 50),
    },
    moon: rnd() < .6 && { dist: R * rf(9, 11), r: R * rf(.2, .34), speed: rf(.006, .015), phase: rf(0, 6), incl: rf(-.4, .4) },
    craters: Array.from({ length: Math.round((K.craters || 0) * k) }, () => ({ d: onSphere(), r: rf(.03, .16) / Math.sqrt(k) })),
  });

  // to 35 minutes, and its shadow crosses the planet. A random stream of its own, so nothing else moves.
  const ec = mulberry(hashStr(seed + ' eclipse'));

    planet.moon.r = Math.max(planet.moon.r, planet.R * .3);

  // ground is snow or ice, on their mountains and round their poles

  // grey that leans toward its land

}

function terrain(x, y, z, craters) {
  const K = planet.K, [ox, oy, oz] = planet.off, cf = K.cf * planet.kc, mf = 3.1 * planet.k, df = 13 * planet.k;
  const land = (fbm(x * cf + ox, y * cf + oy, z * cf + oz, 5) + planet.bias) * 2.4;
  let h;
  if (land > 0) {
    const m = ridge(x * mf + oy, y * mf + oz, z * mf + ox, 4);
    h = land * K.low + m * m * K.mount * Math.min(1, land * 2.2);
  } else h = land * K.deep;
  h += fbm(x * df + oz, y * df + ox, z * df + oy, 2) * K.rough * (land > 0 ? 1 : .35);
  if (K.terrace) {
    const s = h / K.terrace, f = Math.floor(s);
    h = (f + smooth(.3, .7, s - f)) * K.terrace;

  for (const c of craters) {
    const q = Math.sqrt(Math.max(0, 2 - 2 * (x * c.d[0] + y * c.d[1] + z * c.d[2]))) / c.r;
    if (q > 1.7) continue;
    const depth = c.r * planet.R * .22;
    h += (q < 1 ? depth * (q * q - 1) : 0) + depth * .4 * Math.exp(-(((q - 1) / .2) ** 2));
  }
  return K.sea ? h : Math.max(h, 0);
}

// Heights and wetness of one cube face. It uses nothing but the planet's numbers and the functions
// above, so it runs unchanged in a worker (see WORKER below).
function faceHeights(f, H, W) {
  const [ox, oy, oz] = planet.off, wf = 2.7 * planet.kc, d = [0, 0, 0], c = [0, 0, 0], B = 64;

  for (let bj = 0; bj < S; bj += B) for (let bi = 0; bi < S; bi += B) {
    faceDir(f, bi + B / 2 - .5, bj + B / 2 - .5, c);
    let reach = 0;
    for (const [ci, cj] of [[bi, bj], [bi + B, bj], [bi, bj + B], [bi + B, bj + B]]) {
      faceDir(f, ci - .5, cj - .5, d);
      reach = Math.max(reach, Math.acos(Math.min(1, c[0] * d[0] + c[1] * d[1] + c[2] * d[2])));
    }

    const near = planet.craters.filter(q => Math.acos(clamp(c[0] * q.d[0] + c[1] * q.d[1] + c[2] * q.d[2], -1, 1)) < reach + 2 * Math.asin(Math.min(1, .85 * q.r)) + .001);

      faceDir(f, i, j, d);
      H[k] = terrain(d[0], d[1], d[2], near);
      W[k] = clamp(fbm(d[0] * wf - ox, d[1] * wf - oy, d[2] * wf - oz, 2) * 1.7 + .5, 0, 1) * 255;
    }
  }
}

// The six faces are worked out side by side in workers where the browser allows it; a worker is this
// page's own functions, pasted into a script of its own.
const WORKER = `'use strict';
const S = ${S}, AXES = ${JSON.stringify(AXES)};
const clamp = ${clamp}, lerp = ${lerp}, smooth = ${smooth};
${noiseOf}
${fbm}
${ridge}
${terrain}
${faceDir}
${faceHeights}
let noise, planet;
onmessage = e => {
  planet = e.data.planet;
  noise = noiseOf(planet.perm);
  const H = new Float32Array(S * S), W = new Uint8Array(S * S);
  faceHeights(e.data.f, H, W);
  postMessage({ f: e.data.f, id: e.data.id, H, W }, [H.buffer, W.buffer]);
};`;
let pool = null, job = 0;
function workers() {
  if (pool) return pool;
  pool = [];
  try {
    const url = URL.createObjectURL(new Blob([WORKER], { type: 'text/javascript' }));
    for (let i = clamp((navigator.hardwareConcurrency || 2) - 1, 1, 6); i > 0; i--) pool.push(new Worker(url));

// fills planet.height and wet for all six faces; tick(n) is called as each face is done
async function buildFaces(tick) {
  const id = ++job, { K, off, bias, craters, R, k, kc, perm } = planet, todo = [0, 1, 2, 3, 4, 5], got = new Set();
  const keep = (f, H, W) => { planet.height[f] = H; wet.set(W, f * S * S); got.add(f); tick(got.size); };
  const ws = workers();
  let live = true;
  if (ws.length) await new Promise(finish => {
    let busy = 0, timer = 0;
    const done = () => { clearTimeout(timer); finish(); };
    // A browser that will not run the worker, or one that has gone quiet (killed for memory, say): stop
    // using workers, for good, and do the rest here. A late answer must not land after the props have
    // been stamped into the heights, so none is taken from then on.
    const fail = () => { if (live) { live = false; ws.forEach(x => x.terminate()); pool = []; done(); } };
    const watch = () => { clearTimeout(timer); timer = setTimeout(fail, 20000); };
    const next = w => {
      if (!todo.length) { if (!busy) done(); return; }
      busy++;
      w.postMessage({ f: todo.shift(), id, planet: { K, off, bias, craters, R, k, kc, perm } });
    };
    for (const w of ws) {
      w.onmessage = e => {
        if (!live || e.data.id !== id) return;   // an answer for a planet we have since left
        busy--;
        watch();
        keep(e.data.f, e.data.H, e.data.W);
        next(w);
      };
      w.onerror = fail;
      next(w);
    }
    watch();
  });
  // whatever the workers did not do: all of it if there are none, the rest if one failed
  for (let f = 0; f < 6; f++) {
    if (got.has(f)) continue;
    await nextFrame();
    const H = new Float32Array(S * S), W = new Uint8Array(S * S);
    faceHeights(f, H, W);
    keep(f, H, W);
  }
}

// Besides the signals a planet has a few things to come upon: a ring of standing stones on a rise, the
// wreck of a lander on a flat, a cairn on the highest ground. Where they go comes from the seed, by a
// random stream of their own, so nothing else about the planet depends on them; one that finds no place
// is left out. Each is found by walking up to it.
const HENGE = 4.4;   // radius of the ring of standing stones, metres
function placeFinds() {
  const r = mulberry(hashStr(planet.seed + ' finds')), R = planet.R, list = [];
  const any = () => { const z = r() * 2 - 1, a = r() * Math.PI * 2, q = Math.sqrt(1 - z * z); return [q * Math.cos(a), z, q * Math.sin(a)]; };
  const over = (a, b) => Math.acos(clamp(dot(a, b), -1, 1)) * R;   // metres over the ground between two directions

    return norm(add(d, mul(add(mul(e, Math.cos(a * 6.2832)), mul(g, Math.sin(a * 6.2832))), m / R)));

      const q = beside(d, m * part, i / 8);

      const q = norm(add(d, mul(add(mul(e, x), mul(g, y)), 1 / R)));

  let best = null;

  // never so low that the tip of the peak shows through it

// The highest ground, and how much of the surface is sea. The planet is measured before its landmark is
// made: colours, snow and the props all go by the peak, and a volcano taller than that would drag every
// one of them down the mountains.
function measure() {
  let top = 0, low = 0;
  const land = [];
  for (const H of planet.height) for (let i = 0; i < H.length; i++) {
    if (H[i] > top) top = H[i];
    if (H[i] <= 0) low++;
    else if (i % 61 === 0) land.push(H[i]);
  }
  planet.peak = top;
  planet.flat = low / (6 * S * S);
  // the heights that half and nine tenths of the land lie below: lowland, hills and mountains on the chart
  land.sort((a, b) => a - b);
  planet.shelf = [land[land.length >> 1] || 0, land[Math.floor(land.length * .9)] || 0];
}

// ---- landmarks
//
// Every planet has one landform of its own, by its kind. It is a function of direction, like the terrain,
// and is laid over the finished height map, so it crosses the seams of the cube as the terrain does. Its
// place is chosen from the seed by a random stream of its own, after the planet has been measured, so
// nothing else about the planet depends on it.
//
// Each kind says what it is (what), how far from its middle it changes the ground (r, and wide for a long
// one, in metres), how well a place suits it (fit: higher is better) and its shape: the height at a point
// u metres along it and v metres across, where the terrain's own height is h. fit and settle are handed
// at(u, v), the terrain's height at such a point. span(a, b) is a number between a and b from the
// landform's own random stream. wob(p, m) is the planet's noise at direction p in features about m metres
// across, which is what keeps the edges from being drawn with a ruler.

const mean = a => a.reduce((x, y) => x + y) / a.length;

const around = (at, m) => Array.from({ length: 8 }, (_, i) => at(m * Math.cos(i * .785), m * Math.sin(i * .785)));
// An outline that is no circle: round it the radius swells and shrinks in two, three and five lobes, sized
// and turned by the seed, by no more than .28 either way. Returns what to multiply a distance from the
// middle by.
const lobes = span => {
  const k = [.06, .05, .03].flatMap(a => { const s = span(a, 2 * a), t = span(0, 6.2832); return [s * Math.cos(t), s * Math.sin(t)]; });
  return (u, v, rho) => {

  };
};
// The course of a long landform: for every 4 m along it, whatever line(p, end) says of the point p on its
// straight middle line, where end runs from 0 at the middle to 1 at either tip. Returns a function of u
// that reads it back.

  };

const LANDFORMS = {

function placeBeacons() {
  const list = [];
  for (let i = 0; i < 6000 && list.length < 5; i++) {
    const d = onSphere(), h = heightAt(d), side = norm(cross(d, [.3, .9, .2]));
    if (h < 1.5 || h > planet.peak * (i < 3000 ? .5 : 1) || deep(d)) continue;
    if (Math.abs(heightAt(norm(add(d, mul(side, 2.7 / planet.R)))) - h) > 1.5) continue;
    if (list.some(b => dot(b.dir, d) > (i < 2000 ? .5 : i < 4000 ? .8 : .96))) continue;
    list.push({ dir: d, base: mul(d, planet.R + h), got: false });

const canvas = document.getElementById('view');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
if (!gl) {
  document.body.textContent = 'planet.txt needs WebGL 2';

}

function shader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  return s;
}
// Starts a compile and link without asking how it went: asking makes the browser wait, and the three
// programs can be compiled side by side if nobody asks until all three have been started.
function program(vs, fs) {
  const p = gl.createProgram(), v = shader(gl.VERTEX_SHADER, vs), f = shader(gl.FRAGMENT_SHADER, fs);
  gl.attachShader(p, v); gl.attachShader(p, f);
  gl.linkProgram(p);
  return { p, v, f, u: {} };
}
function linked({ p, v, f, u }) {
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error([gl.getProgramInfoLog(p), gl.getShaderInfoLog(v), gl.getShaderInfoLog(f)].join('\n'));
  for (let i = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS) - 1; i >= 0; i--) {
    const name = gl.getActiveUniform(p, i).name.replace('[0]', '');
    u[name] = gl.getUniformLocation(p, name);

  const t = gl.createTexture();

  gl.bindTexture(target, t);
  gl.texParameteri(target, gl.TEXTURE_MIN_FILTER, min);
  // a nearest min filter gets a nearest mag filter too: the maps of high ground must be read a block at a time
  gl.texParameteri(target, gl.TEXTURE_MAG_FILTER, min === gl.NEAREST || min === gl.NEAREST_MIPMAP_NEAREST ? gl.NEAREST : gl.LINEAR);
  gl.texParameteri(target, gl.TEXTURE_WRAP_S, wrap);
  gl.texParameteri(target, gl.TEXTURE_WRAP_T, wrap);
  if (target === gl.TEXTURE_3D) gl.texParameteri(target, gl.TEXTURE_WRAP_R, wrap);

}

        if (room > 0. && a > room / across) lv = min(lv + 1., floor(roof));
        room = room > 0. ? max(room - go * across, 0.) : min(room + go * across, 0.);
        roof = min(roof + .25, 6.);
        t += go; a = -1e9;
        continue;
      }
    }
    vec2 hi = textureLod(uTops, q, lv).rg;
    float c = alt - hi.x, block = uBlock * exp2(lv);
    if (9. * c >= res * 15.) {
      // above everything near by more than the soft edge: nothing on the way can deepen the shadow until
      // the ray has come down to within that edge of it, or gone a block sideways
      air = true; room = 0.;
      float side = block / across, drop = (c - res * 15. / 9.) / max(-rise, 1e-3);
      t += max(min(side, drop), .6); a = -1e9;
      if (side < drop) lv = min(lv + 1., floor(roof));
      roof = min(roof + .25, 6.);
      continue;
    }
    air = false;
    if (hi.y >= 1.7 && lv > 0.) { roof = lv - 1.; lv = max(lv - 2., 0.); }
    else room = hi.y < 1.7 ? block : -3. * block;
  }
  return clamp(res, 0., 1.);
}

float cloudAt(vec3 d);
float ringBand(float r);
// what dims the sun at p besides the terrain: cloud, the ring's shadow, the parked ship
// How much of the sun's disc the moon leaves showing from p. The two discs are taken as flat circles in the
// sky; the part of the sun's that the moon's covers is the area where they overlap.
const float SUN_R = .02;   // the sun's radius in the sky, radians
float sunShows(vec3 p) {
  if (uEclipse <= 0.) return 1.;
  vec3 m = uMoon.xyz - p;
  float dm = length(m), pS = SUN_R, pO = asin(clamp(uMoon.w / dm, 0., 1.)), d = atan(length(cross(uSun, m)), dot(uSun, m));
  if (d >= pS + pO) return 1.;
  if (d <= abs(pO - pS)) return pO >= pS ? 0. : 1. - pO * pO / (pS * pS);
  float d1 = (pS * pS - pO * pO + d * d) / (2. * d), d2 = d - d1;
  float A = pS * pS * acos(clamp(d1 / pS, -1., 1.)) - d1 * sqrt(max(pS * pS - d1 * d1, 0.))
          + pO * pO * acos(clamp(d2 / pO, -1., 1.)) - d2 * sqrt(max(pO * pO - d2 * d2, 0.));
  return clamp(1. - A / (3.14159265 * pS * pS), 0., 1.);
}

float skyShade(vec3 p) {
  float v = sunShows(p);
  if (uCloud.w > 0. && length(p) < uR + uCloud.y) {
    vec2 s = sphere(p, uSun, uR + uCloud.y);
    v *= 1. - .75 * uCloud.w * cloudAt(normalize(p + uSun * s.y));
  }
  if (uRing.z > 0.) {
    float k = -dot(p, uRingN) / dot(uSun, uRingN);
    if (k > 0.) v *= 1. - .8 * ringBand(length(p + uSun * k));
  }
  if (uShip.w > 0.) {
    vec3 sc = uShip.xyz - p;
    float along = dot(sc, uSun);
    if (along > 0.) v *= mix(.35, 1., smoothstep(1.1, 1.8, length(sc - uSun * along)));
  }
  // a wreck and a cairn throw a soft patch of shade the same way
  for (int k = 0; k < 3; k++) {
    if (uFind[k].w < 1.5) continue;
    vec3 sc = uFind[k].xyz + normalize(uFind[k].xyz) * .6 - p;
    float along = dot(sc, uSun), wide = uFind[k].w < 2.5 ? 1.2 : .5;
    if (along > 0.) v *= mix(.4, 1., smoothstep(wide, wide + .7, length(sc - uSun * along)));
  }
  return v;
}

float cloudAt(vec3 d) {
  vec3 q = d * uCloud.z + vec3(uTime * .006, 0., uTime * .004);
  float w = fbm(q * .6 + 11.);
  return smoothstep(uCloud.x, uCloud.x + .2, fbm(q + w * 1.4));
}
vec3 sunTint(float mu, float k) { return exp(-uBeta * uAtmo * .25 * k / max(mu + .15, .05)); }
vec3 skyCol() { return uBeta / max(max(uBeta.r, uBeta.g), max(uBeta.b, 1e-6)) * uSkyLit; }

// Needles: the sun; the sky from above, in its colour; light thrown up from the ground; and with the sun
// behind them, light coming through the thin outer part of a bough in the needles' own colour. tips is 1
// out at the end of a branch and 0 in the dark middle of the tree; sun is the sunlight that reaches the
// point, and thru the sunlight that reaches the bough it shines through.
// a fireball lights the whole land for a moment, from where it is in the sky
vec3 flash(vec3 n) { return uFlash.w > 0. ? vec3(.8, 1., .75) * uFlash.w * max(dot(n, uFlash.xyz), 0.) : vec3(0.); }

vec3 needles(vec3 alb, vec3 n, vec3 up, float mu, vec3 sun, vec3 thru, float tips, vec3 rd) {
  float day = smoothstep(-.25, .25, mu), facing = dot(n, up) * .5 + .5;
  vec3 sky = mix(skyCol(), vec3(1.), .3) * uSunCol * day;
  vec3 light = sun * max(dot(n, uSun), 0.)
             + sky * (.05 + .3 * facing * facing) * (.5 + .5 * tips)
             + uSunCol * sunTint(mu, 1.5) * max(mu, 0.) * (1. - facing) * .06
             + vec3(.03, .035, .05) + flash(n) * (1. - day);
  return alb * light + sqrt(alb) * thru * pow(max(dot(rd, uSun), 0.), 3.) * tips * .3;
}

vec3 cloudLit(vec3 d) {
  float mu = dot(d, uSun);
  float thick = cloudAt(normalize(d + uSun * .025));
  return uCloudCol * (uSunCol * sunTint(mu, .7) * smoothstep(-.12, .2, mu) * mix(1., .4, thick) * sunShows(d * (uR + uCloud.y))
                      + skyCol() * smoothstep(-.3, .2, mu) * .15 + .01);
}

float ringBand(float r) {
  float x = (r - uRing.x) / (uRing.y - uRing.x);
  if (x < 0. || x > 1.) return 0.;
  float b = .3 + .7 * n3(vec3(x * 9. + uRing.w, .5, .5));
  return b * smoothstep(0., .05, x) * (1. - smoothstep(.92, 1., x)) * smoothstep(.02, .05, abs(x - .58)) * uRing.z;
}

// The aurora. A curtain of it is a sheet hanging straight down round a magnetic pole: the points at one
// angle from the axis, a cone with its tip at the planet's centre, the angle wavering along the way
// round. A ray meets a cone at most twice (one equation holds both poles' cones), so each crossing is
// found exactly and there are no layers to show between steps. A sheet seen from the side is brighter
// than one seen face on, by as much as the ray's path through it is longer; up to four times.
float h1(float i) { return float(ih(uint(i) * 747796405U + 2891336453U) >> 8) / 16777216.; }
// smooth noise round a loop of n cells, x in cells
float loop1(float x, float n) {
  float i = floor(x), f = fract(x);
  f = f * f * (3. - 2. * f);
  return mix(h1(mod(i, n)), h1(mod(i + 1., n)), f);
}
// the angle from the pole of curtain k at longitude phi (k 0 to 2 round one pole, 3 to 5 round the other),
// and how fast it changes along the way round
vec2 veil(float phi, float k) {
  vec3 arg = vec3(phi * 3. + uAuroraB.w * .08 + k * 2.1, phi * 7. - uAuroraB.w * .12 + k * 1.3, phi * 17. + uAuroraB.w * .25 + k * 4.);
  const vec3 AMP = vec3(.035, .02, .008);
  return vec2(uAuroraB.x + mod(k, 3.) * .06 + dot(AMP, sin(arg)), dot(AMP * vec3(3., 7., 17.), cos(arg)));
}
// both distances along the ray to the cone of points at angle th from the axis, at either pole. A, B, C
// and D are rd.axis, ro.axis, ro.rd and ro.ro
bool cone(float A, float B, float C, float D, float th, out vec2 t) {
  float k = cos(th);
  k *= k;
  float qa = A * A - k, qb = A * B - k * C, qc = B * B - k * D, disc = qb * qb - qa * qc;
  if (disc < 0.) return false;
  float q = -(qb + (qb < 0. ? -1. : 1.) * sqrt(disc));
  if (abs(q) < 1e-9) return false;
  t = vec2(q / (abs(qa) < 1e-9 ? 1e-9 : qa), qc / q);
  return true;
}
vec3 aurora(vec3 ro, vec3 rd, float tEnd) {
  if (uAurora.w <= 0.) return vec3(0.);
  float lo = uR + uAuroraB.y, hi = uR + uAuroraB.z;
  vec2 top = sphere(ro, rd, hi);
  // where the ray first gets between the curtains' foot and top: nothing to do if it hits something before
  float start = length(ro) < lo ? sphere(ro, rd, lo).y : max(top.x, 0.), end = min(top.y, tEnd);
  if (top.y <= 0. || start >= end) return vec3(0.);
  vec3 a = uAurora.xyz, e1 = normalize(cross(a, abs(a.y) < .9 ? vec3(0., 1., 0.) : vec3(1., 0., 0.))), e2 = cross(a, e1);
  float A = dot(rd, a), B = dot(ro, a), C = dot(ro, rd), D = dot(ro, ro);
  // Most rays never come near the curtains: if, while between foot and top, a ray crosses neither edge of
  // the band of angles they can be at and starts outside it, it stays outside it
  vec2 c0, c1;
  float a0 = uAuroraB.x - .07, a1 = uAuroraB.x + .19;
  bool near = cone(A, B, C, D, a0, c0) && (clamp(c0.x, start, end) == c0.x || clamp(c0.y, start, end) == c0.y);
  near = near || (cone(A, B, C, D, a1, c1) && (clamp(c1.x, start, end) == c1.x || clamp(c1.y, start, end) == c1.y));
  if (!near) {
    float ang = acos(clamp(abs(dot(normalize(ro + rd * start), a)), 0., 1.));
    if (ang < a0 || ang > a1) return vec3(0.);
  }
  vec3 sum = vec3(0.);
  for (int k = 0; k < 3; k++) {
    float fk = float(k);
    vec2 t0;
    // the crossings of the cone at the curtain's mean angle, then each again at the angle the curtain
    // has at the longitude of the last one: twice is enough for all but where a fold is seen edge on
    if (!cone(A, B, C, D, uAuroraB.x + fk * .06, t0)) continue;
    for (int s = 0; s < 2; s++) {
      float t = clamp(s == 0 ? t0.x : t0.y, -1e4, 1e4), gap = abs(t0.y - t0.x), side = fk, phi = 0.;
      bool ok = true;
      for (int it = 0; it < 2; it++) {
        vec3 p = ro + rd * t;
        side = fk + (dot(p, a) < 0. ? 3. : 0.);
        phi = atan(dot(p, e2), dot(p, e1));
        vec2 r;
        if (!cone(A, B, C, D, veil(phi, side).x, r)) { ok = false; break; }
        t = abs(r.x - t) < abs(r.y - t) ? r.x : r.y;
        gap = abs(r.y - r.x);
      }
      if (!ok || t < start || t > end) continue;
      vec3 p = ro + rd * t, pn = normalize(p);
      // the foot wavers along the way round, the curtain breaks into arcs, and it is drawn in rays
      float x = phi * .159155, h = length(p) - uR;
      float foot = uAuroraB.y * (1. + .14 * (loop1(x * 20. + side * 5.3, 20.) - .5));
      float u = (h - foot) / (uAuroraB.z - foot);
      if (u < 0. || u > 1.) continue;
      float arcs = smoothstep(.25, .65, loop1(x * 6. + side * 2.7 + uAuroraB.w * .004, 6.));
      float r1 = loop1(x * 300. + side * 31. + uAuroraB.w * .6, 300.), r2 = loop1(x * 70. - uAuroraB.w * .25 + side * 7., 70.);
      float rays = .12 + .88 * r1 * r1 * (.4 + .6 * r2);
      // Green low down, brightest in a thin rim along the foot, and red far fainter higher up: the two
      // colours of the oxygen that glows, at the heights where each is given off
      float green = smoothstep(0., .03, u) * (exp(-u * 4.5) + .7 * exp(-u * 28.));
      float red = .08 * smoothstep(.2, .55, u) * (1. - smoothstep(.7, 1., u));
      // how edge-on the sheet is seen: its normal is across it, tilted by how fast the angle changes along it.
      // Where a fold is seen exactly edge on the two crossings meet, and it fades rather than ending sharp.
      vec3 pole = dot(p, a) < 0. ? -a : a;
      float ca = dot(pn, pole), sa = sqrt(max(1. - ca * ca, 1e-6));
      float slope = veil(phi, side).y;
      vec3 ns = normalize((ca * pn - pole) / sa - slope / sa * cross(a, pn) / sa);
      float c = abs(dot(rd, ns)), seen = min(1. / max(c, .25), 4.) * smoothstep(0., 6., gap);
      float night = smoothstep(-.15, .35, -dot(pn, uSun));
      sum += (uAuroraLow * green + uAuroraHigh * red) * mix(rays, 1., u * .5) * arcs * seen * night * (1. - fk * .3);
    }
  }
  return sum * uAurora.w;
}
// its light on the ground: a little green round under the curtains, on the night side
vec3 auroraGlow(vec3 d) {
  if (uAurora.w <= 0.) return vec3(0.);
  float x = (acos(clamp(abs(dot(d, uAurora.xyz)), 0., 1.)) - uAuroraB.x - .06) / .3;
  return uAuroraLow * .035 * uAurora.w * exp(-x * x) * smoothstep(.05, .4, -dot(d, uSun));
}

// Mist: it fills the low ground up to a top a few metres over the sea or the plain, as still air does on a
// cold night, so hills stand out of it and from above it is a sea of its own. The top wavers from place to
// place and it lies in patches. It forms after dark, is thickest at dawn and burns off as the sun climbs, so
// at any moment it is on the night side of the planet and the morning side. How much of the ray is in it
// comes from where the ray crosses three spheres, thick under the lowest and thinner up to the highest, so
// it has no steps to show; the rest is read once, halfway along that part of the ray. The light it adds:
// the sun's where it is up, brightest looking toward it, the sky's, and at night the headlamp's.
vec4 mist(vec3 ro, vec3 rd, float tEnd) {
  if (uMist.x <= 0.) return vec4(0., 0., 0., 1.);
  vec2 s = sphere(ro, rd, uR + uMist.y * 1.6 + 1.);   // over the highest the top can be
  float a = max(s.x, 0.), b = min(s.y, tEnd);
  if (b <= a) return vec4(0., 0., 0., 1.);
  vec3 m = normalize(ro + rd * (a + b) * .5);
  float mu = dot(m, uSun);
  vec3 sunV = normalize(cross(uSun, vec3(0., 1., 0.)));   // the way the sun is moving
  float late = smoothstep(-.1, .1, dot(m, sunV));   // after midnight, or in the morning
  float when = max(smoothstep(0., -.35, mu) * mix(.45, 1., late), late * (1. - smoothstep(-.05, .45, mu)));
  float lie = smoothstep(.25, .6, n3(m * uR * .03 + vec3(uTime * .01, 0., uTime * .007)));   // in patches
  if (when * lie <= 0.) return vec4(0., 0., 0., 1.);
  float top = uMist.y * (.4 + 1.2 * n3(m * uR * .012 + 40.)), inside = 0.;
  for (int k = 0; k < 3; k++) {
    vec2 q = sphere(ro, rd, uR + top + float(k - 1));
    inside += max(min(q.y, tEnd) - max(q.x, 0.), 0.) * (k == 0 ? .5 : k == 1 ? .3 : .2);
  }
  float T = exp(-uMist.x * when * lie * inside), day = smoothstep(-.25, .25, mu);
  vec3 L = uSunCol * sunTint(mu, 1.5) * smoothstep(-.05, .1, mu) * (.45 + 1.4 * pow(max(dot(rd, uSun), 0.), 8.))
         + skyCol() * smoothstep(-.3, .2, mu) * .3 + .01 + vec3(.1, .1, .09) * (1. - day) / (1. + a * a / 40.);
  return vec4(L * vec3(.92, .94, .97) * (1. - T), T);
}

// Meteors: a bright head and a tail behind it that fades out, at least a sample wide however far off,
// so the cells along it see a line and draw one.
vec3 meteors(vec3 rd) {
  vec3 sum = vec3(0.);
  for (int i = 0; i < 2; i++) {
    vec4 a = uMet[i], b = uMetB[i], c = uMetC[i];
    if (c.r + c.g + c.b <= 0.) continue;
    float run = b.w * a.w;   // how far the head has gone, radians
    vec3 H = normalize(a.xyz + b.xyz * run), way = normalize(b.xyz - H * dot(b.xyz, H)), q = rd - H;
    // measured round the great circle it follows: a straight line would leave a long tail behind
    float along = atan(-dot(rd, way), dot(rd, H)), across = abs(dot(rd, normalize(cross(H, way)))), w = max(uPix, .0015);
    if (along < -6. * w || along > run + 6. * w || across > 6. * w) continue;
    float head = exp(-dot(q, q) / (w * w * 1.5));
    float tail = along > 0. ? exp(-across * across / (w * w * .5)) * exp(-along / c.w) * smoothstep(0., w, run - along) : 0.;
    float life = smoothstep(0., .12, a.w) * (1. - smoothstep(.7, 1., a.w));
    sum += c.rgb * (head * 3. + tail * 1.6) * life;
  }
  return sum;
}

// a material with an outline of its own, as opposed to a kind of ground
bool solid(float m) { return m == ${TREE}. || m == ${CRYSTAL}. || m == ${SPIRE}. || m == ${LAVA}.; }

vec3 surface(vec3 ro, vec3 rd, float t) {
  vec3 p = ro + rd * t, d = normalize(p);
  float lod = clamp(log2(t * uPix / uTexel), 0., 6.);
  float h = textureLod(uHeight, d, 0.).r;
  vec3 n = normalize(textureLod(uNormal, d, lod).xyz * 2. - 1.);
  // seen edge-on a pixel covers a long strip of ground, so the colour comes from a coarser level, one at most:
  // more than that and anything thin, a lava vein above all, is averaged away
  vec4 al = textureLod(uAlbedo, d, min(lod - log2(max(dot(n, -rd), .5)), 6.));
  vec3 alb = pow(al.rgb, vec3(2.2));
  bool sea = uSea.a > .5 && h < 0.;
  if (sea) n = d;

  // F is the size, in metres on the surface, of the smallest patch the picture can show here: about
  // four characters wide and two tall. It grows with distance and, a lot, with how edge-on the surface
  // is seen. Every pattern below fades out before it gets finer than that: the picture would show a
  // finer one only as static, and on flat ground as dashed stripes.
  float F = t * uPix * max(8., 6. / max(dot(n, -rd), .04));

  // Which material: the map has one answer per texel, about a metre, so where two kinds of ground meet
  // the border would be drawn as a staircase. Close up the lookup wobbles by about a texel, which makes
  // the border ragged. Trees, crystals, rocks and lava keep their own outline: a wobble there puts their
  // material on the ground beside them, or the ground's on them.
  mat = floor(textureLod(uMat, d, 0.).r * 255. + .5);
  if (!sea && F < 2.5 && !solid(mat)) {
    vec3 md = normalize(d + (vec3(n3(p * 1.7), n3(p * 1.7 + 13.), n3(p * 1.7 + 29.)) - .5) * (1.6 * uTexel / uR));
    float m1 = floor(textureLod(uMat, md, 0.).r * 255. + .5);
    if (!solid(m1)) mat = m1;
  }
  if (sea) mat = uSea.a > 1.5 ? ${LAVA}. : ${WATER}.;

  // Props get the structure the height map is too coarse to hold (it has about a metre per point).
  // Only their sides get it: the top of a spire and the ground round a foot are flat and stay plain.
  float side = 1. - smoothstep(.8, .97, dot(n, d)), alt = length(p) - uR, tips = .6;
  if (!sea && F < 7. && side > 0.) {
    vec3 g = (vec3(n3(p * 2.4), n3(p * 2.4 + 17.), n3(p * 2.4 + 31.)) - .5) * fine(F, .42) * side;
    if (mat == ${TREE}.) {
      // boughs in tiers about 1.6 m apart, dark underneath and light at the tips; clumps of needles;
      // a little variety from tree to tree. The tiers go by the height of the point itself: on a
      // near-vertical side the height map's own value hardly changes from top to bottom.
      float tier = fract(alt * .62 + n3(p * .35) * .5);
      n = normalize(n + g * 1.3);
      float boughs = .25 + 1.05 * smoothstep(.05, .5, tier) + .3 * smoothstep(.8, 1., tier);
      tips = mix(tips, smoothstep(.05, .9, tier), fine(F, 1.6) * side);
      alb *= mix(1., boughs, fine(F, 1.6) * side) * mix(1., .6 + .8 * n3(p * 3.1), fine(F, .32) * side) * (.8 + .4 * n3(p * .2));
    } else if (mat == ${SPIRE}.) {
      // thick rock strata, light and dark, with cracks
      float layer = sin(alt * 2.4 + n3(p * .3) * 3.);
      n = normalize(n + g * .8);
      alb *= mix(1., .72 + .32 * layer, fine(F, 2.6) * side) * mix(1., .75 + .5 * n3(p * 1.9), fine(F, .53) * side);
    } else if (mat == ${CRYSTAL}.) {
      // facets: the normal snaps toward a few planes, so each face is flat and catches the light on its own
      n = normalize(mix(n, floor(n * 2.5 + .5) / 2.5, .85 * fine(F, 1.5)));
    }
  }

  float mu = dot(d, uSun), day = smoothstep(-.25, .25, mu);
  vec3 amb = skyCol() * day * .1 + vec3(.03, .035, .05) + (auroraGlow(d) + flash(n)) * (1. - day);
  float ndl = max(dot(n, uSun), 0.), vis = 1.;
  if (ndl > 0.) vis = shadow(p + n * .3);
  if (ndl > 0. || sea) vis *= skyShade(p);   // a face turned from the sun has no use for it
  vec3 sun = uSunCol * sunTint(mu, 1.5) * vis;
  vec3 light = sun * ndl + amb;
  // headlamp, only once it gets dark
  light += vec3(1.5, 1.4, 1.15) * (1. - day) * max(dot(n, -rd), 0.) / (1. + t * t / 250.);
  for (int i = 0; i < 5; i++) {
    vec4 b = uBeacon[i];
    if (b.w <= 0.) continue;
    vec3 q = p - b.xyz, v = normalize(b.xyz);
    float along = dot(q, v);
    // the far side of the planet lies on the same axis: without the smoothstep the ground opposite every beacon glows too
    light += uBeaconCol * b.w * (1. - .5 * day) * smoothstep(-2. * uR, -1.9 * uR, along) / (1. + (dot(q, q) - along * along) / 14.);
  }

  if (!sea) {
    // Mottling of the ground, at the finest scale the picture resolves here: specks at your feet,
    // patches a few metres across further off, and nothing past that, where the colour map takes over.
    // On a wall the scale goes by the short side of what a sample covers, or a cliff seen from close by
    // and at an angle would be blotched with patches metres across; seen too edge-on for that scale,
    // the mottling fades out.
    float Fd = mix(F, t * uPix * 8., side);
    float l = max(log2(Fd / .27), 0.), i = floor(l), sc = 3.7 * exp2(-i);
    float det = mix(n3(p * sc + i * 7.3), n3(p * sc * .5 + i * 7.3 + 7.3), l - i);
    alb *= mix(1., .55 + .9 * det, (1. - smoothstep(3., 6., l)) * fine(F, 1.5 * Fd));
    float em = step(.01, al.a) * (al.a - .004);
    // on a world whose trees glow only in the dark, so does everything lit by them
    if (uTreeNight > .5) em *= smoothstep(-.05, -.3, mu);
    // each crystal facet glows at its own brightness
    if (mat == ${CRYSTAL}.) em *= mix(1., .35 + .9 * abs(dot(n, normalize(vec3(.4, .8, .45)))), fine(F, 1.5));
    glow = em;
    // trees are lit as the near ones are, so a tree does not change as it comes close and is drawn in full
    vec3 lit = mat == ${TREE}. ? needles(alb, n, d, mu, sun, vec3(0.), tips, rd) + alb * (light - sun * ndl - amb) : alb * light;
    return lit + (mat == ${TREE}. && uTreeNight > .5 ? uTreeGlowCol * .5 : alb) * em * uEmit;
  }
  if (uSea.a > 1.5) {
    float crust = smoothstep(.38, .6, mix(.5, n3(p * .22 + vec3(0., uTime * .02, 0.)), fine(F, 4.5)) * .6 + mix(.5, n3(p * .9), fine(F, 1.1)) * .4);
    glow = (1. - crust) * .3;
    return mix(vec3(2.2, .38, .035), vec3(.03, .015, .012) * light, crust);
  }
  vec3 wc = mix(uShallow, uSea.rgb, 1. - exp(h * .3));
  wc = mix(alb, wc, 1. - exp(h * 1.4));
  // Ripples. Where they are smaller than the picture can show they stop moving the normal and widen
  // the sun's glint instead, which is what a camera sees of far water: a smooth path of light, not sparks.
  float calm = 1. - fine(F, .9);
  vec3 rip = vec3(n3(p * 1.1 + uTime * .5), n3(p * 1.1 + 9. - uTime * .4), n3(p * 1.1 + 17. + uTime * .3)) - .5;
  vec3 wn = normalize(d + rip * .1 * (1. - calm));
  float fres = pow(clamp(1. - dot(-rd, wn), 0., 1.), 5.);
  float sp = max(dot(reflect(rd, wn), uSun), 0.);
  float glint = pow(sp, mix(90., 34., calm)) * mix(4., 1.1, calm);
  glow = min(glint * .06, 1.) * vis;
  // at night the water mirrors the aurora
  vec3 sky = skyCol() * day * .3 + .008 + (uAurora.w > 0. && fres > .03 && day < 1. ? aurora(p + d * .05, reflect(rd, wn), 1e5) * (1. - day) : vec3(0.));
  return wc * light * (1. - fres) + sky * fres + sun * (glint + pow(sp, 10.) * .2);
}

vec3 stars(vec3 rd) {
  vec3 q = rd * 95.;
  float h = hash(q);
  if (h < .986) return vec3(0.);
  float b = (h - .986) / .014;
  float tw = .75 + .25 * sin(uTime * (1.5 + b * 4.) + b * 60.);
  return mix(vec3(1., .85, .7), vec3(.75, .85, 1.), fract(b * 7.3)) * (1. - smoothstep(.1, .5, length(fract(q) - .5))) * (.25 + b * b * 1.5) * tw;
}

// sun and moon; they stay visible through a daytime sky, the stars do not
vec3 lights(vec3 ro, vec3 rd) {
  float sd = max(dot(rd, uSun), 0.), shows = sunShows(ro);
  vec3 col = uSunCol * (smoothstep(.99965, .9999, sd) * 60. + pow(sd, 900.) * 4. + pow(sd, 50.) * .2) * shows;
  glow = smoothstep(.9992, .9999, sd) * shows;
  // With the sun nearly all behind the moon its corona shows: a pale glow round the dark disc, fading
  // outward, a little streaked
  if (shows < .5 && sd > .99) {
    float rho = max(length(cross(rd, uSun)) / SUN_R, 1.), dark = 1. - shows * 2.;
    float streaks = .7 + .5 * n3(normalize(rd - uSun * dot(rd, uSun) + 1e-6) * 4.);
    col += uSunCol * dark * .5 * streaks / (rho * rho * sqrt(rho));
    glow = max(glow, dark * .5 / (rho * rho));
  }
  // Ice in the air bends sunlight by 22 degrees at least, more of it at just that angle: a faint ring round
  // the sun, red on the inside, and with the sun low two bright spots level with it on either side, a
  // little further out the higher it is
  if (uHalo > 0.) {
    float th = acos(clamp(dot(rd, uSun), -1., 1.)), x = (th - .384) / .014;
    float ring = th > .37 ? exp(-x * x) + .25 * exp(-max(x, 0.) * .35) * step(0., x) * exp(-x * x * .02) : 0.;
    vec3 up = normalize(ro), sh = normalize(uSun - up * dot(uSun, up));
    float e = asin(clamp(dot(uSun, up), -1., 1.)), ce = cos(e), low = 1. - smoothstep(.35, .6, e);
    float daz = acos(clamp((.927 - sin(e) * sin(e)) / max(ce * ce, .01), -1., 1.));
    float dogs = 0.;
    for (int k = -1; k <= 1; k += 2) {
      vec3 side = normalize(cross(up, sh)) * float(k), dog = up * sin(e) + (sh * cos(daz) + side * sin(daz)) * ce;
      // brightest at the inside, with a tail away from the sun
      vec3 q = rd - dog;
      float out_ = dot(q, side), d2 = dot(q, q) - out_ * out_;
      dogs += exp(-d2 / .0004) * (out_ < 0. ? exp(-out_ * out_ / .0002) : exp(-out_ / .03));
    }
    float sunUp = smoothstep(-.02, .05, dot(uSun, up));
    vec3 tint = mix(vec3(1., .45, .3), vec3(1., .97, .92), smoothstep(-1., 1.5, x));
    col += uSunCol * tint * (ring * .12 + dogs * .9 * low) * sunUp * uSkyLit;
    glow = max(glow, dogs * .6 * low * sunUp);
  }
  vec2 s = sphere(ro - uMoon.xyz, rd, uMoon.w);
  if (uMoon.w > 0. && hits(s)) {
    vec3 n = normalize(ro + rd * s.x - uMoon.xyz);
    col = vec3(.5, .48, .45) * (.45 + fbm(n * 3.5 + 3.)) * (uSunCol * max(dot(n, uSun), 0.) + .004);
    glow = 0.;
    mat = ${ROCK}.;
  }
  return col;
}

// single scattering: light picked up along the view ray, and how much of what is behind survives
vec3 atmosphere(vec3 ro, vec3 rd, float tMax, out vec3 trans) {
  trans = vec3(1.);
  if (uAtmo <= 0.) return vec3(0.);
  vec2 s = sphere(ro, rd, uR + uAtmo);
  float t0 = max(s.x, 0.), t1 = min(s.y, tMax);
  if (t1 <= t0) return vec3(0.);
  float hs = uAtmo * .25, ds = (t1 - t0) / 8., od = 0.;
  vec3 sum = vec3(0.);
  for (int i = 0; i < 8; i++) {
    vec3 p = ro + rd * (t0 + (float(i) + .5) * ds);
    float dens = exp(-max(length(p) - uR, 0.) / hs) * ds;
    od += dens;
    // the planet's shadow is a cylinder behind it. Its edge is spread over the width of one step, so a step
    // fades in as it crosses the edge; whole steps switching on and off would show as eight hard bands in
    // the dusk sky
    float pb = dot(p, uSun), wide = .5 * ds * length(rd - uSun * dot(rd, uSun)) + .01;
    float lit = pb > 0. ? 1. : smoothstep(uR * .99 - wide, uR * .99 + wide, sqrt(max(dot(p, p) - pb * pb, 0.)));
    // and the moon's: in an eclipse the air overhead goes dark while the air far off round the horizon,
    // out of the shadow, stays lit
    lit *= sunShows(p);
    // and the ring's, which lies across the sky in bands where the ring is thick
    if (uRing.z > 0.) {
      float kr = -dot(p, uRingN) / dot(uSun, uRingN);
      if (kr > 0.) lit *= 1. - .8 * ringBand(length(p + uSun * kr));
    }
    if (lit <= 0.) continue;
    float dl = sphere(p, uSun, uR + uAtmo).y / 4., ods = 0.;
    for (int j = 0; j < 4; j++) ods += exp(-max(length(p + uSun * ((float(j) + .5) * dl)) - uR, 0.) / hs) * dl;
    sum += lit * dens * exp(-uBeta * (od + ods));
  }
  trans = exp(-uBeta * od);
  float mu = dot(rd, uSun), m = max(mu, 0.);
  // rayleigh, plus a forward lobe round the sun that carries the sunset colours
  return sum * uSunCol * uAdapt * (uBeta * .45 * (1. + mu * mu) + (.012 * pow(m, 6.) + .09 * pow(m, 90.)) / hs);
}

// The nearest trees, drawn as real shapes. Each blends back into the plain cone the terrain already has
// before it reaches the edge of that set (uTreeFade), so a tree never changes shape from one frame to the
// next. Checked before any shading, so the terrain behind a tree is never shaded for nothing.
bool trees(vec3 ro, vec3 rd, inout float tEnd, out vec3 col) {
  bool found = false;
  col = vec3(0.);
  for (int i = 0; i < 12; i++) {
    if (i >= uTreeN) break;
    vec4 tr = uTree[i];
    float r = uTreeB[i].x, h = tr.w, seed = uTreeB[i].y;
    vec3 up = normalize(tr.xyz), o = ro - tr.xyz;
    float fade = 1. - smoothstep(uTreeFade.x, uTreeFade.y, length(o));
    if (fade <= 0.) continue;
    vec2 b = sphere(o - up * (h * .5), rd, length(vec2(h * .56, r * 1.3 + .6)));
    if (b.y <= 0. || b.x >= tEnd) continue;
    vec3 ax = normalize(cross(up, abs(up.y) < .9 ? vec3(0., 1., 0.) : vec3(1., 0., 0.))), az = cross(ax, up);
    vec3 lo = vec3(dot(o, ax), dot(o, up), dot(o, az)), ld = vec3(dot(rd, ax), dot(rd, up), dot(rd, az));
    // with the eye in among the boughs the tree melts back into its cone: every ray would hit it at
    // once and fill the screen with one colour
    fade *= smoothstep(.1, .8, fir(lo, r, h, 1., seed));
    if (fade <= 0.) continue;
    float ts = max(b.x, 0.);
    bool hit = false;
    for (int k = 0; k < 36; k++) {
      float dd = fir(lo + ld * ts, r, h, fade, seed);
      if (dd < .004 * (1. + ts)) { hit = true; break; }
      ts += dd * .85;
      if (ts > b.y || ts > tEnd) break;
    }
    if (!hit || ts >= tEnd) continue;
    vec3 q = lo + ld * ts, p = ro + rd * ts;
    const vec2 e = vec2(.006, -.006);
    vec3 nl = normalize(e.xyy * fir(q + e.xyy, r, h, fade, seed) + e.yyx * fir(q + e.yyx, r, h, fade, seed)
                      + e.yxy * fir(q + e.yxy, r, h, fade, seed) + e.xxx * fir(q + e.xxx, r, h, fade, seed));
    vec3 n = nl.x * ax + nl.y * up + nl.z * az;
    float mu = dot(up, uSun), day = smoothstep(-.25, .25, mu);
    // how far out on its tier the point is: 1 at the ends of the branches, 0 in the dark middle of the tree
    float tips = smoothstep(.72, .97, length(q.xz) / ((r * FIR_OUT + FIR_PAD) * max(1. - q.y / h, .05)));
    vec3 sunC = uSunCol * sunTint(mu, 1.5) * skyShade(p);
    // The sun on a bough, and the sun that comes through one: the light that shines through is seen at the
    // edges of the tree against the sun, where the boughs are turned sideways to it and their shadow test
    // is the same one.
    vec3 sun = dot(n, uSun) > 0. ? sunC * shadow(p + n * .3) : vec3(0.);
    // A little variety from tree to tree; the ends of the branches lighter and yellower; clumps of needles,
    // which fade out as the tree gets further off before they are as small as a character.
    float F = ts * uPix * 8.;
    vec3 alb = uTreeCol * mix(vec3(.85, .95, 1.1), vec3(1.15, 1.08, .8), fract(seed * .618)) * (.85 + .3 * fract(seed * .37))
             * mix(.35, 2., tips) * mix(vec3(1.), vec3(1.15, 1.1, .75), tips) * mix(1., .7 + .6 * n3(q * 2.2 + seed), fine(F, .45));
    col = needles(alb, n, up, mu, sun, sun, tips, rd)
        + alb * vec3(1.5, 1.4, 1.15) * (1. - day) * max(dot(n, -rd), 0.) / (1. + ts * ts / 250.)   // headlamp
        // a glowing tree glows most at the ends of its branches; some glow only at night, in a colour of their own
        + (uTreeNight > .5 ? uTreeGlowCol * smoothstep(-.05, -.3, mu) * (.4 + .6 * tips) : alb) * uTreeGlow * 3.2 * (.25 + 1.5 * tips);
    glow = uTreeGlow * (.25 + .75 * tips) * (uTreeNight > .5 ? smoothstep(-.05, -.3, mu) : 1.);
    tEnd = ts;
    mat = ${TREE}.;
    found = true;
  }

  return found;
}

void main() {
  vec3 ro = uPos, rd = normalize(uFwd + uRight * vUv.x * uFov.x + uUp * vUv.y * uFov.y);
  float t = march(ro, rd), tEnd = t > 0. ? t : 1e5;
  vec3 col, st = vec3(0.), mt = vec3(0.);   // st: starlight; mt: a meteor's
  glow = 0.;
  mat = ${VOID}.;
  if (trees(ro, rd, tEnd, col)) {}
  else if (t > 0.) col = surface(ro, rd, t);
  else { col = lights(ro, rd); st = mat == ${ROCK}. ? vec3(0.) : stars(rd); mt = meteors(rd); }   // no stars in front of the moon

  // The parked ship and the things to find. Each is marched in its own frame (y away from the planet, z
  // the way it faces) inside a sphere that holds it.
  for (int k = 0; k < 4; k++) {
    int j = max(k - 1, 0);
    vec4 at = k == 0 ? uShip : uFind[j];
    if (at.w <= 0.) continue;
    float what = k == 0 ? 0. : at.w, more = k == 0 ? 0. : uFindB[j].w;
    vec3 face = k == 0 ? uShipFwd : uFindB[j].xyz;
    vec3 up = normalize(at.xyz), fw = normalize(face - up * dot(face, up)), rt = cross(up, fw);
    vec3 o = ro - at.xyz, lo = vec3(dot(o, rt), dot(o, up), dot(o, fw)), ld = vec3(dot(rd, rt), dot(rd, up), dot(rd, fw));
    // the sphere: 2.2 m round the ship's hull; round the others it is centred a little above the ground
    vec2 b = what < .5 ? sphere(lo, ld, 2.2) : sphere(lo - vec3(0., what < 1.5 ? 1.4 : .7, 0.), ld, what < 1.5 ? ${(HENGE + 1.8).toFixed(1)} : what < 2.5 ? 2.7 : 1.6);
    float inside;
    // with the eye inside the shape every ray would hit it at once and fill the screen: leave it out then
    if (b.y > 0. && b.x < tEnd && (b.x > 0. || thing(lo, what, more, inside) > .05)) {
      float ts = max(b.x, 0.), part = 0.;
      bool hit = false;
      for (int i = 0; i < 64; i++) {
        float dd = thing(lo + ld * ts, what, more, part);
        if (dd < .002 * (1. + ts)) { hit = true; break; }
        ts += dd;
        if (ts > b.y || ts > tEnd) break;
      }
      if (hit && ts < tEnd) {
        vec3 q = lo + ld * ts;
        const vec2 e = vec2(.004, -.004);
        float pp;
        vec3 nl = normalize(e.xyy * thing(q + e.xyy, what, more, pp) + e.yyx * thing(q + e.yyx, what, more, pp) + e.yxy * thing(q + e.yxy, what, more, pp) + e.xxx * thing(q + e.xxx, what, more, pp));
        vec3 n = nl.x * rt + nl.y * up + nl.z * fw;
        float ndl = max(dot(n, uSun), 0.), spec = pow(max(dot(n, normalize(uSun - rd)), 0.), part == 1. ? 120. : 40.);
        // the ship's hull shades what is under its rim
        float under = what < .5 ? (1. - smoothstep(-.5, -.1, q.y)) * step(length(q.xz), 1.3) : 0.;
        // a hill, a cloud or the ring shades it too (a wreck or a cairn is asked 3 m up, clear of the patch
        // of shade it throws itself)
        vec3 sunL = uSunCol * sunTint(dot(up, uSun), 1.) * (1. - .75 * under) * smoothstep(-.1, .1, dot(up, uSun))
                  * shadow(at.xyz + up * .6) * skyShade(at.xyz + up * (what > 1.5 ? 3. : 0.));
        float day = smoothstep(-.25, .25, dot(up, uSun)), facing = dot(n, up) * .5 + .5;
        vec3 amb = skyCol() * .12 * day + vec3(.04, .045, .055);
        // What metal and glass mirror: the sky above the horizon, in its colour; below it the ground round
        // the ship, lit by the sun. The sky fills the tops of things and the lit ground their undersides.
        vec3 ground = pow(textureLod(uAlbedo, up, 5.).rgb, vec3(2.2)) * uSunCol * sunTint(dot(up, uSun), 1.5) * max(dot(up, uSun), 0.);
        vec3 skyL = skyCol() * uSunCol * day * .7 + vec3(.008, .01, .016);
        vec3 env = mix(ground * .6, skyL, smoothstep(-.2, .25, dot(reflect(rd, n), up)));
        float fres = pow(1. - max(dot(n, -rd), 0.), 4.);
        amb += skyL * .3 * facing * facing + ground * .35 * (1. - facing);
        // the things to find are lit by the headlamp once it is dark, like the ground; the ship has lights of its own
        if (what > .5) amb += vec3(1.5, 1.4, 1.15) * (1. - smoothstep(-.25, .25, dot(up, uSun))) * max(dot(n, -rd), 0.) / (1. + ts * ts / 250.);
        // a wreck is the ship's shape gone dull: dust on the hull, no light in the ring or the lamp
        float dead = what > 1.5 ? 1. : 0.;
        glow = 0.;
        if (part > 4.5) {
          // stone: the planet's own rock, streaked down its faces
          col = uRock * (1.1 + .9 * n3(vec3(q.x * 2.5, q.y * .5, q.z * 2.5))) * (sunL * ndl + amb);
        } else if (part < .5) {
          // Hull: painted panels with darker seams, a band of colour round the saucer and a seam where the
          // dome sits on it; the underside is bare metal. Round the dome, a row of portholes: dark glass by
          // day, lit from inside once it gets dark.
          float f = fract(atan(q.z, q.x) * 1.2732), seam = 1. - smoothstep(0., .03, min(f, 1. - f));
          seam = max(seam * .7, 1. - smoothstep(.008, .025, abs(q.y - .27)));
          float band = smoothstep(.12, .13, q.y) * (1. - smoothstep(.17, .18, q.y));
          vec3 base = mix(vec3(.3, .31, .33), mix(vec3(.7, .69, .65), vec3(.46, .2, .13), band), smoothstep(-.08, -.04, q.y));
          base = mix(base * (1. - .55 * seam), uRock * 1.6 + .05, dead * .6);
          float arc = (fract(atan(q.z + .12, q.x) * 1.5915) - .5) * .53;
          float port = (1. - smoothstep(.045, .06, length(vec2(arc, q.y - .46)))) * step(.3, q.y);
          col = mix(base * (sunL * ndl + amb) + env * (.06 + .5 * fres) * (1. - dead) + sunL * spec * .35 * (1. - dead),
                    vec3(.02, .025, .03) * amb + env * (.2 + .7 * fres) + vec3(1., .66, .36) * 1.4 * (1. - day) * (1. - dead), port);
          glow = port * (1. - day) * (1. - dead) * .6;
        } else if (part < 1.5) {
          // canopy: dark glass that mirrors the sky and the ground
          col = vec3(.02, .03, .04) * (sunL * ndl + amb) + (env * (.15 + .8 * fres) + sunL * spec * 1.6) * (1. - .8 * dead);
        } else if (part < 2.5 && dead < .5) {
          // the engine ring: a row of small lamps that stay lit while the ship waits, bright once it is dark
          float f = fract(atan(q.z, q.x) * 3.8197), lit = mix(.7, 2.2, 1. - day);
          float on = 1. - smoothstep(.035, .05, length(vec2((f - .5) * .33, q.y + .02)));
          col = mix(vec3(.12, .12, .13) * (sunL * ndl + amb) + env * .3 * fres, vec3(1., .64, .32) * lit, on);
          glow = on * mix(.25, .7, 1. - day);
        } else if (part < 3.5 || dead > .5) {
          col = vec3(.2, .21, .23) * (sunL * ndl + amb) + env * (.05 + .4 * fres) * (1. - dead) + sunL * spec * .2;
        } else if (q.y > .5) {
          // the beacon on top blinks
          float on = step(.5, fract(uTime * .8));
          col = vec3(4., .3, .2) * on + vec3(.15, .02, .02);
          glow = on;
        } else {
          // a red lamp on the left, a green one on the right
          col = q.x > 0. ? vec3(3., .25, .15) : vec3(.3, 2.6, .8);
          glow = .8;
        }
        tEnd = ts;
        mat = part > 4.5 ? (what < 1.5 ? ${SPIRE}. : ${ROCK}.) : ${SHIP}.;
        st = mt = vec3(0.);
      }
    }
  }

  // The mist lies low. From over the clouds it is under them and goes in now; from under them it is in
  // front of them, and goes in after them.
  vec4 ms = mist(ro, rd, tEnd);
  bool high = length(ro) > uR + uCloud.y;
  if (high) { col = col * ms.a + ms.rgb; st *= ms.a; mt *= ms.a; glow *= ms.a; }

  // The ring has its place in depth. From the ground it is the farthest thing in the sky, so it goes in
  // before the clouds and the air, which then tint and fade it like anything else far away; from orbit
  // the near half of it is in front of the planet's air, and goes in after.
  float ringA = 0., airTop = uAtmo > 0. ? max(uAtmo, uCloud.y) : 0.;   // how high the air and its clouds go
  vec3 ringC = vec3(0.);
  bool ringFar = false;
  if (uRing.z > 0.) {
    float k = -dot(ro, uRingN) / dot(rd, uRingN);
    if (k > 0. && k < tEnd) {
      vec3 q = ro + rd * k;
      ringA = ringBand(length(q));
      ringC = uRingCol * uSunCol * (hits(sphere(q, uSun, uR)) ? .03 : 1.) * .5;
      vec2 shell = sphere(ro, rd, uR + airTop);
      ringFar = airTop > 0. && shell.y > 0. && k > max(shell.x, 0.);
    }
  }
  if (ringA > 0. && ringFar) {
    // From down in the air it has to be bright to show at all against a daytime sky, as the moon does.
    // From above the air it is drawn as it is, or it would change brightness where it passes behind
    // the planet's edge.
    float deep = 1. - smoothstep(.5, 1., (length(ro) - uR) / airTop);
    col = mix(col, ringC * mix(1., 2.4, deep), ringA);
    st *= 1. - ringA;
    mt *= 1. - ringA;
    glow *= 1. - ringA;
    if (ringA > .3) mat = ${RING}.;
  }

  float tAir = tEnd, clear = 1.;   // clear: how much of what is above the clouds they let through
  if (uCloud.w > 0.) {
    vec2 s = sphere(ro, rd, uR + uCloud.y);
    for (int i = 0; i < 2; i++) {
      float tc = i == 0 ? s.y : s.x;
      if (tc <= 0. || tc >= tEnd) continue;
      vec3 d = normalize(ro + rd * tc);
      float a = cloudAt(d) * uCloud.w * smoothstep(0., 3., tc);
      if (a < .002) continue;   // clear sky here: nothing to light
      col = mix(col, cloudLit(d), a);
      tAir = mix(tAir, tc, a);
      glow *= 1. - a;
      st *= 1. - a;
      mt *= 1. - a;
      clear *= 1. - a;
      if (a > .5) mat = ${CLOUD}.;
    }
    // flying through the layer itself, within 8 m of it
    float band = 1. - smoothstep(0., 8., abs(length(ro) - uR - uCloud.y));
    if (band > 0.) col = mix(col, cloudLit(normalize(ro)), cloudAt(normalize(ro)) * uCloud.w * band * .9);
  }

  if (!high) { col = col * ms.a + ms.rgb; st *= ms.a; mt *= ms.a; glow *= ms.a; }
  if (ms.a < .4) mat = ${CLOUD}.;

  // the aurora is above the clouds: from under them it is behind them, and behind the mist; from over them in front
  vec3 au = aurora(ro, rd, tEnd) * (high ? 1. : clear * ms.a);

  vec3 tr;
  float halo = dot(col, vec3(1.));   // the sun's glow, where the ray is in open space
  vec3 sc = atmosphere(ro, rd, tAir, tr);
  // stars, meteors and the aurora are lost in a daylit sky
  float dark = clamp(1. - dot(sc, vec3(4.)), 0., 1.);
  au *= dark * tr;
  mt *= dark * tr;
  col = (col + st * dark) * tr + sc + au + mt;
  // open sky, moon included; and the glow round the sun in space, which is light and not a field of marks
  if (t < 0. && tEnd > 9e4 && mat != ${CLOUD}. && mat != ${RING}. && (dot(sc, vec3(1.)) > .03 || (mat == ${VOID}. && halo > .05))) mat = ${SKY}.;
  // the aurora and a meteor get characters of their own where they are most of what is seen
  const vec3 LUM = vec3(.3, .59, .11);
  float auL = dot(au, LUM), mL = dot(mt, LUM), total = dot(col, LUM);
  if (auL > .025 && auL > .4 * total) { mat = ${AURORA}.; glow = max(glow, min(auL * 1.5, .45)); }
  if (mL > .03 && mL > .35 * total) { mat = ${METEOR}.; glow = max(glow, min(mL, 1.)); }

  // the ring, when it is this side of the air
  if (ringA > 0. && !ringFar) {
    col = mix(col, ringC, ringA);
    if (ringA > .3) mat = ${RING}.;
  }

  float seen = tEnd;   // how far off what is in this pixel is: a beam in front of the sky is not as far as the sky
  for (int i = 0; i < 5; i++) {
    vec4 b = uBeacon[i];
    if (b.w <= 0.) continue;
    // closest approach between the view ray and the beam
    vec3 v = normalize(b.xyz), w = ro - b.xyz;
    float bb = dot(rd, v), dd = dot(rd, w), e = dot(v, w), den = 1. - bb * bb;
    float reach = uR * .5, sb = clamp(den < 1e-4 ? e : (e - bb * dd) / den, 0., reach);
    float tb = clamp(sb * bb - dd, 0., tEnd);
    float dist = length(ro + rd * tb - b.xyz - v * sb), wid = .3 + tb * .0035;
    float g = 1. / (1. + dist * dist / (wid * wid));
    float pulse = .75 + .25 * sin(uTime * 3. - sb * .08 + float(i));
    col += mix(vec3(.6), uBeaconCol, step(.5, b.w)) * b.w * g * pulse * 2.6 * (1. - smoothstep(reach * .35, reach, sb));
