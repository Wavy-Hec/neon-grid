<!doctype html>

  }
  #pad2 button { width: 48px; height: 36px; }

<body>
<canvas id="view"></canvas>
<div id="pad"><button data-k="c">down</button><button data-k=" ">up</button><button data-k="f">f</button></div>
<div id="pad2"><button data-k="tab">map</button><button data-k="j">log</button><button data-k="m">sound</button><button data-k="n">new</button></div>
<div id="notice" hidden>graphics reset, restoring</div>

<script>
'use strict';

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const len = a => Math.hypot(a[0], a[1], a[2]);
const norm = a => mul(a, 1 / (len(a) || 1));
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
  return h >>> 0;
}
function mulberry(a) {
  return () => {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rnd = Math.random;
const rf = (a, b) => a + rnd() * (b - a);
const ri = (a, b) => Math.floor(rf(a, b + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const hex = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16) / 255);
const linear = c => c.map(v => v ** 2.2);

// ---- noise

let noise;
// the table Perlin noise is built on: the numbers 0..255 in the planet's own order, twice over
function shuffled() {
  const p = new Uint8Array(512);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1)), t = p[i];
    p[i] = p[j]; p[j] = t;
  }
  for (let i = 0; i < 256; i++) p[i + 256] = p[i];
  return p;
}
function noiseOf(p) {
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  const grad = (h, x, y, z) => {
    h &= 15;
    const u = h < 8 ? x : y, v = h < 4 ? y : h === 12 || h === 14 ? x : z;
    return (h & 1 ? -u : u) + (h & 2 ? -v : v);
  };
  return (x, y, z) => {
    const fx = Math.floor(x), fy = Math.floor(y), fz = Math.floor(z);
    x -= fx; y -= fy; z -= fz;
    const xi = fx & 255, yi = fy & 255, zi = fz & 255;
    const u = fade(x), v = fade(y), w = fade(z);
    const a = p[xi] + yi, aa = p[a] + zi, ab = p[a + 1] + zi;
    const b = p[xi + 1] + yi, ba = p[b] + zi, bb = p[b + 1] + zi;
    return lerp(
      lerp(lerp(grad(p[aa], x, y, z), grad(p[ba], x - 1, y, z), u),
           lerp(grad(p[ab], x, y - 1, z), grad(p[bb], x - 1, y - 1, z), u), v),
      lerp(lerp(grad(p[aa + 1], x, y, z - 1), grad(p[ba + 1], x - 1, y, z - 1), u),
           lerp(grad(p[ab + 1], x, y - 1, z - 1), grad(p[bb + 1], x - 1, y - 1, z - 1), u), v), w);
  };
}
function fbm(x, y, z, oct) {
  let s = 0, a = 1, n = 0;
  for (let i = 0; i < oct; i++) {
    s += a * noise(x, y, z); n += a;
    a *= .5; x *= 2.02; y *= 2.02; z *= 2.02;
  }
  return s / n;
}
function ridge(x, y, z, oct) {
  let s = 0, a = 1, n = 0, w = 1;
  for (let i = 0; i < oct; i++) {
    let v = 1 - Math.abs(noise(x, y, z));
    v *= v * w; w = clamp(v * 1.6, 0, 1);
    s += a * v; n += a;
    a *= .5; x *= 2.1; y *= 2.1; z *= 2.1;
  }
  return s / n;
}

// ---- planets

const S = 1024;   // cube map face size

// Every surface is drawn with its own set of characters, listed light to heavy. Land is dots, commas and
// crosses. The ones that run together into long lines across the screen (- ~ =) are kept off the land:
// they are for what really is level and moves, water and lava (dim cloud has ~ too, the lander - and =).
const VOID = 0, SKY = 1, CLOUD = 2, WATER = 3, SAND = 4, GRASS = 5, DRY = 6, ROCK = 7, SNOW = 8, TREE = 9, LAVA = 10, ICE = 11, CRYSTAL = 12, SPIRE = 13, SHIP = 14, RING = 15;
const RAMPS = [
  " .'`+*",       // void
  ' .',           // sky
  ' .:~',         // cloud
  ' .-~=',        // water
  ' .,:;',        // sand
  ' .,;+',        // grass
  ' .,:;+',       // dry ground
  ' .:^+#',       // rock
  ' .:+*',        // snow
  ' .:+*%&#',     // tree
  ' .:~=*%#@',    // lava
  ' .,:;+',       // ice
  ' .:+<>*#',     // crystal
  ' .:|!#',       // spire
  ' .:-=+*#',     // ship
  ' .:;',         // ring
];
// how much of the surface colour fills the cell behind the character. high values read as
// solid shapes with a light texture, low values as loose characters on black
const BACKING = [.9, .92, .9, .75, .8, .8, .8, .78, .85, .6, .5, .8, .5, .6, .6, .9];
// how much brighter than the scene the characters are drawn on a flat surface. low on sky and
// cloud, so their dots read as a fine grain over the colour rather than a pattern of their own
const GAIN = [1.45, 1.12, 1.15, 1.45, 1.45, 1.45, 1.45, 1.45, 1.45, 1.45, 1.45, 1.45, 1.45, 1.45, 1.45, 1.15];

// heights are metres, colour stops run from the shore (0) to the highest peak (1),
// tau is how much red/green/blue light the air scatters straight overhead,
// ground is the material of the shore, the wetter land and the drier land
const KINDS = [
  {
    label: 'temperate', cf: 1.2, bias: [-.08, .1], low: 8, mount: 34, deep: 15, rough: 1.5,
    ramp: [[0, '#d8c48c'], [.05, '#7da04a'], [.3, '#3e6d34'], [.58, '#6b6a5a'], [1, '#8d8a80']],
    dry: [[0, '#dfcf9c'], [.07, '#aaa35c'], [.35, '#80804c'], [.65, '#7a7361'], [1, '#8d8a80']],
    rock: '#59544c', ice: '#f1f5fa', snow: .6, polar: 1.3, bed: '#c9b783', ground: [SAND, GRASS, DRY],
    sea: 1, deepCol: '#051d44', shallow: '#1b8088',
    tau: [.05, .12, .3], atmo: .36, cover: [.45, .6], cloudCol: '#ffffff',
    props: [{ mat: TREE, n: 7000, col: '#2a5527', r: [1.3, 2.1], h: [4, 9], hn: [.03, .42], wet: .42 }],
  },
  {
    label: 'ocean', cf: 1.7, bias: [-.3, -.18], low: 7, mount: 24, deep: 18, rough: 1.2,
    ramp: [[0, '#f0e2b0'], [.08, '#69b05a'], [.4, '#2f7a45'], [.75, '#6f7a62'], [1, '#8d8a80']],
    dry: [[0, '#f4e8c0'], [.1, '#a6c064'], [.45, '#5d8a4a'], [.75, '#7a7361'], [1, '#8d8a80']],
    rock: '#5e5a50', ice: '#f1f5fa', snow: .9, polar: .8, bed: '#e6d6a0', ground: [SAND, GRASS, GRASS],
    sea: 1, deepCol: '#03254f', shallow: '#22b8b0',
    tau: [.045, .11, .28], atmo: .36, cover: [.38, .5], cloudCol: '#ffffff',
    props: [{ mat: TREE, n: 5000, col: '#2f7030', r: [1.3, 2], h: [5, 10], hn: [.04, .6], wet: .3 }],
  },
  {
    label: 'arid', cf: 1.4, bias: [.22, .4], low: 9, mount: 26, deep: 0, rough: 1.1, terrace: 5,
    ramp: [[0, '#e9dcb8'], [.04, '#d9a15f'], [.3, '#c26a3a'], [.6, '#8f4a2e'], [1, '#6e3b2a']],
    dry: [[0, '#f1e6c8'], [.05, '#e3b877'], [.35, '#cf8a4d'], [.65, '#9a5a3a'], [1, '#74432f']],
    rock: '#633c2c', ice: '#f4ead8', snow: 2, polar: 0, bed: '#e9dcb8', ground: [SAND, DRY, SAND],
    sea: 0, deepCol: '#000000', shallow: '#000000',
    tau: [.17, .11, .06], atmo: .33, cover: [.64, .76], cloudCol: '#f3dcc4',
    props: [{ mat: SPIRE, n: 2200, col: '#8a4f33', r: [2.5, 5], h: [8, 20], hn: [.02, .5], wet: 0, flat: 1 }],
  },
  {
    label: 'frozen', cf: 1.3, bias: [.02, .22], low: 6, mount: 30, deep: 0, rough: 1,
    ramp: [[0, '#b5dcea'], [.05, '#dfeef5'], [.4, '#f4f8fb'], [.7, '#9fb4c4'], [1, '#7b8ea0']],
    dry: [[0, '#9fcde2'], [.06, '#cfe4ee'], [.4, '#e9f1f6'], [.7, '#8fa5b6'], [1, '#74879a']],
    rock: '#5b6b7a', ice: '#ffffff', snow: .5, polar: .5, bed: '#b5dcea', ground: [ICE, SNOW, ICE],
    sea: 0, deepCol: '#000000', shallow: '#000000',
    tau: [.03, .07, .14], atmo: .34, cover: [.5, .66], cloudCol: '#eef6ff',
    props: [{ mat: CRYSTAL, n: 3200, col: '#7ff2ff', r: [.9, 1.6], h: [4, 13], hn: [0, .5], wet: .5, glow: .8 }],
  },
  {
    label: 'molten', cf: 1.5, bias: [-.04, .12], low: 6, mount: 32, deep: 6, rough: 2.2,
    ramp: [[0, '#3a1a12'], [.05, '#1e1615'], [.4, '#2c2525'], [.7, '#3b3333'], [1, '#4b4141']],
    dry: [[0, '#40190e'], [.06, '#251917'], [.4, '#302727'], [.7, '#3b3333'], [1, '#4b4141']],
    rock: '#161313', ice: '#5c5252', snow: .78, polar: 0, bed: '#3a1208', ground: [ROCK, ROCK, ROCK], veins: '#ff7a1a',
    sea: 2, deepCol: '#000000', shallow: '#000000',
    tau: [.1, .05, .03], atmo: .36, cover: [.5, .62], cloudCol: '#40302c',
    props: [{ mat: SPIRE, n: 1500, col: '#231c1c', r: [2, 4], h: [6, 16], hn: [.03, .5], wet: 0 }],
  },
  {
    label: 'overgrown', cf: 1.25, bias: [-.05, .12], low: 8, mount: 30, deep: 14, rough: 1.6,
    ramp: [[0, '#e8c6f0'], [.05, '#b04fd0'], [.3, '#7a2fa8'], [.6, '#4a3a6a'], [1, '#6a5a80']],
    dry: [[0, '#f0d0c8'], [.06, '#d86aa0'], [.35, '#a04080'], [.65, '#5a4070'], [1, '#6a5a80']],
    rock: '#3d3350', ice: '#f6e8ff', snow: .68, polar: 1, bed: '#c8a0d8', ground: [SAND, GRASS, DRY],
    sea: 1, deepCol: '#04292e', shallow: '#2fd6c0',
    tau: [.15, .07, .2], atmo: .38, cover: [.45, .6], cloudCol: '#ffe8f4',
    props: [{ mat: TREE, n: 7000, col: '#35e0c8', r: [1.2, 2], h: [3, 8], hn: [.03, .45], wet: .45, glow: .3 }],
  },
  {
    label: 'airless', cf: 1.6, bias: [.3, .5], low: 5, mount: 22, deep: 0, rough: 1, craters: 90,
    ramp: [[0, '#6f6b66'], [.3, '#8a8680'], [.7, '#a39e97'], [1, '#b8b3ab']],
    dry: [[0, '#625c55'], [.3, '#7d766d'], [.7, '#99938a'], [1, '#b8b3ab']],
    rock: '#4f4c48', ice: '#ffffff', snow: 2, polar: 0, bed: '#6f6b66', ground: [DRY, ROCK, DRY],
    sea: 0, deepCol: '#000000', shallow: '#000000',
    tau: [0, 0, 0], atmo: 0, cover: [1, 1], cloudCol: '#000000',
    props: [{ mat: CRYSTAL, n: 500, col: '#ffb040', r: [.9, 1.5], h: [3, 9], hn: [0, .6], wet: .55, glow: .9 }],
  },
];
const SUNS = [[1.3, 1.24, 1.14], [1.3, 1.24, 1.14], [1.4, 1.08, .8], [1.14, 1.22, 1.38]];

const planet = { height: [], normal: [], albedo: [], mat: [] };
for (let f = 0; f < 6; f++) {
  planet.height.push(new Float32Array(0));   // filled by buildFaces
  planet.normal.push(new Uint8Array(S * S * 4));
  planet.albedo.push(new Uint8Array(S * S * 4));
  planet.mat.push(new Uint8Array(S * S));
}
const wet = new Uint8Array(S * S * 6);

// the point (s, t), each -1..1, on cube face f; same face order and orientation as WebGL's cube maps
const faceVec = (f, s, t) => f === 0 ? [1, -t, -s] : f === 1 ? [-1, -t, s] : f === 2 ? [s, 1, t]
                           : f === 3 ? [s, -1, -t] : f === 4 ? [s, -t, 1] : [-s, -t, -1];

// faceVec is linear in s and t, so a face is three vectors: its centre and the steps along s and t
const AXES = [0, 1, 2, 3, 4, 5].map(f => {
  const a = faceVec(f, 0, 0);
  return [...a, ...sub(faceVec(f, 1, 0), a), ...sub(faceVec(f, 0, 1), a)];
});
// unit direction of the centre of texel (i, j) of face f
function faceDir(f, i, j, out = [0, 0, 0]) {
  const A = AXES[f], s = (2 * i + 1) / S - 1, t = (2 * j + 1) / S - 1, l = 1 / Math.sqrt(1 + s * s + t * t);
  out[0] = (A[0] + s * A[3] + t * A[6]) * l;
  out[1] = (A[1] + s * A[4] + t * A[7]) * l;
  out[2] = (A[2] + s * A[5] + t * A[8]) * l;
  return out;
}
// the directions of one whole face at a time, for the passes that visit every texel and its neighbours
const D = new Float32Array(S * S * 3);
function faceDirs(f) {
  const d = [0, 0, 0];
  for (let j = 0, k = 0; j < S; j++) for (let i = 0; i < S; i++, k += 3) {
    faceDir(f, i, j, d);
    D[k] = d[0]; D[k + 1] = d[1]; D[k + 2] = d[2];
  }
}

function cubeUV(d) {
  const [x, y, z] = d, ax = Math.abs(x), ay = Math.abs(y), az = Math.abs(z);
  let f, s, t;
  if (ax >= ay && ax >= az) { f = x > 0 ? 0 : 1; s = (x > 0 ? -z : z) / ax; t = -y / ax; }
  else if (ay >= az) { f = y > 0 ? 2 : 3; s = x / ay; t = (y > 0 ? z : -z) / ay; }
  else { f = z > 0 ? 4 : 5; s = (z > 0 ? x : -x) / az; t = -y / az; }
  return [f, (s + 1) * .5 * S - .5, (t + 1) * .5 * S - .5];
}
// height of texel (i, j) of face f. One texel past the edge it reads the neighbouring face, the way
// the GPU's seamless cube filtering does, so what you stand on matches what is drawn across the seams
function texelH(f, i, j) {
  if (i >= 0 && i < S && j >= 0 && j < S) return planet.height[f][j * S + i];
  const [g, u, v] = cubeUV(faceVec(f, (2 * i + 1) / S - 1, (2 * j + 1) / S - 1));
  return planet.height[g][clamp(Math.round(v), 0, S - 1) * S + clamp(Math.round(u), 0, S - 1)];
}
function heightAt(d) {
  const [f, u, v] = cubeUV(d), x = Math.floor(u), y = Math.floor(v), fx = u - x, fy = v - y;
  return lerp(lerp(texelH(f, x, y), texelH(f, x + 1, y), fx), lerp(texelH(f, x, y + 1), texelH(f, x + 1, y + 1), fx), fy);
}
// material under a direction, nearest texel
function matAt(d) {
  const [f, u, v] = cubeUV(d);
  return planet.mat[f][clamp(Math.round(v), 0, S - 1) * S + clamp(Math.round(u), 0, S - 1)];
}
// the surface the ship stops at: terrain, or the sea if there is one
const groundAt = d => Math.max(heightAt(d), planet.sea ? 0 : -1e9);

function rampTable(stops) {
  const t = new Float32Array(256 * 3), cols = stops.map(s => hex(s[1]));
  for (let i = 0; i < 256; i++) {
    const x = i / 255;
    let k = 1;
    while (k < stops.length - 1 && x > stops[k][0]) k++;
    t.set(mix3(cols[k - 1], cols[k], smooth(stops[k - 1][0], stops[k][0], x)), i * 3);
  }
  return t;
}

const NAME_A = ['Ve', 'Ko', 'Tha', 'Ori', 'Su', 'Mar', 'El', 'Zy', 'Nu', 'Ar', 'Xe', 'Ky', 'Bel', 'Dra', 'Io', 'Ty'];
const NAME_B = ['la', 'ron', 'ris', 'mea', 'tov', 'ne', 'dax', 'lun', 'phi', 'ra', 'sei', 'bes', 'kar', 'th', 'via', 'nix'];
const NAME_C = ['', '', ' II', ' III', ' IV', ' VI', ' Prime', '-7', '-9b', ' Minor'];
const onSphere = () => {
  const z = rf(-1, 1), a = rf(0, Math.PI * 2), r = Math.sqrt(1 - z * z);
  return [r * Math.cos(a), z, r * Math.sin(a)];
};

function design(seed) {
  rnd = mulberry(hashStr(seed));
  const perm = shuffled();
  noise = noiseOf(perm);
  const K = pick(KINDS), R = Math.round(rf(480, 660));
  // Mountains, roughness and forests keep the size in metres they have on a planet of radius 285 m, so a
  // bigger planet has more of them rather than bigger ones. Continents grow a little with the planet.
  const k = R / 285;
  Object.assign(planet, {
    seed, K, R, k, kc: k ** .6, perm, sea: K.sea,
    name: pick(NAME_A) + pick(NAME_B) + (rnd() < .35 ? pick(NAME_B) : '') + pick(NAME_C),
    lush: rampTable(K.ramp), dry: rampTable(K.dry),
    atmo: K.atmo * R, cover: rf(K.cover[0], K.cover[1]), cloudAlt: R * rf(.085, .11), cloudF: rf(2.6, 3.6),
    bias: rf(K.bias[0], K.bias[1]),
    off: [rf(-99, 99), rf(-99, 99), rf(-99, 99)],
    dayLen: rf(420, 600), tilt: rf(-.35, .35), sunCol: pick(SUNS), key: ri(0, 11),
    ring: rnd() < .3 && {
      n: norm([rf(-.5, .5), 1, rf(-.5, .5)]), inner: R * rf(1.5, 1.8), outer: R * rf(2.2, 2.7),
      col: linear(hex(pick(['#d8c8a8', '#b8c4d8', '#e0b090']))), alpha: rf(.5, .85), seed: rf(0, 50),
    },
    moon: rnd() < .6 && { dist: R * rf(9, 11), r: R * rf(.2, .34), speed: rf(.006, .015), phase: rf(0, 6), incl: rf(-.4, .4) },
    craters: Array.from({ length: Math.round((K.craters || 0) * k) }, () => ({ d: onSphere(), r: rf(.03, .16) / Math.sqrt(k) })),
  });
}

function terrain(x, y, z, craters) {
  const K = planet.K, [ox, oy, oz] = planet.off, cf = K.cf * planet.kc, mf = 3.1 * planet.k, df = 13 * planet.k;
  const land = (fbm(x * cf + ox, y * cf + oy, z * cf + oz, 5) + planet.bias) * 2.4;
  let h;
  if (land > 0) {
    const m = ridge(x * mf + oy, y * mf + oz, z * mf + ox, 4);
    h = land * K.low + m * m * K.mount * Math.min(1, land * 2.2);
  } else h = land * K.deep;
  h += fbm(x * df + oz, y * df + ox, z * df + oy, 2) * K.rough * (land > 0 ? 1 : .35);
  if (K.terrace) {
    const s = h / K.terrace, f = Math.floor(s);
    h = (f + smooth(.3, .7, s - f)) * K.terrace;
  }
  for (const c of craters) {
    const q = Math.sqrt(Math.max(0, 2 - 2 * (x * c.d[0] + y * c.d[1] + z * c.d[2]))) / c.r;
    if (q > 1.7) continue;
    const depth = c.r * planet.R * .22;
    h += (q < 1 ? depth * (q * q - 1) : 0) + depth * .4 * Math.exp(-(((q - 1) / .2) ** 2));
  }
  return K.sea ? h : Math.max(h, 0);
}

// Heights and wetness of one cube face. It uses nothing but the planet's numbers and the functions
// above, so it runs unchanged in a worker (see WORKER below).
function faceHeights(f, H, W) {
  const [ox, oy, oz] = planet.off, wf = 2.7 * planet.kc, d = [0, 0, 0], c = [0, 0, 0], B = 64;
  // craters are sorted into blocks of 64 x 64 texels, so a texel only tests the few that can reach it
  for (let bj = 0; bj < S; bj += B) for (let bi = 0; bi < S; bi += B) {
    faceDir(f, bi + B / 2 - .5, bj + B / 2 - .5, c);
    let reach = 0;
    for (const [ci, cj] of [[bi, bj], [bi + B, bj], [bi, bj + B], [bi + B, bj + B]]) {
      faceDir(f, ci - .5, cj - .5, d);
      reach = Math.max(reach, Math.acos(Math.min(1, c[0] * d[0] + c[1] * d[1] + c[2] * d[2])));
    }
    // a crater changes the ground out to 1.7 of its radius, measured along the chord
    const near = planet.craters.filter(q => Math.acos(clamp(c[0] * q.d[0] + c[1] * q.d[1] + c[2] * q.d[2], -1, 1)) < reach + 2 * Math.asin(Math.min(1, .85 * q.r)) + .001);
    for (let j = bj; j < bj + B; j++) for (let i = bi, k = j * S + bi; i < bi + B; i++, k++) {
      faceDir(f, i, j, d);
      H[k] = terrain(d[0], d[1], d[2], near);
      W[k] = clamp(fbm(d[0] * wf - ox, d[1] * wf - oy, d[2] * wf - oz, 2) * 1.7 + .5, 0, 1) * 255;
    }
  }
}

// The six faces are worked out side by side in workers where the browser allows it; a worker is this
// page's own functions, pasted into a script of its own.
const WORKER = `'use strict';
const S = ${S}, AXES = ${JSON.stringify(AXES)};
const clamp = ${clamp}, lerp = ${lerp}, smooth = ${smooth};
${noiseOf}
${fbm}
${ridge}
${terrain}
${faceDir}
${faceHeights}
let noise, planet;
onmessage = e => {
  planet = e.data.planet;
  noise = noiseOf(planet.perm);
  const H = new Float32Array(S * S), W = new Uint8Array(S * S);
  faceHeights(e.data.f, H, W);
  postMessage({ f: e.data.f, id: e.data.id, H, W }, [H.buffer, W.buffer]);
};`;
let pool = null, job = 0;
function workers() {
  if (pool) return pool;
  pool = [];
  try {
    const url = URL.createObjectURL(new Blob([WORKER], { type: 'text/javascript' }));
    for (let i = clamp((navigator.hardwareConcurrency || 2) - 1, 1, 6); i > 0; i--) pool.push(new Worker(url));
  } catch (e) { pool = []; }
  return pool;
}
// fills planet.height and wet for all six faces; tick(n) is called as each face is done
async function buildFaces(tick) {
  const id = ++job, { K, off, bias, craters, R, k, kc, perm } = planet, todo = [0, 1, 2, 3, 4, 5], got = new Set();
  const keep = (f, H, W) => { planet.height[f] = H; wet.set(W, f * S * S); got.add(f); tick(got.size); };
  const ws = workers();
  let live = true;
  if (ws.length) await new Promise(finish => {
    let busy = 0, timer = 0;
    const done = () => { clearTimeout(timer); finish(); };
    // A browser that will not run the worker, or one that has gone quiet (killed for memory, say): stop
    // using workers, for good, and do the rest here. A late answer must not land after the props have
    // been stamped into the heights, so none is taken from then on.
    const fail = () => { if (live) { live = false; ws.forEach(x => x.terminate()); pool = []; done(); } };
    const watch = () => { clearTimeout(timer); timer = setTimeout(fail, 20000); };
    const next = w => {
      if (!todo.length) { if (!busy) done(); return; }
      busy++;
      w.postMessage({ f: todo.shift(), id, planet: { K, off, bias, craters, R, k, kc, perm } });
    };
    for (const w of ws) {
      w.onmessage = e => {
        if (!live || e.data.id !== id) return;   // an answer for a planet we have since left
        busy--;
        watch();
        keep(e.data.f, e.data.H, e.data.W);
        next(w);
      };
      w.onerror = fail;
      next(w);
    }
    watch();
  });
  // whatever the workers did not do: all of it if there are none, the rest if one failed
  for (let f = 0; f < 6; f++) {
    if (got.has(f)) continue;
    await nextFrame();
    const H = new Float32Array(S * S), W = new Uint8Array(S * S);
    faceHeights(f, H, W);
    keep(f, H, W);
  }
}

// Besides the signals a planet has a few things to come upon: a ring of standing stones on a rise, the
// wreck of a lander on a flat, a cairn on the highest ground. Where they go comes from the seed, by a
// random stream of their own, so nothing else about the planet depends on them; one that finds no place
// is left out. Each is found by walking up to it.
const HENGE = 4.4;   // radius of the ring of standing stones, metres
function placeFinds() {
  const r = mulberry(hashStr(planet.seed + ' finds')), R = planet.R, list = [];
  const any = () => { const z = r() * 2 - 1, a = r() * Math.PI * 2, q = Math.sqrt(1 - z * z); return [q * Math.cos(a), z, q * Math.sin(a)]; };
  const over = (a, b) => Math.acos(clamp(dot(a, b), -1, 1)) * R;   // metres over the ground between two directions
  const taken = m => m === TREE || m === CRYSTAL || m === SPIRE || m === LAVA;
  // the point m metres from d, a of the way round it
  const beside = (d, m, a) => {
    const e = norm(cross(d, Math.abs(d[1]) < .9 ? [0, 1, 0] : [1, 0, 0])), g = cross(d, e);
    return norm(add(d, mul(add(mul(e, Math.cos(a * 6.2832)), mul(g, Math.sin(a * 6.2832))), m / R)));
  };
  // dry, open ground for m metres round d that rises and falls by no more than by
  const clear = (d, m, by) => {
    const h = heightAt(d);
    for (const part of [.4, .7, 1]) for (let i = 0; i < 8; i++) {
      const q = beside(d, m * part, i / 8);
      if (taken(matAt(q)) || Math.abs(heightAt(q) - h) > by) return false;
    }
    return !taken(matAt(d)) && h > 1.5;
  };
  const apart = (d, m) => list.every(f => over(d, f.dir) > m) && planet.beacons.every(b => over(d, b.dir) > 60);
  // the same, looked at every 0.6 m: nothing grows on any of it and there is no step in it
  const whole = (d, m, by) => {
    const h = heightAt(d), e = norm(cross(d, Math.abs(d[1]) < .9 ? [0, 1, 0] : [1, 0, 0])), g = cross(d, e);
    for (let x = -m; x <= m; x += .6) for (let y = -m; y <= m; y += .6) {
      if (x * x + y * y > m * m) continue;
      const q = norm(add(d, mul(add(mul(e, x), mul(g, y)), 1 / R)));
      if (taken(matAt(q)) || Math.abs(heightAt(q) - h) > by) return false;
    }
    return true;
  };
  const add1 = (what, d, near, says, more) => list.push({ what, dir: d, pos: mul(d, R + heightAt(d)), face: sub(beside(d, 1, r()), d), near, says, got: false, ...more });

  // stones: of the open, level places tried, the one that stands highest over the ground 45 m round it
  let best = null;
  for (let i = 0, found = 0; i < 4000 && found < 30; i++) {
    const d = any();
    if (heightAt(d) < 2 || slopeAt(d) > .2 || !clear(d, HENGE + 3, .8)) continue;
    let round = 0;
    for (let k = 0; k < 8; k++) round += floorAt(beside(d, 45, k / 8)) / 8;
    const rise = heightAt(d) - round;
    found++;
    if ((!best || rise > best.rise) && apart(d, 0) && whole(d, HENGE + 1.5, .8)) best = { d, rise };
  }
  if (best) {
    const n = 5 + Math.floor(r() * 4), skip = Math.floor(r() * n);
    add1('stones', best.d, HENGE + 3, `standing stones: ${n - 1} in a ring ${Math.round(HENGE * 2)} m across, and a gap where one stood`, { n, skip });
  }
  // wreck: the first flat, open place well away from the stones
  for (let i = 0; i < 4000; i++) {
    const d = any();
    if (heightAt(d) < 1.5 || slopeAt(d) > .25 || !clear(d, 4, .6) || !apart(d, 150)) continue;
    add1('wreck', d, 6, 'the wreck of a lander');
    break;
  }
  // cairn: on the highest texel that is ground
  let top = -1, tf = 0, tk = 0;
  for (let f = 0; f < 6; f++) {
    const H = planet.height[f], M = planet.mat[f];
    for (let k = 0; k < H.length; k++) if (H[k] > top && !taken(M[k])) { top = H[k]; tf = f; tk = k; }
  }
  const peak = [...faceDir(tf, tk % S, tk / S | 0)];
  // a peak is one texel across and the pile is wider: it sits as low as the ground under its rim, though
  // never so low that the tip of the peak shows through it
  const rim = Math.min(...[0, 1, 2, 3, 4, 5, 6, 7].map(k => heightAt(beside(peak, .6, k / 8))));
  if (top > 3 && apart(peak, 30)) add1('summit', peak, 5, `the summit of ${planet.name}, ${Math.round(top)} m above the datum`, { pos: mul(peak, R + Math.max(rim, top - .9)) });
  planet.finds = list;
}

// trees, spires and crystals are bumps stamped into the height map
function scatter() {
  let top = 0, low = 0;
  const land = [];
  for (const H of planet.height) for (let i = 0; i < H.length; i++) {
    if (H[i] > top) top = H[i];
    if (H[i] <= 0) low++;
    else if (i % 61 === 0) land.push(H[i]);
  }
  planet.peak = top;
  planet.flat = low / (6 * S * S);
  // the heights that half and nine tenths of the land lie below: lowland, hills and mountains on the chart
  land.sort((a, b) => a - b);
  planet.shelf = [land[land.length >> 1] || 0, land[Math.floor(land.length * .9)] || 0];
  planet.trees = [];   // the nearest of these are drawn as real shapes
  planet.treeCol = [0, 0, 0]; planet.treeGlow = 0;
  const dq = [0, 0, 0];
  for (const P of planet.K.props) {
    const c = hex(P.col), count = Math.round(P.n * planet.k * planet.k);   // as many per square metre on any size of planet
    for (let n = 0; n < count; n++) {
      // centres are uniform over the sphere: cube texels shrink toward the edges, so picking
      // texels uniformly would crowd the props there
      const [f, cu, cv] = cubeUV(onSphere()), ci = Math.round(cu), cj = Math.round(cv);
      const r = rf(P.r[0], P.r[1]), hh = rf(P.h[0], P.h[1]);
      if (ci < 1 || cj < 1 || ci > S - 2 || cj > S - 2) continue;
      const d0 = faceDir(f, ci, cj), texel = planet.R * len(sub(faceDir(f, ci + 1, cj, dq), d0));   // texel size here, metres
      const w = Math.ceil(r / texel) + 1;
      if (ci - w < 0 || cj - w < 0 || ci + w > S - 1 || cj + w > S - 1) continue;   // the whole stamp stays on one face
      const k = cj * S + ci, H = planet.height[f], A = planet.albedo[f], h0 = H[k], hn = h0 / top;
      if (hn < P.hn[0] || hn > P.hn[1] || h0 < .3 || A[k * 4 + 3] || wet[f * S * S + k] / 255 < P.wet) continue;   // not on top of another
      if ((Math.abs(H[k + 1] - H[k - 1]) + Math.abs(H[k + S] - H[k - S])) / (2 * texel) > 1.4) continue;   // too steep
      for (let j = cj - w; j <= cj + w; j++) for (let i = ci - w; i <= ci + w; i++) {
        const q = j * S + i, dist = len(sub(faceDir(f, i, j, dq), d0)) * planet.R / r;
        if (dist >= 1.4) continue;
        // a tree's cone is slimmer than the fir drawn over it, so it never shows between the boughs
        if (dist >= (P.mat === TREE ? .9 : 1)) {
          // a ring of the prop's colour round its foot, so the sides of the cone the terrain makes
          // do not fade into the ground's colour (trees and rock spires only). It is still ground:
          // paintFace gives it the ground's material, so it is not drawn with boughs or strata.
          if (!A[q * 4 + 3] && (P.mat === TREE || P.mat === SPIRE)) {
            A[q * 4] = c[0] * 200; A[q * 4 + 1] = c[1] * 200; A[q * 4 + 2] = c[2] * 200; A[q * 4 + 3] = 1;
          }
          continue;
        }
        const v = h0 + hh * (P.flat ? smooth(1, .55, dist) : P.mat === TREE ? 1 - dist / .9 : Math.pow(1 - dist, .8));
        if (v <= H[q]) continue;
        H[q] = v;
        A[q * 4] = c[0] * 255; A[q * 4 + 1] = c[1] * 255; A[q * 4 + 2] = c[2] * 255; A[q * 4 + 3] = 1 + (P.glow || 0) * 254;
        planet.mat[f][q] = P.mat;
      }
      if (P.mat === TREE) planet.trees.push({ pos: mul(d0, planet.R + h0), h: hh, r, seed: (n * 7.31) % 97 });
    }
    if (P.mat === TREE) { planet.treeCol = linear(c); planet.treeGlow = P.glow || 0; }
  }
  // A fir's boughs spread wider than its cone, and nobody walks in under them: each tree has a reach,
  // 1.1 m beyond its boughs. Where two reaches would meet, both are drawn in, as far as 0.45 m from the
  // boughs, so there is a way between two trees unless their boughs all but touch.
  const byX = planet.trees.slice().sort((a, b) => a.pos[0] - b.pos[0]);
  byX.forEach((t, i) => {
    t.reach = t.r * 1.2 + 1.1;
    for (const step of [-1, 1]) for (let j = i + step; byX[j] && Math.abs(byX[j].pos[0] - t.pos[0]) < 12; j += step) {
      const o = byX[j];
      if (len(sub(o.pos, t.pos)) > 12) continue;   // near in x only, anywhere round the planet
      const gap = aside(norm(o.pos), t.pos) - (t.r + o.r) * 1.2 - 2.2;
      if (gap < .5) t.reach = Math.min(t.reach, t.r * 1.2 + 1.1 - Math.min(.65, (.5 - gap) / 2));
    }
  });
  planet.top = top + 22;   // tallest prop on the highest ground
}

// The ray march reads a small pyramid of maps to know how far it can go without looking. Each holds, for
// a block of texels together with the eight blocks round it, the highest ground there and the steepest
// slope (paintFace measures the slopes). Level 0 has blocks of TB x TB texels, about 2 to 5 m; each level
// up doubles that, to 130 to 300 m at level 6. Above everything in a block and its neighbours nothing can
// be in a ray's way; and where the ground there is gentle, the height over it is a fair guide to how
// close it is.
const TB = 4, SB = S / TB, LEVELS = 7;
const steep = Array.from({ length: 6 }, () => new Float32Array(SB * SB));
function highGround() {
  // highest and steepest of each block alone
  let tops = [], slopes = steep, n = SB;
  for (let f = 0; f < 6; f++) {
    const H = planet.height[f], C = new Float32Array(n * n).fill(-1e9);
    for (let j = 0; j < S; j++) for (let i = 0, row = (j / TB | 0) * n; i < S; i++) {
      const b = row + (i / TB | 0);
      if (H[j * S + i] > C[b]) C[b] = H[j * S + i];
    }
    tops.push(C);
  }
  planet.tops = [];
  for (let level = 0; level < LEVELS; level++, n /= 2) {
    const size = S / n, own = tops, sl = slopes;
    // each block also takes in its eight neighbours
    planet.tops.push(own.map((C, f) => {
      const T = new Float32Array(n * n * 2);
      for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
        let top = -1e9, slope = 0;
        const take = (g, b) => { if (own[g][b] > top) top = own[g][b]; if (sl[g][b] > slope) slope = sl[g][b]; };
        for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
          const x = i + di, y = j + dj;
          if (x >= 0 && x < n && y >= 0 && y < n) { take(f, y * n + x); continue; }
          // across an edge of the cube the blocks of the two faces do not line up exactly, so take the
          // block that is there and the ones round it
          const [g, u, v] = cubeUV(faceVec(f, (2 * x + 1) / n - 1, (2 * y + 1) / n - 1));
          const bx = clamp(Math.floor((u + .5) / size), 0, n - 1), by = clamp(Math.floor((v + .5) / size), 0, n - 1);
          for (let ey = Math.max(by - 1, 0); ey <= Math.min(by + 1, n - 1); ey++)
            for (let ex = Math.max(bx - 1, 0); ex <= Math.min(bx + 1, n - 1); ex++) take(g, ey * n + ex);
        }
        T[(j * n + i) * 2] = planet.sea ? Math.max(top, 0) : top;
        T[(j * n + i) * 2 + 1] = slope;
      }
      return T;
    }));
    // the next level's blocks are four of this level's
    const half = n / 2, halve = A => A.map(C => {
      const P = new Float32Array(half * half);
      for (let j = 0; j < half; j++) for (let i = 0; i < half; i++)
        P[j * half + i] = Math.max(C[2 * j * n + 2 * i], C[2 * j * n + 2 * i + 1], C[(2 * j + 1) * n + 2 * i], C[(2 * j + 1) * n + 2 * i + 1]);
      return P;
    });
    tops = halve(own); slopes = halve(sl);
  }
}

// normals, colours and materials for one face
function paintFace(f) {
  const H = planet.height[f], A = planet.albedo[f], Nm = planet.normal[f], M = planet.mat[f], W = wet.subarray(f * S * S);
  const { R, sea, lush, dry, K, peak } = planet, steepest = steep[f].fill(0);
  faceDirs(f);
  const rock = hex(K.rock), ice = hex(K.ice), bed = hex(K.bed), vein = K.veins && hex(K.veins);
  const rad = h => R + (sea ? Math.max(h, 0) : h);
  // position of texel (i, j); past the edge of the face it is the neighbouring face's texel there,
  // with that texel's own direction, so the height and the direction belong to the same point
  const P = [0, 0, 0];
  const at = (i, j) => {
    let v, h;
    if (i >= 0 && i < S && j >= 0 && j < S) { v = faceDir(f, i, j); h = H[j * S + i]; }
    else {
      const [g, u, w] = cubeUV(faceVec(f, (2 * i + 1) / S - 1, (2 * j + 1) / S - 1));
      const gi = clamp(Math.round(u), 0, S - 1), gj = clamp(Math.round(w), 0, S - 1);
      v = faceDir(g, gi, gj); h = planet.height[g][gj * S + gi];
    }
    const r = rad(h);
    P[0] = v[0] * r; P[1] = v[1] * r; P[2] = v[2] * r;
    return P;
  };
  for (let j = 0, k = 0; j < S; j++) for (let i = 0; i < S; i++, k++) {
    let ax, ay, az, bx, by, bz;
    if (i > 0 && j > 0 && i < S - 1 && j < S - 1) {
      const l = k - 1, r = k + 1, u = k - S, d = k + S, rl = rad(H[l]), rr = rad(H[r]), ru = rad(H[u]), rd = rad(H[d]);
      ax = D[r * 3] * rr - D[l * 3] * rl; ay = D[r * 3 + 1] * rr - D[l * 3 + 1] * rl; az = D[r * 3 + 2] * rr - D[l * 3 + 2] * rl;
      bx = D[d * 3] * rd - D[u * 3] * ru; by = D[d * 3 + 1] * rd - D[u * 3 + 1] * ru; bz = D[d * 3 + 2] * rd - D[u * 3 + 2] * ru;
    } else {
      let q = at(i + 1, j); ax = q[0]; ay = q[1]; az = q[2];
      q = at(i - 1, j); ax -= q[0]; ay -= q[1]; az -= q[2];
      q = at(i, j + 1); bx = q[0]; by = q[1]; bz = q[2];
      q = at(i, j - 1); bx -= q[0]; by -= q[1]; bz -= q[2];
    }
    const nx = ay * bz - az * by, ny = az * bx - ax * bz, nz = ax * by - ay * bx, nl = Math.hypot(nx, ny, nz);
    const up = (nx * D[k * 3] + ny * D[k * 3 + 1] + nz * D[k * 3 + 2]) / nl, sc = (up < 0 ? -127.5 : 127.5) / nl;
    Nm[k * 4] = nx * sc + 127.5; Nm[k * 4 + 1] = ny * sc + 127.5; Nm[k * 4 + 2] = nz * sc + 127.5;
    const rise = Math.sqrt(Math.max(0, 1 - up * up)) / Math.max(Math.abs(up), .001), b = (j / TB | 0) * SB + (i / TB | 0);
    if (rise > steepest[b]) steepest[b] = rise;
    const ring = A[k * 4 + 3] && !M[k];   // the ring round a prop's foot: it keeps the colour and takes the ground's material
    if (A[k * 4 + 3] && !ring) continue;   // a prop owns this texel
    const h = H[k], m = W[k] / 255;
    let cr, cg, cb;
    if (sea && h <= 0) {
      [cr, cg, cb] = bed;
      M[k] = SAND;
    } else {
      const slope = 1 - Math.abs(up), hn = clamp(h / peak, 0, 1), q = (hn * 255 | 0) * 3;
      const w = smooth(.3, .6, m), cl = smooth(.1, .28, slope);
      const sn = smooth(-.06, .04, hn - K.snow + (Math.abs(D[k * 3 + 1]) - .72) * K.polar + (m - .5) * .12) * (1 - .6 * smooth(.3, .55, slope));
      cr = lerp(lerp(lerp(dry[q], lush[q], w), rock[0], cl), ice[0], sn);
      cg = lerp(lerp(lerp(dry[q + 1], lush[q + 1], w), rock[1], cl), ice[1], sn);
      cb = lerp(lerp(lerp(dry[q + 2], lush[q + 2], w), rock[2], cl), ice[2], sn);
      M[k] = sn > .5 ? SNOW : cl > .5 ? ROCK : K.ground[hn < .04 ? 0 : w > .5 ? 1 : 2];
      // veins of lava follow one contour of the wetness map: a core at full strength that fades into the
      // rock on either side, so a vein is a few texels wide and does not break up into dashes
      const hot = vein && !ring && h < peak * .5 ? smooth(.03, .012, Math.abs(m - .5)) : 0;
      if (hot > .02) {
        cr = lerp(cr, vein[0], hot); cg = lerp(cg, vein[1], hot); cb = lerp(cb, vein[2], hot);
        A[k * 4 + 3] = Math.max(3, hot * 220);
        if (hot > .5) M[k] = LAVA;
      }
    }
    if (!ring) { A[k * 4] = cr * 255; A[k * 4 + 1] = cg * 255; A[k * 4 + 2] = cb * 255; }
  }
}

function placeBeacons() {
  const list = [];
  for (let i = 0; i < 6000 && list.length < 5; i++) {
    const d = onSphere(), h = heightAt(d), side = norm(cross(d, [.3, .9, .2]));
    if (h < 1.5 || h > planet.peak * (i < 3000 ? .5 : 1)) continue;
    if (Math.abs(heightAt(norm(add(d, mul(side, 2.7 / planet.R)))) - h) > 1.5) continue;
    if (list.some(b => dot(b.dir, d) > (i < 2000 ? .5 : i < 4000 ? .8 : .96))) continue;
    list.push({ dir: d, base: mul(d, planet.R + h), got: false });
  }
  planet.beacons = list;
}

// ---- gl

const canvas = document.getElementById('view');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
if (!gl) {
  document.body.textContent = 'planet.txt needs WebGL 2';
  throw new Error('no webgl2');
}

function shader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  return s;
}
// Starts a compile and link without asking how it went: asking makes the browser wait, and the three
// programs can be compiled side by side if nobody asks until all three have been started.
function program(vs, fs) {
  const p = gl.createProgram(), v = shader(gl.VERTEX_SHADER, vs), f = shader(gl.FRAGMENT_SHADER, fs);
  gl.attachShader(p, v); gl.attachShader(p, f);
  gl.linkProgram(p);
  return { p, v, f, u: {} };
}
function linked({ p, v, f, u }) {
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error([gl.getProgramInfoLog(p), gl.getShaderInfoLog(v), gl.getShaderInfoLog(f)].join('\n'));
  for (let i = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS) - 1; i >= 0; i--) {
    const name = gl.getActiveUniform(p, i).name.replace('[0]', '');
    u[name] = gl.getUniformLocation(p, name);
  }
}
function texture(unit, target, min, wrap = gl.CLAMP_TO_EDGE) {
  const t = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(target, t);
  gl.texParameteri(target, gl.TEXTURE_MIN_FILTER, min);
  // a nearest min filter gets a nearest mag filter too: the maps of high ground must be read a block at a time
  gl.texParameteri(target, gl.TEXTURE_MAG_FILTER, min === gl.NEAREST || min === gl.NEAREST_MIPMAP_NEAREST ? gl.NEAREST : gl.LINEAR);
  gl.texParameteri(target, gl.TEXTURE_WRAP_S, wrap);
  gl.texParameteri(target, gl.TEXTURE_WRAP_T, wrap);
  if (target === gl.TEXTURE_3D) gl.texParameteri(target, gl.TEXTURE_WRAP_R, wrap);
  return t;
}

const QUAD = `#version 300 es
out vec2 vUv;
void main() {

// pass 1: ray march the planet into a small buffer, six pixels per character cell
const SCENE = `#version 300 es
precision highp float;
precision highp int;
precision highp sampler3D;
precision highp samplerCube;   // the default is lowp, and the height map holds metres

uniform samplerCube uHeight, uNormal, uAlbedo, uMat, uTops;
uniform sampler3D uNoise;
uniform vec3 uPos, uFwd, uRight, uUp, uSun, uSunCol;
uniform vec2 uFov;
uniform float uTime, uR, uTop, uPix, uTexel, uBlock, uAtmo, uAdapt, uEmit;
uniform vec3 uBeta, uShallow, uCloudCol, uRingN, uRingCol, uBeaconCol;
uniform vec4 uSea, uCloud, uRing, uMoon, uShip;
uniform vec3 uShipFwd, uRock;
uniform vec4 uFind[3], uFindB[3];   // the things to find: where and what (0 none, 1 stones, 2 wreck, 3 cairn); which way it faces and one number more
uniform vec4 uTree[12], uTreeB[12];   // the nearest trees: base position and height; radius and a seed
uniform int uTreeN;
uniform vec2 uTreeFade;
uniform vec3 uTreeCol;
uniform float uTreeGlow;
uniform vec4 uBeacon[5];
in vec2 vUv;
layout(location = 0) out vec4 o;
layout(location = 1) out vec4 info;
float glow;   // how much of this pixel is a light source, 0..1
float mat;    // which set of characters it gets, an index into RAMPS

uint ih(uint x) { x ^= x >> 16; x *= 0x7feb352dU; x ^= x >> 15; x *= 0x846ca68bU; x ^= x >> 16; return x; }
float hash(vec3 p) {
  ivec3 q = ivec3(floor(p));
  return float(ih(uint(q.x) * 1973U + uint(q.y) * 9277U + uint(q.z) * 26699U) >> 8) / 16777216.;
}
float n3(vec3 p) {
  vec3 i = floor(p), f = fract(p);
  f = f * f * (3. - 2. * f);
  return textureLod(uNoise, (i + f + .5) / 32., 0.).r;
}
float fbm(vec3 p) {
  float s = 0., a = .5;
  for (int i = 0; i < 4; i++) { s += a * n3(p); p = p * 2.03 + 7.1; a *= .5; }
  return s / .9375;
}
// distances to where a ray enters and leaves a sphere at the origin
vec2 sphere(vec3 ro, vec3 rd, float r) {
  float b = dot(ro, rd), h = b * b - dot(ro, ro) + r * r;
  if (h < 0.) return vec2(1e9, -1e9);
  h = sqrt(h);
  return vec2(-b - h, -b + h);
}
bool hits(vec2 s) { return s.x > 0. && s.x < s.y; }

// 1 while a pattern of wavelength lambda (metres) is coarser than the picture's finest patch F, 0 once it is finer
float fine(float F, float lambda) { return 1. - smoothstep(lambda, 2.5 * lambda, F); }

float ground(vec3 p) {
  float h = textureLod(uHeight, p, 0.).r;
  return uSea.a > .5 ? max(h, 0.) : h;
}
float above(vec3 p) { return length(p) - uR - ground(p); }

// Distance along the ray to the terrain, or -1.
// The height over the ground straight below is not the distance to the ground: a tree or a rock spire is
// a near-vertical wall, and a ray can be metres above the plain and a hand's width from one. A step of
// half that height is only safe where the ground is gentle, and the maps of high ground say where that is:
// - above everything in a block and the blocks round it, the ray is clear until it has come down to that
//   height or gone a block sideways, and the ground itself need not be looked at;
// - where nothing nearby is steeper than 60 degrees, half the height is always clear;
// - among steep things, below their tops, the step stays under a metre near the eye and under 1.2% of
//   the distance further off, so close by none is stepped over whole. A ray that has already taken more
//   than 50 steps may go further, because the shortest step grows with the count (least, below): up to
//   2.6% of the distance. A tree's tip is narrower than the step and can still be missed, more of it the
//   further off; shorter steps there would cost more than the tip is worth.
// A short step needs no map at all, and what a map said holds for a block's width, so most steps cost one
// look at the ground as they always did.
float march(vec3 ro, vec3 rd) {
  vec2 s = sphere(ro, rd, uR + uTop);
  if (s.y < 0.) return -1.;
  float t = max(s.x, 0.), tp = t, a = -1e9, ap = 1.;   // ap: height over the ground at tp, the last point known clear
  // air: the last map read said the ray is above everything near, so read the map first again.
  // room: what the last map said about the ground, and for how many more metres sideways it holds;
  //       positive for gentle ground, negative for steep things close by.
  // lv: which level of the pyramid to read; it may rise as far as roof, which drops to just under a level
  //     that found something steep and creeps back up, so the march does not keep asking the same thing.
  bool hit = false, air = s.x > 0.;
  float room = 0., lv = air ? 4. : 0., roof = 6.;
  for (int i = 0; i < 170 && t < s.y; i++) {
    vec3 p = ro + rd * t;
    float r = length(p), alt = r - uR, down = -dot(rd, p) / r, across = max(sqrt(max(1. - down * down, 0.)), .05);
    // the shortest step grows the longer the ray has been going, so one that skims a crest still gets past it
    float least = t * (.006 + .00012 * float(i)), thin = max(.9, .012 * t);
    if (!air) {
      if (a < -1e8) {
        a = alt - ground(p);
        if (a < .0015 * t) { hit = true; break; }
      }
      if (a * .5 <= thin || room != 0.) {
        float go = max(room > 0. ? min(a * .5, max(room / across, thin)) : min(a * .5, thin), least);
        // a step cut short by the edge of the block asks for a bigger block next time
        if (room > 0. && a * .5 > room / across) lv = min(lv + 1., floor(roof));
        room = room > 0. ? max(room - go * across, 0.) : min(room + go * across, 0.);
        roof = min(roof + .25, 6.);
        tp = t; ap = a; t += go; a = -1e9;
        continue;
      }
    }
    vec2 hi = textureLod(uTops, p, lv).rg;
    float c = alt - hi.x, block = uBlock * exp2(lv);
    if (c > 0.) {
      air = true; room = 0.;
      float side = block / across, drop = c / max(down, 1e-3);
      tp = t; ap = c; t += max(min(side, drop), least); a = -1e9;
      if (side < drop) lv = min(lv + 1., floor(roof));
      roof = min(roof + .25, 6.);
      continue;
    }
    air = false;
    // something steep in there, and the ray is below its top: look at a smaller block
    if (hi.y >= 1.7 && lv > 0.) { roof = lv - 1.; lv = max(lv - 2., 0.); }
    else room = hi.y < 1.7 ? block : -2. * block;
  }
  if (!hit) {
    // A ray that runs out of steps close over the ground has been skimming it for a long way; it takes
    // the ground it is over, which is closer to the truth than a hole or the far horizon.
    if (t >= s.y) return -1.;
    return above(ro + rd * t) < .03 * t + .5 ? t : -1.;
  }
  for (int k = 0; k < 5; k++) {
    float tm = .5 * (tp + t), am = above(ro + rd * tm);
    if (am < 0.) { t = tm; a = am; } else { tp = tm; ap = am; }
  }
