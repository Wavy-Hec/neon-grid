  col = 1. - exp(-col * 1.3);
  o = vec4(pow(max(col, 0.), vec3(.4545)), 1.);
  info = vec4(mat / 255., clamp(glow, 0., 1.), 1. - exp(-seen / 120.), 1.);
}`;

// pass 2: one pixel per character cell. picks the character and its two colours
const CELLS = `#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;
uniform sampler2D uScene, uInfo, uTables;   // uTables: rows 0-1 glyph shapes; row 2 + m, material m's characters
uniform vec2 uGrid;
uniform int uCount;
uniform float uInk;
uniform float uBack[${RAMPS.length}], uGain[${RAMPS.length}], uLift[${RAMPS.length}];
uniform sampler2D uFlakes;   // a snowflake in the cell: how bright, how far (as the info buffer has it), how far up the cell, whether near
uniform ivec3 uFlakeChars;   // the characters it is drawn with: a mark at the top of the cell, a star, a mark at the bottom
const float DITHER = .06, FAR_TONE = .6, EDGE_FAR = .75;
layout(location = 0) out vec4 o0;
layout(location = 1) out vec4 o1;
layout(location = 2) out vec4 o2;

void main() {
  vec2 cell = floor(gl_FragCoord.xy);
  vec3 c[6], avg = vec3(0.), dark;
  float d[6], top = 0., lo = 9., low = 9., em = 0., first = 0., nearest = 1.;
  bool mixed = false;   // do the six samples see more than one material
  // the info buffer holds ids, so read whole texels rather than sampling on the corners they share
  ivec2 per = textureSize(uInfo, 0) / ivec2(uGrid), part = per / ivec2(2, 3);
  for (int k = 0; k < 6; k++) {
    vec2 uv = (cell + vec2((float(k & 1) + .5) * .5, 1. - (float(k >> 1) + .5) / 3.)) / uGrid;
    c[k] = textureLod(uScene, uv, 0.).rgb;
    avg += c[k] / 6.;
    vec4 info = texelFetch(uInfo, ivec2(cell) * per + ivec2(k & 1, 2 - (k >> 1)) * part + part / 2, 0);
    em += info.g / 6.;
    nearest = min(nearest, info.b);
    if (k == 0) first = info.r; else mixed = mixed || abs(info.r - first) > .002;
    float l = dot(c[k], vec3(.299, .587, .114));
    if (l < low) { low = l; dark = c[k]; }
    d[k] = min(1., pow(l, 1.5) * 1.15) * uInk;
    top = max(top, d[k]);
    lo = min(lo, d[k]);
  }
  // push the samples apart so an edge inside the cell survives the match
  if (top > 0.) for (int k = 0; k < 6; k++) d[k] = top * pow(d[k] / top, 1.4);

  vec3 a = vec3(d[0], d[1], d[2]), b = vec3(d[3], d[4], d[5]);
  float edge = smoothstep(.1, .3, (top - lo) / uInk);
  // noise with no pattern to it: an ordered one alternates two characters column by column, like a weave
  uint hc = uint(cell.x) * 1973U + uint(cell.y) * 9277U;
  hc ^= hc >> 16; hc *= 0x7feb352dU; hc ^= hc >> 15; hc *= 0x846ca68bU; hc ^= hc >> 16;
  float dither = float(hc >> 8) / 16777216. - .5;
  float mean = (a.x + a.y + a.z + b.x + b.y + b.z) / 6.;
  vec3 ca = a - mean, cb = b - mean;
  float spread = dot(ca, ca) + dot(cb, cb);   // how far the cell is from flat

  // a flat cell takes the character its material uses at this brightness;
  // a cell with an edge in it takes whichever character has the closest shape
  vec4 centre = texelFetch(uInfo, ivec2(cell) * per + per / 2, 0);
  int m = int(centre.r * 255. + .5);
  // inside open sky, cloud or space a change in brightness is a glow, never an edge: the halo round
  // the sun, taken for one, would be a ring of blank cells
  bool air = m == ${SKY} || m == ${CLOUD} || m == ${VOID} || m == ${RING};
  // the aurora and a meteor are light in the sky too, but they are drawn in strokes and keep their edges
  bool streak = m == ${AURORA} || m == ${METEOR}, sky = air || streak;
  if (air && !mixed) edge = 0.;
  // Distance thins the picture out: far ground is drawn with lighter characters and far outlines are
  // left to the colour behind them, so what is near you is what has texture and hard edges.
  edge *= streak ? 1. : 1. - EDGE_FAR * nearest;
  float tone01 = pow(clamp(mean / uInk, 0., 1.), uLift[m]) * (sky ? 1. : mix(1., FAR_TONE, centre.b));
  // the noise spans a whole step between characters, so one character gives way to the next through a
  // stipple of the two, not along a line
  int level = int(clamp(tone01 + dither * (sky ? .08 : DITHER) * smoothstep(0., .05, tone01), 0., 1.) * 15. + .5);
  int tone = int(texelFetch(uTables, ivec2(level, 2 + m), 0).r * 255. + .5), glyph = tone;
  float best = 1e9;
  for (int i = 0; i < uCount; i++) {
    if (i != tone && texelFetch(uTables, ivec2(i, 2 + m), 0).g < .5) continue;
    vec3 ga = texelFetch(uTables, ivec2(i, 0), 0).rgb, gb = texelFetch(uTables, ivec2(i, 1), 0).rgb;
    float gm = (ga.x + ga.y + ga.z + gb.x + gb.y + gb.z) / 6.;
    vec3 sa = ga - gm - ca, sb = gb - gm - cb;
    // another character only replaces the tone when it really has the shape of this edge
    if (i != tone && dot(sa, sa) + dot(sb, sb) > .6 * spread) continue;
    vec3 da = ga - a, db = gb - b;
    float e = dot(da, da) + dot(db, db);
    e = i == tone ? e * edge : e + 1. - edge;
    if (e < best) { best = e; glyph = i; }
  }

  vec3 fg = vec3(0.);
  float w = 0.;
  for (int k = 0; k < 6; k++) { fg += c[k] * (d[k] + .001); w += d[k] + .001; }
  fg /= w;
  // ink covers a fraction of the cell, so it is drawn brighter than the scene: a little inside
  // a surface, where it is only texture, and a lot along an edge, where it is the outline
  fg = max(mix(vec3(dot(fg, vec3(.299, .587, .114))), fg, 1.2), 0.) * mix(uGain[m], 2., edge);
  fg /= max(1., max(fg.r, max(fg.g, fg.b)));

  // A snowflake in front of everything in the cell: close by a star; further off a mark at the top of the
  // cell while it is in the top half and one at the bottom in the bottom half, so it is seen to fall
  // through it
  vec4 fl = texelFetch(uFlakes, ivec2(cell), 0);
  if (fl.r > 0. && fl.g < nearest) {
    glyph = fl.a > .5 ? uFlakeChars.y : fl.b > .5 ? uFlakeChars.x : uFlakeChars.z;
    fg = vec3(.86, .9, 1.) * fl.r;
  }

  o0 = vec4(fg, float(glyph) / 255.);
  // lighter characters carry less of the brightness, so far off the colour behind them carries more
  o1 = vec4((m == ${VOID} ? dark : avg) * (sky ? uBack[m] : mix(uBack[m], max(uBack[m], .9), centre.b)), 1.);
  o2 = vec4(avg * em, 1.);
}`;

// pass 3: stamp the characters at full resolution, add bloom, lay the interface text on top
const FINAL = `#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;
uniform sampler2D uScene, uC0, uC1, uGlow, uAtlas, uText, uFont;
uniform vec2 uRes, uCell, uGrid, uAtlasGrid, uTextCell;
uniform float uRaw;
uniform vec3 uAccent, uBar, uDim;   // the interface's inks, from the world: its signal's colour, its darkest ground, a grey leaning to its land
out vec4 o;

float ink(sampler2D atlas, int g, vec2 f) { return textureLod(atlas, (vec2(float(g % 16), float(g / 16)) + f) / uAtlasGrid, 0.).r; }

void main() {
  vec2 px = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec2 cf = px / uCell, f = fract(cf);
  ivec2 ci = ivec2(cf.x, uGrid.y - 1. - floor(cf.y));
  vec2 uv = vec2(cf.x, uGrid.y - cf.y) / uGrid;

  // interface text, on its own grid. styles: 1 plain, 2 dim, 3 status bar, 4 highlighted block, 5 accent, 6 dim on the bar, 7 accent on the bar, 8 faint
  vec2 tf = px / uTextCell;
  ivec2 tx = ivec2(texelFetch(uText, ivec2(tf), 0).rg * 255. + .5);
  if (tx.y > 0) {
    vec3 fg = tx.y == 8 ? vec3(.2) : tx.y == 2 || tx.y == 6 ? uDim : tx.y == 4 ? vec3(0.) : tx.y == 5 || tx.y == 7 ? uAccent : vec3(.9);
    vec3 bg = tx.y == 4 ? uAccent : tx.y == 3 || tx.y >= 6 ? uBar : vec3(0.);
    o = vec4(mix(bg, fg, ink(uFont, tx.x, fract(tf))), 1.);
    return;
  }
  if (uRaw > .5) { o = vec4(textureLod(uScene, uv, 0.).rgb, 1.); return; }
  vec4 a = texelFetch(uC0, ci, 0);
  // the colour behind the characters is blended between cell centres, so it has no steps
  vec3 col = mix(textureLod(uC1, uv, 0.).rgb, a.rgb, ink(uAtlas, int(a.a * 255. + .5), f));
  // light spilling from what glows. It levels off, so it cannot push a cell to plain white and hide its character
  vec3 bl = textureLod(uGlow, uv, 1.).rgb * .45 + textureLod(uGlow, uv, 2.5).rgb * .35 + textureLod(uGlow, uv, 4.).rgb * .25;
  col += bl / (1. + 1.5 * bl);
  // half a step of noise breaks up the banding a smooth 8-bit gradient would show
  col += (fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(.06711056, .00583715)))) - .5) / 255.;
  o = vec4(col, 1.);
}`;

let scene, cells, final, sceneFbo, cellFbo;
function initGL() {
scene = program(QUAD, SCENE); cells = program(QUAD, CELLS); final = program(QUAD, FINAL);
[scene, cells, final].forEach(linked);
gl.disable(gl.DITHER);   // material and glyph ids are stored in colour channels
texture(0, gl.TEXTURE_CUBE_MAP, gl.LINEAR);                  // height
texture(1, gl.TEXTURE_CUBE_MAP, gl.LINEAR_MIPMAP_LINEAR);    // normal
texture(2, gl.TEXTURE_CUBE_MAP, gl.LINEAR_MIPMAP_LINEAR);    // albedo
texture(3, gl.TEXTURE_3D, gl.LINEAR, gl.REPEAT);             // noise
const sceneTex = [texture(4, gl.TEXTURE_2D, gl.LINEAR), texture(10, gl.TEXTURE_2D, gl.NEAREST)];
texture(5, gl.TEXTURE_2D, gl.NEAREST);                       // glyph shapes, and each material's characters
const cellTex = [texture(6, gl.TEXTURE_2D, gl.NEAREST), texture(7, gl.TEXTURE_2D, gl.LINEAR), texture(8, gl.TEXTURE_2D, gl.LINEAR_MIPMAP_LINEAR)];
texture(9, gl.TEXTURE_2D, gl.NEAREST);                       // glyph atlas
texture(11, gl.TEXTURE_CUBE_MAP, gl.NEAREST);                // material
texture(12, gl.TEXTURE_CUBE_MAP, gl.NEAREST_MIPMAP_NEAREST); // highest ground and steepest slope in blocks of the height map, in a pyramid
texture(13, gl.TEXTURE_2D, gl.NEAREST);                      // interface text
texture(14, gl.TEXTURE_2D, gl.NEAREST);                      // snowflakes, by cell
snow.tex = new Uint8Array(4);                                // so it is filled in again at the size of the grid
texture(15, gl.TEXTURE_2D, gl.NEAREST);                      // interface font
gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
{
  const n = new Uint8Array(32 * 32 * 32), r = mulberry(7);
  for (let i = 0; i < n.length; i++) n[i] = r() * 256;
  gl.activeTexture(gl.TEXTURE3);
  gl.texImage3D(gl.TEXTURE_3D, 0, gl.R8, 32, 32, 32, 0, gl.RED, gl.UNSIGNED_BYTE, n);
}
sceneFbo = gl.createFramebuffer(); cellFbo = gl.createFramebuffer();
gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFbo);
sceneTex.forEach((t, i) => gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, t, 0));
gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
gl.bindFramebuffer(gl.FRAMEBUFFER, cellFbo);
cellTex.forEach((t, i) => gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, t, 0));
gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1, gl.COLOR_ATTACHMENT2]);
gl.bindVertexArray(gl.createVertexArray());
}

function uploadPlanet() {
  const cube = (unit, faces, internal, format, type, mips, size = S) => {
    gl.activeTexture(gl.TEXTURE0 + unit);
    for (let f = 0; f < 6; f++) gl.texImage2D(gl.TEXTURE_CUBE_MAP_POSITIVE_X + f, 0, internal, size, size, 0, format, type, faces[f]);
    if (mips) gl.generateMipmap(gl.TEXTURE_CUBE_MAP);
  };
  cube(0, planet.height, gl.R16F, gl.RED, gl.FLOAT, false);
  cube(1, planet.normal, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, true);
  cube(2, planet.albedo, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, true);
  cube(11, planet.mat, gl.R8, gl.RED, gl.UNSIGNED_BYTE, false);
  gl.activeTexture(gl.TEXTURE12);
  planet.tops.forEach((faces, level) => {
    for (let f = 0; f < 6; f++) gl.texImage2D(gl.TEXTURE_CUBE_MAP_POSITIVE_X + f, level, gl.RG16F, SB >> level, SB >> level, 0, gl.RG, gl.FLOAT, faces[f]);
  });
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_MAX_LEVEL, LEVELS - 1);
}

// ---- characters

// GLYPHS is what the picture may be drawn with: every ramp, plus a few line shapes for edges.
// No letters or digits, so nothing in the view reads as words. FONT adds the rest of ASCII
// so the interface can write anything.
const EDGES = '_/\\|()\'",.^-~';
const GLYPHS = [...new Set(RAMPS.join('') + EDGES)].join('');
const FONT = GLYPHS + Array.from({ length: 95 }, (_, i) => String.fromCharCode(32 + i)).filter(c => !GLYPHS.includes(c)).join('');
const MONO = 'ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace';
const view = { size: 0, picked: false, cw: 6, ch: 10, cols: 0, rows: 0, ss: 2, raw: false, ink: 1 };
// interface text sits on its own, coarser grid so it stays readable however small the picture's characters are
const tgrid = { cw: 8, ch: 13, cols: 0, rows: 0 };
let text = new Uint8Array(0);   // glyph and style for every cell of the interface grid

// draws FONT into a 16 x 6 atlas of cw x ch cells
function drawFont(cw, ch) {
  const c = document.createElement('canvas');
  c.width = cw * 16; c.height = ch * 6;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.fillStyle = '#000';
  g.fillRect(0, 0, c.width, c.height);
  g.font = `600 100px ${MONO}`;
  let px = 100 * cw / g.measureText('M').width;
  g.font = `600 ${px}px ${MONO}`;
  // centre the whole glyph box, descenders included, and shrink the font if it does not fit
  const box = g.measureText('Hgq|_'), asc = box.actualBoundingBoxAscent, desc = box.actualBoundingBoxDescent;
  const fit = Math.min(1, (ch - 1) / (asc + desc));
  if (fit < 1) { px *= fit; g.font = `600 ${px}px ${MONO}`; }
  g.fillStyle = '#fff';
  g.textAlign = 'center';
  const base = Math.round((ch - (asc + desc) * fit) / 2 + asc * fit);
  for (let i = 0; i < FONT.length; i++) {
    const x = (i % 16) * cw, y = (i >> 4) * ch;
    g.save();
    g.beginPath(); g.rect(x, y, cw, ch); g.clip();
    g.fillText(FONT[i], x + cw / 2, y + base);
    g.restore();
  }
  return c;
}

// builds the picture's atlas and measures how much ink each glyph puts in the six regions of its cell
function buildAtlas() {
  const { cw, ch } = view, n = GLYPHS.length, c = drawFont(cw, ch);
  const img = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
  const shapes = new Float32Array(n * 6), mean = new Float32Array(n);
  let max = 0;
  for (let i = 0; i < n; i++) for (let k = 0; k < 6; k++) {
    const x0 = (i % 16) * cw + Math.round((k & 1) * cw / 2), x1 = (i % 16) * cw + Math.round(((k & 1) + 1) * cw / 2);
    const y0 = (i >> 4) * ch + Math.round((k >> 1) * ch / 3), y1 = (i >> 4) * ch + Math.round(((k >> 1) + 1) * ch / 3);
    let s = 0;
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) s += img[(y * c.width + x) * 4];
    shapes[i * 6 + k] = s /= 255 * (x1 - x0) * (y1 - y0);
    if (s > max) max = s;
  }
  // One small table for the cell pass. Rows 0 and 1: each glyph's ink in the top and bottom three regions.
  // Row 2 + m, for material m: in red, the character to use at each of 16 brightness levels; in green,
  // whether the material may use glyph x at all (its own set, plus the line shapes for edges).
  const tw = Math.max(n, 16), data = new Uint8Array(tw * (2 + RAMPS.length) * 4);
  for (let i = 0; i < n; i++) for (let k = 0; k < 6; k++) {
    const v = shapes[i * 6 + k] / max;
    data[((k < 3 ? 0 : tw) + i) * 4 + k % 3] = v * 255;
    mean[i] += v / 6;
  }
  view.ink = Math.max(...mean);   // the densest glyph is the top of the brightness scale
  RAMPS.forEach((chars, m) => {
    const row = (2 + m) * tw * 4;
    for (let level = 0; level < 16; level++) {
      const want = level / 15 * view.ink;
      let best = 0;
      for (const ch of chars) {
        const i = GLYPHS.indexOf(ch);
        if (Math.abs(mean[i] - want) < Math.abs(mean[best] - want)) best = i;
      }
      data[row + level * 4] = best;
    }
    for (let i = 0; i < n; i++) data[row + i * 4 + 1] = chars.includes(GLYPHS[i]) || EDGES.includes(GLYPHS[i]) ? 255 : 0;
  });
  gl.activeTexture(gl.TEXTURE5);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, tw, 2 + RAMPS.length, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
  gl.activeTexture(gl.TEXTURE9);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, c);
  gl.activeTexture(gl.TEXTURE15);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, drawFont(tgrid.cw, tgrid.ch));
}

// The canvas buffer matches the screen's pixels exactly, so the browser never resamples the glyphs.
// Phones with fractional pixel ratios (2.625, 2.75) need the observer's exact device-pixel size for that.
const screenPx = { w: 0, h: 0 };
function resize() {
  if (!scene) return;   // the shaders are not built yet
  // the observer's size is used only to settle the rounding; anything further off is not trusted
  const dpr = devicePixelRatio || 1, dw = innerWidth * dpr, dh = innerHeight * dpr;
  canvas.width = Math.abs(screenPx.w - dw) <= dpr + 1 ? screenPx.w : Math.round(dw);
  canvas.height = Math.abs(screenPx.h - dh) <= dpr + 1 ? screenPx.h : Math.round(dh);
  const W = gl.drawingBufferWidth, H = gl.drawingBufferHeight;   // what the browser really allocated: smaller than asked on a few devices
  view.size = view.size || (dpr > 1.5 ? 5 : 6);
  view.cw = Math.round(view.size * dpr);
  view.ch = Math.round(view.cw * 1.6);
  view.cols = Math.ceil(W / view.cw);
  view.rows = Math.ceil(H / view.ch);
  tgrid.cw = Math.round(8 * dpr);
  tgrid.ch = Math.round(tgrid.cw * 1.6);
  tgrid.cols = Math.ceil(W / tgrid.cw);
  tgrid.rows = Math.ceil(H / tgrid.ch);
  text = new Uint8Array(tgrid.cols * tgrid.rows * 2);
  const alloc = (unit, w, h) => {
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  };
  for (const unit of [4, 10]) alloc(unit, view.cols * 2 * view.ss, view.rows * 3 * view.ss);
  for (const unit of [6, 7, 8]) alloc(unit, view.cols, view.rows);
  gl.generateMipmap(gl.TEXTURE_2D);
  buildAtlas();
  padRows();
}

// one world a day, the same for everyone: its seed is the date

  m.fwd = norm(sub(m.fwd, mul(m.dir, dot(m.fwd, m.dir))));
  cam.pos = mul(m.dir, planet.R + m.h + EYE);
  cam.fwd = add(mul(m.fwd, Math.cos(m.pitch)), mul(m.dir, Math.sin(m.pitch)));
  // the ship's bank at the moment of landing, eased level over the next half second
  cam.up = norm(add(m.dir, m.lean));
  m.lean = mul(m.lean, Math.exp(-dt * 6));

  for (const b of planet.beacons) {
    if (b.got || len(sub(cam.pos, b.base)) > 5) continue;
    b.got = true;
    signals++;
    keep();
    sing(planet.beacons.indexOf(b));
    // each signal read puts one of the planet's other things on the chart
    const shows = planet.finds[signals - 1] && !planet.finds[signals - 1].got ? '. it marks a place on the chart' : '';
    say(signals < planet.beacons.length ? `signal ${signals} of ${planet.beacons.length}: ${facts()[signals - 1]}${shows}`
                                        : `survey of ${planet.name} complete. ${touched ? 'tap new' : 'n'} for another world`, 9);
  }
  for (const f of planet.finds) {
    if (f.got || len(sub(cam.pos, f.pos)) > f.near) continue;
    f.got = true;
    keep();
    found();
    say(f.says, 9);
  }
}

function facts() {
  const p = planet, flat = Math.round(p.flat * 100);
  return [
    `radius ${p.R} m, ${Math.round(2 * Math.PI * p.R)} m around`,
    `one day lasts ${Math.floor(Math.round(p.dayLen) / 60)} min ${Math.round(p.dayLen) % 60} s`,
    p.sea === 1 ? `${flat}% of the surface is water` : p.sea ? `${flat}% of the surface is molten` : 'no liquid on the surface',
    `highest ground ${Math.round(Math.max(p.peak, p.mark.top))} m above the datum`,
  ];
}

// why the ship cannot land where it is, or '' if it can
function landing() {
  const d = norm(ship.pos);
  return len(ship.pos) - planet.R - groundAt(d) > 40 ? 'too high to land: come below 40 m'
       : deep(d) ? 'no ground to stand on here' : '';
}

// f in the air: if this is a place to land, the ship starts down (fly() does the rest, 4 s at most)
function setDown() {
  const why = landing();
  if (why) return say(why);
  ship.setting = 4;
}

function land() {
  const why = landing(), d = norm(ship.pos);
  ship.setting = 0;
  if (why) return say(why);
  me.dir = d;
  me.h = len(ship.pos) - planet.R - EYE;
  me.vr = Math.min(0, dot(ship.vel, d));
  const flat = sub(ship.fwd, mul(d, dot(ship.fwd, d)));
  me.fwd = norm(len(flat) > .05 ? flat : cross(d, [.3, .9, .2]));
  me.pitch = Math.asin(clamp(dot(ship.fwd, d), -1, 1));
  me.lean = sub(norm(ship.up), d);
  // The ship sets down a few steps away: behind you if the ground there is clear and level, otherwise
  // beside you, ahead, or on one of the diagonals. The hull is a 1.5 m sphere, so it is raised until no
  // ground under its whole footprint pokes into it (it may sink 10 cm).
  const side = cross(me.fwd, d);
  // the firs round the place you are set down, however high the ship was when you got out
  const feet = mul(d, planet.R + groundAt(d)), woods = planet.trees.filter(t => len(sub(t.pos, feet)) < 20);
  let best = null;
  const back = mul(me.fwd, -1), left = mul(side, -1);
  for (const way of [back, side, left, me.fwd, norm(add(back, side)), norm(add(back, left)), norm(add(me.fwd, side)), norm(add(me.fwd, left))]) {
    const spot = norm(add(mul(d, planet.R), mul(way, 6))), e = norm(cross(spot, way)), g = cross(spot, e);
    let centre = groundAt(spot) + 1.4, lo = 1e9, hi = -1e9;
    for (const rr of [.5, .9, 1.2, 1.4, 1.5]) for (let a = 0; a < 16; a++) {
      const v = add(mul(e, Math.cos(a * Math.PI / 8)), mul(g, Math.sin(a * Math.PI / 8)));
      const h = groundAt(norm(add(mul(spot, planet.R), mul(v, rr))));
      centre = Math.max(centre, h + Math.sqrt(2.25 - rr * rr) - .1);
      lo = Math.min(lo, h); hi = Math.max(hi, h);
    }
    // On a tree, crystal or spire is worst. Under a tree's boughs, which reach further out than its cone
    // in the height map, is next, the worse the further under; then uneven ground. On a tie the lower spot wins.
    const clear = Math.min(1.9, ...woods.map(t => aside(spot, t.pos) - t.r * 1.2));
    // nor on one of the things to find: the hull and legs reach 1.75 m from the ship's middle
    const onThing = planet.finds.some(f => len(sub(f.pos, feet)) < 40 && (f.what === 'stones'
      ? Array.from({ length: f.n }, (_, i) => i).some(i => i !== f.skip && aside(spot, stoneAt(f, i)) < 2.6)
      : aside(spot, f.pos) < (f.what === 'wreck' ? 4.2 : 2.9)));
    const score = ([TREE, CRYSTAL, SPIRE].includes(matAt(spot)) ? 4 : clear < 1.9 ? 2.9 - clear / 2.2 : 0) + (hi - lo > 1 ? 1 : 0) + (onThing ? 3 : 0);
    if (!best || score < best.score || (score === best.score && centre < best.centre)) best = { score, centre, spot };
    if (score === 0) break;
  }
  ship.pos = mul(best.spot, planet.R + best.centre);
  ship.face = me.fwd.slice();
  ship.parked = true;
  mode = 'walk';
}

function board() {
  if (len(sub(cam.pos, ship.pos)) > 15) say('ship recalled', 2, true);
  ship.pos = mul(me.dir, planet.R + me.h + EYE + .2);
  ship.fwd = norm(cam.fwd); ship.up = me.dir; ship.vel = mul(me.dir, 8);
  ship.parked = false;
  ship.borne = false;   // nothing holds it up yet: that was the flight before
  ship.setting = 0;
  mode = 'fly';
}

// ---- input

function press(k) {
  if (k === '?' || k === '/') { ui.help = !ui.help; ui.helped = true; ui.chart = ui.journal = false; }
  if (k === 'tab' && (mode === 'fly' || mode === 'walk')) { ui.chart = !ui.chart; ui.help = ui.journal = false; }
  if (k === 'j' && mode !== 'loading') { ui.journal = !ui.journal; ui.help = ui.chart = false; }
  if (k === 'escape') ui.help = ui.chart = ui.journal = false;
  // with the journal open, a number goes back to that world
  const back = ui.journal && mode !== 'loading' && /^[1-9]$/.test(k) && journal()[k - 1];
  if (back) return newPlanet(back.seed);
  if (mode === 'title' && (k === 'enter' || k === ' ')) return start();
  if ((k === 'n' || k === 't') && mode !== 'loading') {
    if (k === 't' && planet.seed === today()) return say("this is today's world", 3, true);
    // in the middle of a survey, n and t ask first
    const midway = (mode === 'fly' || mode === 'walk') && signals > 0 && signals < planet.beacons.length;
    if (midway && !(time < ui.leave)) {
      ui.leave = time + 3;
      return say(`${touched ? `tap ${k === 't' ? 'today' : 'new'}` : `press ${k}`} again to leave ${planet.name}`, 3);
    }
    return newPlanet(k === 't' ? today() : randomSeed());
  }
  if (k === 'i') ui.stats = !ui.stats;
  if (k === 'v') view.raw = !view.raw;
  if (k === 'm') mute();
  if (booted && !lost && (k === '-' || k === '_' || k === '=' || k === '+')) {   // not while there is no picture to size
    view.size = clamp(view.size + (k === '-' || k === '_' ? 1 : -1), 3, 16);
    view.picked = true;   // a size the player chose is never changed behind their back
    stats.drops = stats.drops.filter(step => step !== 'size');
    resize();
    say(`${view.cols} x ${view.rows} characters`, 2, true);
  }
  if (mode !== 'fly' && mode !== 'walk') return;
  if (k === 'f') mode === 'fly' ? setDown() : board();
  if (k === 'p') saveText();
}
// Held movement goes by where the key is, so W A S D work on any layout. Commands (F to land, M, N...)
// go by the letter typed, falling back to the key's position on non-Latin layouts.
const CODES = { KeyW: 'w', KeyA: 'a', KeyS: 's', KeyD: 'd', KeyQ: 'q', KeyE: 'e', KeyC: 'c', Space: ' ', ShiftLeft: 'shift', ShiftRight: 'shift' };
const keyOf = e => CODES[e.code] || e.key.toLowerCase();
const typedOf = e => /^[ -~]$/.test(e.key) ? e.key.toLowerCase() : e.code.startsWith('Key') ? e.code.slice(3).toLowerCase() : e.key.toLowerCase();
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;   // leave browser shortcuts alone
  if (!e.repeat) press(typedOf(e));
  const k = keyOf(e);
  keys.add(k);
  if (k === ' ' || k === 'tab' || k.startsWith('arrow')) e.preventDefault();
});
addEventListener('keyup', e => keys.delete(keyOf(e)));
addEventListener('blur', () => {
  keys.clear();
  if (ac) for (const g of [hum, wind]) g.gain.setTargetAtTime(0, ac.currentTime, .3);
});
// Size changes are applied at the start of the next frame, which then draws at the new size;
// resizing straight from these events would clear a frame already drawn and flash black.
// The window event covers browser zoom (the canvas keeps its device size, so the observer misses
// it); the observer adds the exact device-pixel size where the browser reports one.
let pendingResize = false;
addEventListener('resize', () => { pendingResize = true; });
if (window.ResizeObserver) {
  try {
    new ResizeObserver(([e]) => {
      const box = e.devicePixelContentBoxSize && e.devicePixelContentBoxSize[0];
      screenPx.w = box ? box.inlineSize : 0;
      screenPx.h = box ? box.blockSize : 0;
      pendingResize = true;
    }).observe(canvas, { box: 'device-pixel-content-box' });
  } catch (e) { /* no device-pixel box in this browser; the window event is enough */ }
}

function grabMouse() {
  const p = canvas.requestPointerLock && canvas.requestPointerLock();
  if (p) p.catch(() => {});
}
canvas.addEventListener('click', () => {
  if (mode === 'title') start();
  else if (mode !== 'loading') grabMouse();
});
addEventListener('mousemove', e => {
  if (document.pointerLockElement !== canvas) return;
  look.x += e.movementX; look.y += e.movementY;
});

// touch: left half of the screen is a stick, right half looks around
const pad = document.getElementById('pad'), pad2 = document.getElementById('pad2'), fingers = new Map();
let touched = matchMedia('(pointer: coarse)').matches;
function showPads() {
  pad.style.display = pad2.style.display = 'flex';
  padRows();
}
// messages end above the touch buttons
function padRows() {
  const row = y => y * gl.drawingBufferWidth / innerWidth / tgrid.ch;
  ui.padRow = pad.style.display === 'flex' ? Math.floor(row(pad.getBoundingClientRect().top)) : 1e9;
  // and the journal starts below the ones at the top
  ui.padTop = pad2.style.display === 'flex' ? Math.ceil(row(pad2.getBoundingClientRect().bottom)) : 2;
}
if (touched) showPads();
canvas.addEventListener('touchstart', e => {
  if (!touched) { touched = true; showPads(); }
  for (const t of e.changedTouches) fingers.set(t.identifier, { x: t.clientX, y: t.clientY, ox: t.clientX, oy: t.clientY, move: t.clientX < innerWidth / 2 });
  if (mode === 'title') start();
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) {
    const f = fingers.get(t.identifier);
    if (!f) continue;
    if (f.move) {
      stick.x = clamp((t.clientX - f.ox) / 60, -1, 1);
      stick.y = clamp((t.clientY - f.oy) / 60, -1, 1);
    } else {
      look.x += (t.clientX - f.x) * 2; look.y += (t.clientY - f.y) * 2;
    }
    f.x = t.clientX; f.y = t.clientY;
  }
  e.preventDefault();
}, { passive: false });
const lift = e => {
  for (const t of e.changedTouches) {
    if (fingers.get(t.identifier)?.move) stick.x = stick.y = 0;
    fingers.delete(t.identifier);
  }
};
canvas.addEventListener('touchend', lift);
canvas.addEventListener('touchcancel', lift);
for (const b of [...pad.children, ...pad2.children]) {
  const k = b.dataset.k;
  b.addEventListener('touchstart', e => { press(k); keys.add(k); e.preventDefault(); }, { passive: false });
  b.addEventListener('touchend', () => keys.delete(k));
  b.addEventListener('touchcancel', () => keys.delete(k));
}

// ---- sound

let ac, master, wind, windBand, hum, hiss, muted = false;
const due = [0, 0, 0, 0, 0];   // when each signal calls next

function startAudio() {
  if (ac) return;
  ac = new AudioContext();
  master = ac.createGain();
  master.gain.value = 0;
  master.gain.setTargetAtTime(muted ? 0 : .6, ac.currentTime, 1.5);
  master.connect(ac.destination);

  hiss = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
  const data = hiss.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource();
  src.buffer = hiss; src.loop = true;
  windBand = ac.createBiquadFilter();
  windBand.type = 'bandpass'; windBand.Q.value = .7;
  wind = ac.createGain();
  wind.gain.value = 0;
  src.connect(windBand).connect(wind).connect(master);
  src.start();

  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 150;
  hum = ac.createGain();
  hum.gain.value = 0;
  for (const f of [48, 48.5, 96.4]) {
    const o = ac.createOscillator();
    o.type = 'sawtooth'; o.frequency.value = f;
    o.connect(lp); o.start();
  }
  lp.connect(hum).connect(master);
  drone();
}

document.addEventListener('visibilitychange', () => {
  if (ac) document.hidden ? ac.suspend() : ac.resume();
});

// A slow chord that keeps re-voicing itself in the planet's key, with a note of its own for each signal
// read: the five together are the pentatonic scale of the key, so the chord fills out as the survey goes
// on and the fifth signal completes it.
function drone() {
  setTimeout(drone, 9000);
  if (document.hidden) return;
  const t = ac.currentTime, root = 55 * 2 ** (planet.key / 12);
  const upper = [12, 14, 15, 19, 22, 24, 26, 27, 31];
  for (const semi of [0, 7, upper[Math.floor(Math.random() * 4)], upper[4 + Math.floor(Math.random() * 5)]]) hold(root * 2 ** (semi / 12), t, .045);
  planet.beacons.forEach((b, i) => { if (b.got) hold(note(i) / 2, t, .02); });
}
// one held note of the drone from t: in over 5 s, out by 16 s, the next one in before it has gone
function hold(f, t, vol) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.value = f * (1 + (Math.random() - .5) * .004);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 5);
  g.gain.linearRampToValueAtTime(0, t + 16);
  o.connect(g).connect(master);
  o.start(t); o.stop(t + 16.5);
}
// the note of signal i, the one it calls with
const note = i => 220 * 2 ** ((planet.key + [10, 12, 15, 17, 19][i]) / 12);

// A signal read rings out its own note, with the octave over it and under it, and from then on that note
// is held in the drone, an octave down
function sing(i) {
  if (!ac) return;
  const f = note(i);
  for (const [k, part, secs] of [[1, 1, 4], [2, .25, 1.2], [.5, .45, 6]]) {
    const o = ac.createOscillator();
    o.frequency.value = f * k;
    o.connect(swell(.1 * part * Math.sqrt(440 / f), .01, secs)).connect(master);
    o.start(); o.stop(ac.currentTime + secs);
  }
  hold(f / 2, ac.currentTime + 1, .02);
}
// anything else found: one low struck note, the fifth of the key
function found() {
  if (!ac) return;
  const f = 110 * 2 ** ((planet.key + 7) / 12);
  for (const [k, part, secs] of [[1, 1, 3], [2, .3, 1]]) {
    const o = ac.createOscillator();
    o.frequency.value = f * k;
    o.connect(swell(.09 * part, .01, secs)).connect(master);
    o.start(); o.stop(ac.currentTime + secs);
  }
}

// the loudness of one struck sound: from nothing up to vol in `rise` seconds, then dying away, gone by `secs`
function swell(vol, rise, secs) {
  const t = ac.currentTime, g = ac.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + rise);
  g.gain.setTargetAtTime(0, t + rise, (secs - rise) / 7);
  return g;
}

// The call of signal i: one soft bell note, placed left or right. Each signal has its own note of the
// planet's key, between a seventh and a twelfth above 220 Hz in it: higher than anything the drone
// plays, and no two of the five a semitone apart, so signals heard together are in tune. A higher note
// is played more quietly, which makes all five as loud to the ear. Over the note sits its octave, gone
// in a third of the time; `lit` is how much of it there is.
function ping(i, vol, pan, lit) {
  const f = note(i), p = ac.createStereoPanner();
  p.pan.value = pan;
  p.connect(master);
  for (const [k, part, secs] of [[1, 1, 1.6], [2, lit * .3, .5]]) {
    const o = ac.createOscillator();
    o.frequency.value = f * k;
    o.connect(swell(vol * part * .075 * Math.sqrt(440 / f), .01, secs)).connect(p);
    o.start(); o.stop(ac.currentTime + secs);
  }
}

// one puff of the wind's noise, played at a fifth of its speed so there is nothing sharp in it, through a band
function puff(hz, q, vol, rise, secs) {
  const s = ac.createBufferSource(), f = ac.createBiquadFilter();
  s.buffer = hiss; s.playbackRate.value = .2;
  f.type = 'bandpass'; f.frequency.value = hz; f.Q.value = q;
  s.connect(f).connect(swell(vol, rise, secs)).connect(master);
  s.start(0, Math.random() * 1.9); s.stop(ac.currentTime + secs);
}

// A footstep on each kind of ground: the middle of its band in Hz, how narrow the band is, how loud,
// seconds to its loudest and seconds it lasts. Loose ground hisses, packed ground thuds, hard ground
// ticks, and what gives under you comes on slowly.
const STEPS = {
  [SAND]: [1800, .6, .05, .02, .16],
  [GRASS]: [650, .7, .09, .01, .11],
  [DRY]: [420, 1, .18, .004, .07],
  [ROCK]: [1100, 1.4, .11, .002, .05],
  [SNOW]: [1300, 1.4, .055, .03, .26],
  [ICE]: [1900, 1.6, .09, .002, .04],
  [LAVA]: [260, 1.5, .2, .012, .16],
  [WATER]: [400, .9, .07, .06, .38],
};

// Footsteps. walk() calls this for every frame that ends on the ground, with the metres walked in it and
// the speed you came down at. A step sounds each time a stride has gone by, and a stride is longer the
// faster you go: two steps a second walking, three running, one every two seconds edging along a rock.
// Coming down at more than 1.5 m/s is a landing: a heavier step with a low thud under it, the harder
// the faster you fell.
let strode = 0, foot = 1;
function tread(walked, dt, fell) {
  const speed = walked / dt || 0, hard = smooth(1.5, 9, fell);
  // from a standstill the first step is half a stride away
  strode = walked ? strode + walked / (1.5 + .2 * speed) : .5;
  if (strode < 1 && !hard) return;
  // no stride is quite as long as the last, no two steps sound the same, and the left foot is not the right
  strode = Math.random() * .06; foot = -foot;
  // a sound context that is held up would keep every step and let them all go at once
  if (!ac || ac.state !== 'running' || !document.hasFocus()) return;
  const any = () => 1 + (Math.random() - .5) * .3, weight = .8 + speed / 25;
  // the sound of the ground needs air to reach you
  if (planet.atmo) {
    const under = planet.sea && heightAt(me.dir) < 0 ? (planet.sea > 1 ? LAVA : WATER) : matAt(me.dir);
    const [hz, q, vol, rise, secs] = STEPS[under] || STEPS[ROCK];
    puff(hz * (1 + foot * .04) * any(), q, vol * (weight + hard * .7) * any(), rise, secs * any());
  }
  // the thud comes up through your boots: under a landing, and with no air it is all there is of a step
  const thud = (planet.atmo ? hard : hard + weight * .35) * .3;
  if (thud) puff(170 * (1 + foot * .04), .7, thud * any(), .004, .15);
}

function mute() {
  muted = !muted;
  if (ac) master.gain.setTargetAtTime(muted ? 0 : .6, ac.currentTime, .2);
  say(muted ? 'sound off' : 'sound on', 2, true);
}

function soundTick() {
  if (!ac) return;
  const alt = len(cam.pos) - planet.R - groundAt(norm(cam.pos)), speed = mode === 'fly' ? len(ship.vel) : 0;
  const quiet = document.hasFocus() ? 1 : 0;   // nothing roars in the background while you are in another app
  const air = planet.atmo ? Math.exp(-Math.max(alt, 0) / (planet.atmo * .3)) * quiet : 0, t = ac.currentTime;
  wind.gain.setTargetAtTime(air * (.03 + Math.min(speed / 150, 1) * .3), t, .3);
  windBand.frequency.setTargetAtTime(350 + speed * 9, t, .3);
  hum.gain.setTargetAtTime(mode === 'fly' ? (.1 + Math.min(speed / 200, 1) * .25) * quiet : 0, t, .4);
  // Signals not yet found call out, from 400 m: the nearer, the louder and the sooner again. A call is
  // placed by where its signal lies, and one behind you is fainter and duller than one ahead, so you can
  // turn to face it by ear. The ship's hull takes half of it.
  for (let i = 0; i < planet.beacons.length; i++) {
    const b = planet.beacons[i];
    if (b.got || t < due[i]) continue;
    const near = 1 - len(sub(cam.pos, b.base)) / 400;
    due[i] = t + (near > 0 ? 3.8 - near * 1.6 : 1);
    if (near <= 0 || !quiet) continue;
    const a = bearing(b.base), ahead = .5 + .5 * Math.cos(a);
    ping(i, near ** 1.5 * lerp(.6, 1, ahead) * (mode === 'fly' ? .5 : 1), Math.sin(a) * .8, near * ahead);
  }
}

// ---- screen

const stats = { frames: 0, t: 0, fps: 0, slow: 0, good: 0, tick: 1, drops: [], undone: 0, check: 0, before: 0, capped: false, undoneAt: -1e9 };

function drawScene() {
  const { cols, rows, cw, ch, ss } = view, p = planet;
  cam.right = norm(cross(cam.fwd, cam.up));
  const up = cross(cam.right, cam.fwd), alt = len(cam.pos) - p.R, hs = p.atmo * .25 || 1;
  // keep at least ~48 degrees across, so a portrait phone is not a slit
  const aspect = (cols * cw) / (rows * ch);
  cam.fy = Math.max(.6, .45 / aspect);
  cam.fx = cam.fy * aspect;

  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFbo);
  gl.viewport(0, 0, cols * 2 * ss, rows * 3 * ss);
  gl.invalidateFramebuffer(gl.FRAMEBUFFER, [gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);   // every pixel is about to be written
  gl.useProgram(scene.p);
  let u = scene.u;
  gl.uniform1i(u.uHeight, 0); gl.uniform1i(u.uNormal, 1); gl.uniform1i(u.uAlbedo, 2); gl.uniform1i(u.uNoise, 3); gl.uniform1i(u.uMat, 11); gl.uniform1i(u.uTops, 12);
  gl.uniform3fv(u.uPos, cam.pos); gl.uniform3fv(u.uFwd, cam.fwd); gl.uniform3fv(u.uRight, cam.right); gl.uniform3fv(u.uUp, up);
  gl.uniform2f(u.uFov, cam.fx, cam.fy);
  gl.uniform3fv(u.uSun, sunDir());
  gl.uniform3fv(u.uSunCol, p.sunCol);
  gl.uniform1f(u.uTime, time);
  gl.uniform1f(u.uR, p.R);
  gl.uniform1f(u.uTop, p.top);
  gl.uniform1f(u.uPix, 2 * cam.fy / (rows * 3));
  gl.uniform1f(u.uTexel, Math.PI / 2 * p.R / S);
  // The narrowest a block of the finest high-ground map gets. At a corner of the cube a block is a rhombus
  // with sides .47 of its width at a face centre and a 60 degree angle, so .41 across; .4 to be sure.
  gl.uniform1f(u.uBlock, TB * 2 * p.R / S * .4);
  gl.uniform1f(u.uAtmo, p.atmo);
  // how strongly glowing ground glows: crystals and trees gently, so their shape shows under the glow; lava hot
  gl.uniform1f(u.uEmit, p.K.veins ? 6 : 3.2);
  gl.uniform3fv(u.uBeta, p.K.tau.map(t => t / hs));
  // the sky is brighter to an eye standing in it than it is from orbit
  gl.uniform1f(u.uAdapt, lerp(2.6, 1, smooth(0, p.atmo * 1.2, alt)));
  gl.uniform4f(u.uSea, ...linear(hex(p.K.deepCol)), p.sea);
  gl.uniform3fv(u.uShallow, linear(hex(p.K.shallow)));
  gl.uniform4f(u.uCloud, p.cover, p.cloudAlt, p.cloudF, p.cover < 1 ? 1 : 0);
  gl.uniform3fv(u.uCloudCol, linear(hex(p.K.cloudCol)));
  const ring = p.ring;
  gl.uniform4f(u.uRing, ring ? ring.inner : 0, ring ? ring.outer : 0, ring ? ring.alpha : 0, ring ? ring.seed : 0);
  gl.uniform3fv(u.uRingN, ring ? ring.n : [0, 1, 0]);
  gl.uniform3fv(u.uRingCol, ring ? ring.col : [0, 0, 0]);
  gl.uniform4f(u.uMoon, ...(p.moon ? moonPos() : [0, 0, 0]), p.moon ? p.moon.r : 0);
  // an eclipse is worked out only while the moon is near enough the sun to hide some of it from somewhere
  const eclipse = p.moon && Math.acos(clamp(dot(norm(moonPos()), sunDir()), -1, 1)) < .25;
  gl.uniform1f(u.uEclipse, eclipse ? 1 : 0);
  gl.uniform1f(u.uSkyLit, eclipse ? sunShows(cam.pos) : 1);
  // the aurora, while some of the sky in view can be dark
  const au = p.aurora, dim = au && (alt > p.atmo * .5 || dot(norm(cam.pos), sunDir()) < .35);
  gl.uniform4f(u.uAurora, ...(au ? au.axis : [0, 1, 0]), dim ? auroraNow() : 0);
  gl.uniform4f(u.uAuroraB, au ? au.theta : 0, au ? au.foot : 0, au ? au.top : 0, au ? auroraClock() : 0);
  gl.uniform3fv(u.uAuroraLow, au ? au.low : [0, 0, 0]);
  gl.uniform3fv(u.uAuroraHigh, au ? au.high : [0, 0, 0]);
  // the meteors now, and a fireball's light
  const mA = new Float32Array(8), mB = new Float32Array(8), mC = new Float32Array(8);
  let flash = [0, 1, 0, 0];
  meteorsNow().slice(0, 2).forEach((m, i) => {
    mA.set([...m.A, m.u], i * 4); mB.set([...m.d, m.L], i * 4); mC.set([...m.col, m.tail], i * 4);
    if (m.fire) flash = [...norm(add(m.A, mul(m.d, m.L * m.u))), .035 * len(m.col) * m.life];
  });
  gl.uniform4fv(u.uMet, mA); gl.uniform4fv(u.uMetB, mB); gl.uniform4fv(u.uMetC, mC);
  gl.uniform4fv(u.uFlash, flash);
  // the mist, unless it is broad day all round
  const mist = p.mist && (alt > p.atmo * .5 || dot(norm(cam.pos), sunDir()) < .7);
  gl.uniform2f(u.uMist, mist ? p.mist.thick : 0, mist ? p.mist.deep : 1);
  // ice optics on the frozen worlds, seen from in the air
  gl.uniform1f(u.uHalo, p.K.label === 'frozen' && alt < p.atmo ? 1 : 0);
  gl.uniform4f(u.uShip, ...ship.pos, ship.parked ? 1 : 0);
  gl.uniform3fv(u.uShipFwd, ship.face || [0, 0, 1]);
  // the things to find, when near enough to make out
  const finds = new Float32Array(12), findsB = new Float32Array(12);
  p.finds.forEach((f, i) => {
    if (len(sub(f.pos, cam.pos)) > 700) return;
    finds.set([...f.pos, f.what === 'stones' ? 1 : f.what === 'wreck' ? 2 : 3], i * 4);
    findsB.set([...f.face, f.what === 'stones' ? f.n * 16 + f.skip : 0], i * 4);
  });
  gl.uniform4fv(u.uFind, finds);
  gl.uniform4fv(u.uFindB, findsB);
  gl.uniform3fv(u.uRock, linear(hex(p.K.rock)));
  // The twelve nearest trees within 40 m are drawn as real shapes. Their detail has faded out by 38 m,
  // or by the distance of the thirteenth tree where the forest is thick, so dropping out of the twelve
  // changes nothing you can see.
  const close = [];
  for (const t of p.trees) {
    const dx = t.pos[0] - cam.pos[0], dy = t.pos[1] - cam.pos[1], dz = t.pos[2] - cam.pos[2], d2 = dx * dx + dy * dy + dz * dz;
    if (d2 < 1600) close.push([d2, t]);
  }
  close.sort((a, b) => a[0] - b[0]);
  const trees = new Float32Array(48), treeB = new Float32Array(48), nt = Math.min(12, close.length);
  firs = close.slice(0, nt).map(c => c[1]);
  for (let i = 0; i < nt; i++) {
    const t = close[i][1];
    trees.set([...t.pos, t.h], i * 4);
    treeB.set([t.r, t.seed, 0, 0], i * 4);
  }
  gl.uniform4fv(u.uTree, trees);
  gl.uniform4fv(u.uTreeB, treeB);
  const reach = Math.min(38, close.length > 12 ? Math.sqrt(close[12][0]) - .5 : 38);
  gl.uniform2f(u.uTreeFade, reach * .66, reach);
  gl.uniform1i(u.uTreeN, nt);
  gl.uniform3fv(u.uTreeCol, p.treeCol);
  gl.uniform1f(u.uTreeGlow, p.treeGlow);
  gl.uniform3fv(u.uTreeGlowCol, p.treeGlowCol);
  gl.uniform1f(u.uTreeNight, p.treeNight);
  gl.uniform3fv(u.uBeaconCol, p.signal);
  const beams = new Float32Array(20);
  p.beacons.forEach((b, i) => beams.set([...b.base, b.got ? .25 : 1], i * 4));
  gl.uniform4fv(u.uBeacon, beams);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.bindFramebuffer(gl.FRAMEBUFFER, cellFbo);
  gl.viewport(0, 0, cols, rows);
  gl.invalidateFramebuffer(gl.FRAMEBUFFER, [gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1, gl.COLOR_ATTACHMENT2]);
  gl.useProgram(cells.p);
  u = cells.u;
  gl.uniform1i(u.uScene, 4); gl.uniform1i(u.uInfo, 10); gl.uniform1i(u.uTables, 5);
  gl.uniform2f(u.uGrid, cols, rows);
  gl.uniform1i(u.uCount, GLYPHS.length);
  gl.uniform1f(u.uInk, view.ink);
  gl.uniform1fv(u.uBack, BACKING);
  gl.uniform1fv(u.uGain, GAIN);
  gl.uniform1fv(u.uLift, LIFT);
  gl.uniform1i(u.uFlakes, 14);
  gl.uniform3i(u.uFlakeChars, GLYPHS.indexOf("'"), GLYPHS.indexOf('*'), GLYPHS.indexOf(','));
  snowCells();
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.activeTexture(gl.TEXTURE8);
  gl.generateMipmap(gl.TEXTURE_2D);
}

function drawScreen() {
  const { cols, rows, cw, ch } = view, u = final.u;
  gl.activeTexture(gl.TEXTURE13);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RG8, tgrid.cols, tgrid.rows, 0, gl.RG, gl.UNSIGNED_BYTE, text);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
  gl.useProgram(final.p);
  gl.uniform1i(u.uScene, 4); gl.uniform1i(u.uC0, 6); gl.uniform1i(u.uC1, 7); gl.uniform1i(u.uGlow, 8); gl.uniform1i(u.uAtlas, 9); gl.uniform1i(u.uText, 13); gl.uniform1i(u.uFont, 15);
  gl.uniform2f(u.uRes, gl.drawingBufferWidth, gl.drawingBufferHeight);
  gl.uniform2f(u.uTextCell, tgrid.cw, tgrid.ch);
  gl.uniform2f(u.uCell, cw, ch);
  gl.uniform2f(u.uGrid, cols, rows);
  gl.uniform2f(u.uAtlasGrid, 16, 6);
  gl.uniform1f(u.uRaw, view.raw ? 1 : 0);
  const ink = planet.ink || { accent: [.85, .85, .8], bar: [.085, .085, .085], dim: [.46, .46, .46] };
  gl.uniform3fv(u.uAccent, ink.accent); gl.uniform3fv(u.uBar, ink.bar); gl.uniform3fv(u.uDim, ink.dim);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// writes interface text into its grid
function put(x, y, str, style = 1) {
  if (y < 0 || y >= tgrid.rows) return;
  for (let i = 0; i < str.length; i++) {
    const cx = Math.round(x) + i, k = (y * tgrid.cols + cx) * 2;
    if (cx < 0 || cx >= tgrid.cols) continue;
    text[k] = Math.max(FONT.indexOf(str[i]), 0);
    text[k + 1] = style;
  }
}

const HELP = [
  ['mouse', 'steer, look'],
  ['w a s d', 'thrust and strafe, walk'],
  ['space c', 'up and down, jump'],
  ['q e', 'roll'],
  ['shift', 'boost, run'],
  ['f', 'land, or board the ship'],
  ['tab', 'chart of the planet'],
  ['n', 'next planet'],
  ['t', "today's world, the same for everyone"],
  ['j', 'journal of worlds with something found'],
  ['p', 'save the view as a text file'],
  ['v', 'show the render under the text'],
  ['- =', 'bigger or smaller characters'],
  ['m', 'sound'],
  ['i', 'frame rate'],
];

// Which way a point lies from the way you face: radians to the right of straight ahead. It is taken in the
// plane of the ground under you, so it is right from orbit too, where every signal on the planet is
// "ahead" of a camera that looks at the planet.
function bearing(at) {
  const out = norm(cam.pos), flat = v => sub(v, mul(out, dot(v, out)));
  // looking straight down, ahead is the top of the screen
  let f = flat(cam.fwd);
  if (len(f) < .3) f = mul(flat(cross(cam.right, cam.fwd)), dot(cam.fwd, out) < 0 ? 1 : -1);
  const to = flat(sub(at, cam.pos));
  return Math.atan2(dot(to, cross(f, out)), dot(to, f));
}

// how far the nearest signal still out there is, over the ground, and which way to turn
function nextSignal() {
  const out = norm(cam.pos);
  let near = null, best = 1e9;
  for (const b of planet.beacons) {
    const d = Math.acos(clamp(dot(b.dir, out), -1, 1)) * planet.R;
    if (!b.got && d < best) { best = d; near = b; }
  }
  if (!near) return '';
  const a = bearing(near.base) * 180 / Math.PI, alt = len(cam.pos) - planet.R - groundAt(out);
  const way = mode === 'fly' && best < alt * .5 ? 'below' : Math.abs(a) < 25 ? 'ahead' : Math.abs(a) > 140 ? 'behind' : a > 0 ? 'right' : 'left';
  return `next signal ${Math.round(best)}m ${way}`;
}

// splits a message into lines no wider than width, at spaces
function wrap(str, width) {
  const lines = [];
  let line = '';
  for (const word of str.split(' ')) {
    if (line && line.length + 1 + word.length > width) { lines.push(line); line = word; }
    else line = line ? `${line} ${word}` : word;
  }
  if (line) lines.push(line);
  return lines;
}

function drawText() {
  const p = planet, cols = Math.floor(gl.drawingBufferWidth / tgrid.cw), bar = Math.floor(gl.drawingBufferHeight / tgrid.ch) - 1;
  const playing = mode === 'fly' || mode === 'walk';
  text.fill(0);

  // one status line along the bottom, the way an editor does it
  put(0, bar, ' '.repeat(tgrid.cols), 3);
  put(0, bar + 1, ' '.repeat(tgrid.cols), 3);
  const tag = mode === 'fly' ? ' FLY ' : mode === 'walk' ? ' WALK ' : ' planet.txt ';
  put(0, bar, tag, 4);
  // next to it, the one key that does something here and now
  const hint = !playing ? '' : !touched && document.pointerLockElement !== canvas ? 'click to steer'
             : mode === 'fly' ? (ship.setting > 0 ? 'setting down' : landing() ? '' : 'f land') : len(sub(cam.pos, ship.pos)) < 15 ? 'f board' : 'f call ship';
  // [text, side, importance]: on a narrow screen the least important parts are left out
  let parts = [[ui.note, 0, 9]];
  if (mode !== 'loading') {
    const alt = len(cam.pos) - p.R - groundAt(norm(cam.pos)), speed = mode === 'fly' ? len(ship.vel) : 0;
    parts = [[p.name, 0, 5], [p.K.label, 0, 1]];
    if (!playing) {
      if (signals) parts.push([signals < p.beacons.length ? `${signals} of ${p.beacons.length} found` : 'surveyed', 0, 4]);
      parts.push(...(touched ? [['tap to descend', 1, 9]] : [['click to descend', 1, 9], ['n next planet', 1, 3], [p.seed === today() ? "today's world" : "t today's world", 1, 1], ['? keys', 1, 2]]));
    }
    else {
      if (mode === 'fly') parts.push([`alt ${Math.round(alt)}m`, 1, 4], [`${Math.round(speed)}m/s`, 1, 3]);
      const next = nextSignal();
      if (next) parts.push([next, 1, 8]);
      parts.push([`${signals} of ${p.beacons.length} found`, 1, 7]);
      if (!ui.helped) parts.push(['? keys', 1, 0]);
    }
    if (ui.stats) parts.push([`${stats.fps}fps ${view.cols}x${view.rows}`, 1, 6]);
  }
  const side = n => parts.filter(q => q[1] === n).map(q => q[0]).join('   ');
  const left = tag.length + 1 + (hint ? hint.length + 3 : 0);
  while (parts.length && left + side(0).length + side(1).length + 3 > cols) {
    parts.splice(parts.indexOf(parts.reduce((a, b) => (b[2] < a[2] ? b : a))), 1);
  }
  put(tag.length + 1, bar, hint, 7);
  put(left, bar, side(0), 3);
  put(cols - side(1).length - 1, bar, side(1), playing ? 3 : 6);

  const wide = Math.max(...HELP.map(h => h[1].length)) + 1;
  if (ui.help) HELP.forEach(([k, what], i) => {
    put(2, 2 + i, ` ${k.padEnd(9)}`, 1);
    put(12, 2 + i, ` ${what.padEnd(wide)}`, 2);
  });
  if (ui.chart && playing) drawChart(cols, bar);
  if (ui.journal && mode !== 'loading') {
    const list = journal(), done = list.filter(w => w.found === w.of).length;
    // a name is 15 characters at most; a screen under 50 characters wide has no room for the kind of world
    const top = ui.padTop, kind = w => (cols < 50 ? '' : `${w.kind.padEnd(10)} `);
    const rows = list.slice(0, 9).map((w, i) => [`${i + 1}`, `${w.name.padEnd(15)} ${kind(w)}${w.found === w.of ? 'surveyed' : `${w.found} of ${w.of}`}${w.finds ? `, ${count(w.finds, 'find')}` : ''}`]);
    if (!touched) rows.push(['t', "today's world"]);
    const foot = !list.length ? 'nothing found yet' : `${count(list.length, 'world')}, ${done} surveyed${touched ? '' : '. a number goes back to one'}`;
    const width = Math.max(foot.length - 3, ...rows.map(r => r[1].length)) + 1;
    put(2, top, ` ${'journal'.padEnd(width + 3)}`, 1);
    rows.forEach(([k, what], i) => {
      put(2, top + 1 + i, ` ${k} `, 1);
      put(5, top + 1 + i, ` ${what.padEnd(width)}`, 2);
    });
    put(2, top + 1 + rows.length, ` ${foot.padEnd(width + 3)}`, 2);
  }
  // The touch buttons: a block of the bar's colour with the label in it, drawn over the place each one is,
  // in the accent while it is held
  if (pad.style.display === 'flex') {
    const k = gl.drawingBufferWidth / innerWidth;
    for (const b of [...pad.children, ...pad2.children]) {
      const r = b.getBoundingClientRect(), x0 = Math.round(r.left * k / tgrid.cw), x1 = Math.round(r.right * k / tgrid.cw);
      const y0 = Math.round(r.top * k / tgrid.ch), y1 = Math.round(r.bottom * k / tgrid.ch), style = keys.has(b.dataset.k) ? 4 : 3;
      for (let y = y0; y < y1; y++) put(x0, y, ' '.repeat(x1 - x0), style);
      put(Math.floor((x0 + x1 - b.textContent.length) / 2), Math.floor((y0 + y1 - 1) / 2), b.textContent, style);
    }
  }
  // a message goes over the chart and the lists, on a line cleared of them
  if (time < ui.until) {
    const lines = wrap(ui.msg, cols - 4), low = Math.min(bar - 2, ui.padRow - 1);
    lines.forEach((l, i) => {
      const y = low - lines.length + 1 + i;
      for (let x = 0; x < tgrid.cols; x++) if (y >= 0 && text[(y * tgrid.cols + x) * 2 + 1]) text[(y * tgrid.cols + x) * 2] = 0;
      put((cols - l.length) / 2 - 1, y, ` ${l} `, ui.until - time < .6 ? 2 : 1);
    });
  }
}

// The chart: the whole planet on one disk, laid out round where you are. You are the middle, the way you
// face is up, and the rim is the one point on the far side. Directions from you are true. Distance out
// from the middle grows with distance over the ground, faster close to you than far off (as its power
// NEAR), so the ground you can walk to takes up a fair part of the disk and the far side is not stretched
// over most of it.
const NEAR = .6;
let chartPlan = null;   // for each character of the disk, where on the planet its four soundings fall
function drawChart(cols, bar) {
  const p = planet, ry = Math.min(13, Math.floor((bar - 5) / 2), Math.floor((cols - 2) / 2 * tgrid.cw / tgrid.ch) - 1), rx = ry * tgrid.ch / tgrid.cw;
  if (ry < 4) return;
  if (!chartPlan || chartPlan.ry !== ry || chartPlan.rx !== rx) {
    chartPlan = { ry, rx, cells: [] };
    for (let y = -ry; y <= ry; y++) for (let x = -Math.ceil(rx); x <= Math.ceil(rx); x++) {
      if (Math.hypot(x / (rx + .5), y / (ry + .5)) > 1) continue;
      // a sounding is a mix of three directions: straight down from you, to your right, and ahead
      const k = [];
      for (const [i, j] of [[-.25, -.25], [.25, -.25], [-.25, .25], [.25, .25]]) {
        const u = (x + i) / (rx + .5), v = (y + j) / (ry + .5), rho = Math.min(Math.hypot(u, v), 1), th = Math.PI * rho ** (1 / NEAR), s = rho ? Math.sin(th) / rho : 0;
        k.push(Math.cos(th), u * s, -v * s);
      }
      chartPlan.cells.push([x, y, k]);
    }
  }
  const c0 = Math.floor(cols / 2), r0 = Math.floor((bar - 2) / 2), d = norm(cam.pos), f = mode === 'walk' ? me.fwd : ship.fwd;
  // straight up or down has no heading: looking down, the top of the view is ahead; looking up, it is behind
  let ahead = sub(f, mul(d, dot(f, d)));
  if (len(ahead) < .05) ahead = mul(sub(cam.up, mul(d, dot(cam.up, d))), dot(f, d) < 0 ? 1 : -1);
  ahead = norm(ahead);
  const right = cross(ahead, d), q = [0, 0, 0];
  for (const [x, y, k] of chartPlan.cells) {
    // four soundings to a character, so the land does not flicker as you turn
    let h = 0;
    for (let i = 0; i < 12; i += 3) {
      for (let a = 0; a < 3; a++) q[a] = d[a] * k[i] + right[a] * k[i + 1] + ahead[a] * k[i + 2];
      h += heightAt(q) / 4;
    }
    // sea is left empty; land is lowland, hills or mountains, by how much of this planet's land lies below it
    put(c0 + x, r0 + y, p.sea && h < 0 ? ' ' : h < p.shelf[0] ? '.' : h < p.shelf[1] ? ':' : '^', 2);
  }
  const mark = (to, ch, style) => {
    const c = clamp(dot(d, to), -1, 1), t = sub(to, mul(d, c)), far = (Math.acos(c) / Math.PI) ** NEAR / (len(t) || 1);
    put(c0 + Math.round(dot(t, right) * far * (rx + .5)), r0 - Math.round(dot(t, ahead) * far * (ry + .5)), ch, style);
  };
  for (const b of p.beacons) mark(b.dir, b.got ? 'x' : '!', b.got ? 2 : 5);
  // the other things: found ones, and as many of the rest as signals have been read
  const shown = p.finds.filter((f, i) => f.got || i < signals);
  for (const f of shown) mark(f.dir, f.got ? '*' : '?', f.got ? 2 : 5);
  if (ship.parked) mark(norm(ship.pos), '&', 1);
  put(c0, r0, '@', 1);
  const key = ['@ you', ship.parked && '& ship', '! signal', signals && 'x read', shown.some(f => !f.got) && '? unknown', shown.some(f => f.got) && '* found'].filter(Boolean);
  // on one line if it fits, on more if not
  const lines = [];
  for (const k of key) {
    const n = lines.length - 1;
    if (n >= 0 && lines[n].length + 3 + k.length <= cols - 4) lines[n] += `   ${k}`; else lines.push(k);
  }
  lines.forEach((l, i) => put(c0 - l.length / 2 - 1, r0 + ry + 2 + i, ` ${l} `, 2));
}

function saveText() {
  const { cols, rows } = view, px = new Uint8Array(cols * rows * 4), lines = [];
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, cellFbo);
  gl.readBuffer(gl.COLOR_ATTACHMENT0);
  gl.readPixels(0, 0, cols, rows, gl.RGBA, gl.UNSIGNED_BYTE, px);
  for (let y = rows - 1; y >= 0; y--) {
    let s = '';
    for (let x = 0; x < cols; x++) s += GLYPHS[px[(y * cols + x) * 4 + 3]] || ' ';
    lines.push(s.trimEnd());
  }
  const out = lines.join('\n') + '\n', a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([out], { type: 'text/plain' }));
  a.download = planet.name.toLowerCase().replace(/\W+/g, '-') + '.txt';
  a.click();
  URL.revokeObjectURL(a.href);
  say(`wrote ${a.download}, ${cols} x ${rows} characters`, 4);
  if (navigator.clipboard) navigator.clipboard.writeText(out).then(() => say(`wrote ${a.download} and copied it`, 4), () => {});
}

// ---- boot

const randomSeed = () => NOUNS[Math.floor(Math.random() * NOUNS.length)] + '-' + Math.floor(Math.random() * 900 + 100);
const nextFrame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r)));

// One planet is built at a time: the generator works on the one planet object, in steps spread over
// several frames, so a second call while the first is under way is refused.
let charting = false;
async function newPlanet(seed) {
  if (charting) return;
  charting = true;
  try {
    mode = 'loading';
    ui.until = 0;
    ui.leave = -1;
    ui.chart = ui.journal = false;
    if (document.pointerLockElement) document.exitPointerLock();
    design(seed);
    ui.note = `charting ${planet.name}`;
    await nextFrame();
    await buildFaces(n => { ui.note = `charting ${planet.name}  ${n}/6`; });
    for (let f = 0; f < 6; f++) { planet.mat[f].fill(0); planet.albedo[f].fill(0); }
    measure();
    landmark();
    scatter();
    for (let f = 0; f < 6; f++) {
      ui.note = `colouring ${planet.name}  ${f + 1}/6`;
      await nextFrame();
      paintFace(f);
    }
    highGround();
    placeBeacons();
    placeFinds();
    uploadPlanet();
    // what was found here on an earlier visit, or since in another tab, stays found
    recall();
    const [sig = '', fnd = ''] = typeof kept[seed] === 'string' ? kept[seed].split('|')[0].split('.') : [];
    planet.beacons.forEach((b, i) => { b.got = sig[i] === '1'; });
    planet.finds.forEach((f, i) => { f.got = fnd[i] === '1'; });
    signals = planet.beacons.filter(b => b.got).length;
    ship.parked = false;
    ui.until = 0;
    try { history.replaceState(null, '', '?seed=' + encodeURIComponent(seed)); } catch (e) { /* some browsers refuse on file:// */ }
    mode = 'title';
  } finally { charting = false; }
}

function start() {
  // the click carries the orbit's own motion on, into a drift toward the planet
  ship.pos = cam.pos; ship.fwd = cam.fwd; ship.up = cam.up; ship.vel = add(mul(cross([0, 1, 0], cam.pos), .05), mul(cam.fwd, 50));
  ship.setting = 0;
  mode = 'fly';
  startAudio();
  if (!fingers.size) grabMouse();
  const left = planet.beacons.length - signals;
  const todo = !left ? `${planet.name} is surveyed. ${touched ? 'tap new' : 'n'} for another world`
    : `${count(left, 'signal')} ${signals ? 'still to find' : 'on the surface'}${touched ? ':' : '.'} fly down, f to land, walk to ${left === 1 ? 'it' : 'them'}`;
  say(touched && left ? `left side moves, right side looks. ${todo}` : todo, 9);
}

let last = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const real = (now - last) / 1000 || 0, dt = Math.min(.05, real);
  last = now;
  if (lost) { look.x = look.y = 0; return; }   // input from a frozen screen would land all at once later
  if (pendingResize) { pendingResize = false; resize(); }
  if (mode !== 'loading') {
    time += dt;
    if (mode === 'title') orbit();
    else if (mode === 'fly') fly(dt);
    else if (mode === 'walk') walk(dt);
    snowStep(dt);
    drawScene();
    soundTick();
  }
  look.x = look.y = 0;
  drawText();
  drawScreen();
  govern(real);
}

// Keeps the frame rate up. It compares against what the display can show (capped at 60), so a 30 Hz
// screen or a battery saver holding the page at 30 fps does not count as a slow machine.
function govern(real) {
  stats.frames++;
  stats.t += real;
  if (real > .004) stats.tick = Math.min(stats.tick, real);   // shortest frame seen: about the refresh interval
  if (stats.t < .5) return;
  stats.fps = Math.round(stats.frames / stats.t);
  stats.frames = 0; stats.t = 0;
  if (mode === 'loading') return;
  // Two seconds after a step, check that it helped. If it did not, the limit is not the GPU but a cap
  // (a battery saver, a 30 Hz display): take the step back and learn the new ceiling instead.
  if (stats.check && --stats.check === 0 && stats.fps < stats.before * 1.1) {
    undoStep(stats.drops.pop());
    stats.tick = 1 / Math.max(stats.fps, 1);
    stats.capped = true;   // the limit is the display, not the GPU: stop using the absolute floor
    return;
  }
  const target = Math.min(60, 1 / stats.tick);
  // under 27 fps the machine is slow whatever the display does, unless a step was already shown not to help
  stats.slow = stats.fps < Math.max(target * .75, stats.capped ? 0 : 27) ? stats.slow + 1 : 0;
  stats.good = stats.fps >= target * .95 ? stats.good + 1 : 0;
  // two slow seconds: drop the supersampling, then use bigger characters (unless the player picked a size)
  if (stats.slow >= 4) {
    stats.slow = 0;
    const step = view.ss > 1 ? 'ss' : view.size < 12 && !view.picked ? 'size' : null;
    if (!step) return;
    if (step === 'ss') view.ss = 1; else view.size += 2;
    stats.drops.push(step);
    stats.before = stats.fps; stats.check = 4;
    if (time - stats.undoneAt < 30) stats.undone = 2;   // the last step back did not last: stop trying
    resize();
    say('lowering detail to keep up', 3, true);
  }
  // ten smooth seconds: take the last step back, but only twice, so a borderline machine does not flip-flop
  if (stats.good >= 20 && stats.drops.length && stats.undone < 2) {
    stats.good = 0;
    undoStep(stats.drops.pop());
    stats.undone++;
    stats.undoneAt = time;
  }
}
function undoStep(step) {
  if (step === 'ss') view.ss = 2;
  else if (step === 'size' && !view.picked) view.size = clamp(view.size - 2, 3, 16);
  resize();
}

// A graphics reset (a driver update, a GPU crash, a phone reclaiming memory) loses everything on the GPU.
// The planet is still in memory, so it only needs uploading again.
let lost = false, lostTimer = 0;
const notice = document.getElementById('notice');
// if the browser does not hand the graphics back, say so instead of waiting forever
const stuck = () => {
  if (!lost) return;
  notice.textContent = 'graphics stopped. ';
  const a = notice.appendChild(document.createElement('a'));
  a.href = location.href; a.textContent = 'reload'; a.style.color = 'inherit';
};
canvas.addEventListener('webglcontextlost', e => {
  e.preventDefault();
  lost = true;
  if (ac) for (const g of [hum, wind]) g.gain.setTargetAtTime(0, ac.currentTime, .3);
  notice.textContent = 'graphics reset, restoring';
  notice.hidden = false;
  clearTimeout(lostTimer);
  lostTimer = setTimeout(stuck, 8000);
});
canvas.addEventListener('webglcontextcreationerror', stuck);
canvas.addEventListener('webglcontextrestored', () => {
  clearTimeout(lostTimer);
  try { boot(); lost = false; } catch (e) { failed(e); }
});

// Builds everything that lives on the GPU: at the start, and again whenever the graphics come back.
// The first time through it also charts the first planet and starts the frames.
let booted = false;
function boot() {
  initGL();
  if (planet.beacons) uploadPlanet();
  resize();
  notice.hidden = true;
  if (booted) return;
  booted = true;
  newPlanet(new URLSearchParams(location.search).get('seed') || randomSeed());
  requestAnimationFrame(frame);
}
// A build that fails with the graphics still there is the driver refusing the shaders: say so, with the
// line of its log that names the error (or its first line), since nothing else will ever appear. One
// that fails because the graphics went away is tried again when they come back.
function failed(e) {
  if (gl.isContextLost()) return;
  const lines = String(e.message).split('\n').map(l => l.trim()).filter(Boolean), why = lines.find(l => /error/i.test(l)) || lines[0];
  notice.textContent = 'this graphics driver could not build the picture' + (why ? ': ' + why.slice(0, 160) : '');
  notice.hidden = false;
  throw e;
}
// The shaders are built after one frame has reached the screen, so there is something to read while the
// compiler holds the page (it can take seconds on Windows the first time, where Direct3D compiles them).
// If the graphics are lost before or while they are built, the build is left to the restore above, and
// if they are already back by then, it has been done.
notice.textContent = 'building shaders';
notice.hidden = false;
requestAnimationFrame(() => setTimeout(() => {
  if (!booted && !gl.isContextLost()) try { boot(); } catch (e) { failed(e); }
}));
</script>
</body>
</html>
