<script>
'use strict';

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const len = a => Math.hypot(a[0], a[1], a[2]);
const norm = a => mul(a, 1 / (len(a) || 1));
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
  return h >>> 0;
}
function mulberry(a) {
  return () => {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rnd = Math.random;
const rf = (a, b) => a + rnd() * (b - a);
const ri = (a, b) => Math.floor(rf(a, b + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const hex = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16) / 255);
const linear = c => c.map(v => v ** 2.2);

// ---- noise

let noise;
function makeNoise() {
  const p = new Uint8Array(512);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1)), t = p[i];
    p[i] = p[j]; p[j] = t;
  }
  for (let i = 0; i < 256; i++) p[i + 256] = p[i];
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  const grad = (h, x, y, z) => {
    h &= 15;
    const u = h < 8 ? x : y, v = h < 4 ? y : h === 12 || h === 14 ? x : z;
    return (h & 1 ? -u : u) + (h & 2 ? -v : v);
  };
  return (x, y, z) => {
    const fx = Math.floor(x), fy = Math.floor(y), fz = Math.floor(z);
    x -= fx; y -= fy; z -= fz;
    const xi = fx & 255, yi = fy & 255, zi = fz & 255;
    const u = fade(x), v = fade(y), w = fade(z);
    const a = p[xi] + yi, aa = p[a] + zi, ab = p[a + 1] + zi;
    const b = p[xi + 1] + yi, ba = p[b] + zi, bb = p[b + 1] + zi;
    return lerp(
      lerp(lerp(grad(p[aa], x, y, z), grad(p[ba], x - 1, y, z), u),
           lerp(grad(p[ab], x, y - 1, z), grad(p[bb], x - 1, y - 1, z), u), v),
      lerp(lerp(grad(p[aa + 1], x, y, z - 1), grad(p[ba + 1], x - 1, y, z - 1), u),
           lerp(grad(p[ab + 1], x, y - 1, z - 1), grad(p[bb + 1], x - 1, y - 1, z - 1), u), v), w);
  };
}
function fbm(x, y, z, oct) {
  let s = 0, a = 1, n = 0;
  for (let i = 0; i < oct; i++) {
    s += a * noise(x, y, z); n += a;
    a *= .5; x *= 2.02; y *= 2.02; z *= 2.02;
  }
  return s / n;
}
function ridge(x, y, z, oct) {
  let s = 0, a = 1, n = 0, w = 1;
  for (let i = 0; i < oct; i++) {
    let v = 1 - Math.abs(noise(x, y, z));
    v *= v * w; w = clamp(v * 1.6, 0, 1);
    s += a * v; n += a;
    a *= .5; x *= 2.1; y *= 2.1; z *= 2.1;
  }
  return s / n;
}

// ---- planets

const S = 512;   // cube map face size

// every surface is drawn with its own set of characters, listed light to heavy
const VOID = 0, SKY = 1, CLOUD = 2, WATER = 3, SAND = 4, GRASS = 5, DRY = 6, ROCK = 7, SNOW = 8, TREE = 9, LAVA = 10, ICE = 11, CRYSTAL = 12, SPIRE = 13;
const RAMPS = [
  " .'`+*",       // void
  ' .',           // sky
  ' .:~',         // cloud
  ' .-~=',        // water
  ' .,:;=',       // sand
  ' .,;"*%',      // grass
  ' .,:;=+%',     // dry ground
  ' .:^=%#',      // rock
  ' .:+*#',       // snow
  ' .:+*%&#',     // tree
  ' .:~=*%#@',    // lava
  ' .:-=+',       // ice
  ' .:+<>*#',     // crystal
  ' .:|!#',       // spire
];
// how much of the surface colour fills the cell behind the character. high values read as
// solid shapes with a light texture, low values as loose characters on black
const BACKING = [0, .9, .9, .75, .7, .7, .7, .65, .75, .6, .5, .75, .5, .6];

// heights are metres, colour stops run from the shore (0) to the highest peak (1),
// tau is how much red/green/blue light the air scatters straight overhead,
// ground is the material of the shore, the wetter land and the drier land
const KINDS = [
  {
    label: 'temperate', cf: 1.2, bias: [-.08, .1], low: 8, mount: 34, deep: 15, rough: 1.5,
    ramp: [[0, '#d8c48c'], [.05, '#7da04a'], [.3, '#3e6d34'], [.58, '#6b6a5a'], [1, '#8d8a80']],
    dry: [[0, '#dfcf9c'], [.07, '#aaa35c'], [.35, '#80804c'], [.65, '#7a7361'], [1, '#8d8a80']],
    rock: '#59544c', ice: '#f1f5fa', snow: .6, polar: 1.3, bed: '#c9b783', ground: [SAND, GRASS, DRY],
    sea: 1, deepCol: '#051d44', shallow: '#1b8088',
    tau: [.05, .12, .3], atmo: .36, cover: [.45, .6], cloudCol: '#ffffff',
    props: [{ mat: TREE, n: 7000, col: '#2a5527', r: [1.3, 2.1], h: [4, 9], hn: [.03, .42], wet: .42 }],
  },
  {
    label: 'ocean', cf: 1.7, bias: [-.3, -.18], low: 7, mount: 24, deep: 18, rough: 1.2,
    ramp: [[0, '#f0e2b0'], [.08, '#69b05a'], [.4, '#2f7a45'], [.75, '#6f7a62'], [1, '#8d8a80']],
    dry: [[0, '#f4e8c0'], [.1, '#a6c064'], [.45, '#5d8a4a'], [.75, '#7a7361'], [1, '#8d8a80']],
    rock: '#5e5a50', ice: '#f1f5fa', snow: .9, polar: .8, bed: '#e6d6a0', ground: [SAND, GRASS, GRASS],
    sea: 1, deepCol: '#03254f', shallow: '#22b8b0',
    tau: [.045, .11, .28], atmo: .36, cover: [.38, .5], cloudCol: '#ffffff',
    props: [{ mat: TREE, n: 5000, col: '#2f7030', r: [1.3, 2], h: [5, 10], hn: [.04, .6], wet: .3 }],
  },
  {
    label: 'arid', cf: 1.4, bias: [.22, .4], low: 9, mount: 26, deep: 0, rough: 1.1, terrace: 5,
    ramp: [[0, '#e9dcb8'], [.04, '#d9a15f'], [.3, '#c26a3a'], [.6, '#8f4a2e'], [1, '#6e3b2a']],
    dry: [[0, '#f1e6c8'], [.05, '#e3b877'], [.35, '#cf8a4d'], [.65, '#9a5a3a'], [1, '#74432f']],
    rock: '#633c2c', ice: '#f4ead8', snow: 2, polar: 0, bed: '#e9dcb8', ground: [SAND, DRY, SAND],
    sea: 0, deepCol: '#000000', shallow: '#000000',
    tau: [.17, .11, .06], atmo: .33, cover: [.64, .76], cloudCol: '#f3dcc4',
    props: [{ mat: SPIRE, n: 2200, col: '#8a4f33', r: [2.5, 5], h: [8, 20], hn: [.02, .5], wet: 0, flat: 1 }],
  },
  {
    label: 'frozen', cf: 1.3, bias: [.02, .22], low: 6, mount: 30, deep: 0, rough: 1,
    ramp: [[0, '#b5dcea'], [.05, '#dfeef5'], [.4, '#f4f8fb'], [.7, '#9fb4c4'], [1, '#7b8ea0']],
    dry: [[0, '#9fcde2'], [.06, '#cfe4ee'], [.4, '#e9f1f6'], [.7, '#8fa5b6'], [1, '#74879a']],
    rock: '#5b6b7a', ice: '#ffffff', snow: .5, polar: .5, bed: '#b5dcea', ground: [ICE, SNOW, ICE],
    sea: 0, deepCol: '#000000', shallow: '#000000',
    tau: [.03, .07, .14], atmo: .34, cover: [.5, .66], cloudCol: '#eef6ff',
    props: [{ mat: CRYSTAL, n: 3200, col: '#7ff2ff', r: [.9, 1.6], h: [4, 13], hn: [0, .5], wet: .5, glow: .8 }],
  },
  {
    label: 'molten', cf: 1.5, bias: [-.04, .12], low: 6, mount: 32, deep: 6, rough: 2.2,
    ramp: [[0, '#3a1a12'], [.05, '#1e1615'], [.4, '#2c2525'], [.7, '#3b3333'], [1, '#4b4141']],
    dry: [[0, '#40190e'], [.06, '#251917'], [.4, '#302727'], [.7, '#3b3333'], [1, '#4b4141']],
    rock: '#161313', ice: '#5c5252', snow: .78, polar: 0, bed: '#3a1208', ground: [ROCK, ROCK, ROCK], veins: '#ff7a1a',
    sea: 2, deepCol: '#000000', shallow: '#000000',
    tau: [.1, .05, .03], atmo: .36, cover: [.5, .62], cloudCol: '#40302c',
    props: [{ mat: SPIRE, n: 1500, col: '#231c1c', r: [2, 4], h: [6, 16], hn: [.03, .5], wet: 0 }],
  },
  {
    label: 'overgrown', cf: 1.25, bias: [-.05, .12], low: 8, mount: 30, deep: 14, rough: 1.6,
    ramp: [[0, '#e8c6f0'], [.05, '#b04fd0'], [.3, '#7a2fa8'], [.6, '#4a3a6a'], [1, '#6a5a80']],
    dry: [[0, '#f0d0c8'], [.06, '#d86aa0'], [.35, '#a04080'], [.65, '#5a4070'], [1, '#6a5a80']],
    rock: '#3d3350', ice: '#f6e8ff', snow: .68, polar: 1, bed: '#c8a0d8', ground: [SAND, GRASS, DRY],
    sea: 1, deepCol: '#04292e', shallow: '#2fd6c0',
    tau: [.15, .07, .2], atmo: .38, cover: [.45, .6], cloudCol: '#ffe8f4',
    props: [{ mat: TREE, n: 7000, col: '#35e0c8', r: [1.2, 2], h: [3, 8], hn: [.03, .45], wet: .45, glow: .3 }],
  },
  {
    label: 'airless', cf: 1.6, bias: [.3, .5], low: 5, mount: 22, deep: 0, rough: 1, craters: 90,
    ramp: [[0, '#6f6b66'], [.3, '#8a8680'], [.7, '#a39e97'], [1, '#b8b3ab']],
    dry: [[0, '#625c55'], [.3, '#7d766d'], [.7, '#99938a'], [1, '#b8b3ab']],
    rock: '#4f4c48', ice: '#ffffff', snow: 2, polar: 0, bed: '#6f6b66', ground: [DRY, ROCK, DRY],
    sea: 0, deepCol: '#000000', shallow: '#000000',
    tau: [0, 0, 0], atmo: 0, cover: [1, 1], cloudCol: '#000000',
    props: [{ mat: CRYSTAL, n: 500, col: '#ffb040', r: [.9, 1.5], h: [3, 9], hn: [0, .6], wet: .55, glow: .9 }],
  },
];
const SUNS = [[1.3, 1.24, 1.14], [1.3, 1.24, 1.14], [1.4, 1.08, .8], [1.14, 1.22, 1.38]];

const planet = { height: [], normal: [], albedo: [], mat: [] };
for (let f = 0; f < 6; f++) {
  planet.height.push(new Float32Array(S * S));
  planet.normal.push(new Uint8Array(S * S * 4));
  planet.albedo.push(new Uint8Array(S * S * 4));
  planet.mat.push(new Uint8Array(S * S));
}
const wet = new Uint8Array(S * S * 6);

// unit direction of every texel centre, per cube face
const dirs = [];
for (let f = 0; f < 6; f++) {
  const D = new Float32Array(S * S * 3);
  for (let j = 0, k = 0; j < S; j++) for (let i = 0; i < S; i++, k += 3) {
    const s = (2 * i + 1) / S - 1, t = (2 * j + 1) / S - 1, l = 1 / Math.hypot(1, s, t);
    const d = f === 0 ? [1, -t, -s] : f === 1 ? [-1, -t, s] : f === 2 ? [s, 1, t]
            : f === 3 ? [s, -1, -t] : f === 4 ? [s, -t, 1] : [-s, -t, -1];
    D[k] = d[0] * l; D[k + 1] = d[1] * l; D[k + 2] = d[2] * l;
  }
  dirs.push(D);
}
const faceDir = (f, i, j) => dirs[f].subarray((j * S + i) * 3, (j * S + i) * 3 + 3);

function cubeUV(d) {
  const [x, y, z] = d, ax = Math.abs(x), ay = Math.abs(y), az = Math.abs(z);
  let f, s, t;
  if (ax >= ay && ax >= az) { f = x > 0 ? 0 : 1; s = (x > 0 ? -z : z) / ax; t = -y / ax; }
  else if (ay >= az) { f = y > 0 ? 2 : 3; s = x / ay; t = (y > 0 ? z : -z) / ay; }
  else { f = z > 0 ? 4 : 5; s = (z > 0 ? x : -x) / az; t = -y / az; }
  return [f, (s + 1) * .5 * S - .5, (t + 1) * .5 * S - .5];
}
function heightAt(d) {
  const [f, u, v] = cubeUV(d);
  const x = clamp(Math.floor(u), 0, S - 2), y = clamp(Math.floor(v), 0, S - 2);
  const fx = clamp(u - x, 0, 1), fy = clamp(v - y, 0, 1);
  const h = planet.height[f], i = y * S + x;
  return lerp(lerp(h[i], h[i + 1], fx), lerp(h[i + S], h[i + S + 1], fx), fy);
}
// the surface the ship stops at: terrain, or the sea if there is one
const groundAt = d => Math.max(heightAt(d), planet.sea ? 0 : -1e9);

function rampTable(stops) {
  const t = new Float32Array(256 * 3), cols = stops.map(s => hex(s[1]));
  for (let i = 0; i < 256; i++) {
    const x = i / 255;
    let k = 1;
    while (k < stops.length - 1 && x > stops[k][0]) k++;
    t.set(mix3(cols[k - 1], cols[k], smooth(stops[k - 1][0], stops[k][0], x)), i * 3);
  }
  return t;
}

const NAME_A = ['Ve', 'Ko', 'Tha', 'Ori', 'Su', 'Mar', 'El', 'Zy', 'Nu', 'Ar', 'Xe', 'Ky', 'Bel', 'Dra', 'Io', 'Ty'];
const NAME_B = ['la', 'ron', 'ris', 'mea', 'tov', 'ne', 'dax', 'lun', 'phi', 'ra', 'sei', 'bes', 'kar', 'th', 'via', 'nix'];
const NAME_C = ['', '', ' II', ' III', ' IV', ' VI', ' Prime', '-7', '-9b', ' Minor'];
const onSphere = () => {
  const z = rf(-1, 1), a = rf(0, Math.PI * 2), r = Math.sqrt(1 - z * z);
  return [r * Math.cos(a), z, r * Math.sin(a)];
};

function design(seed) {
  rnd = mulberry(hashStr(seed));
  noise = makeNoise();
  const K = pick(KINDS), R = Math.round(rf(240, 330));
  Object.assign(planet, {
    seed, K, R, sea: K.sea,
    name: pick(NAME_A) + pick(NAME_B) + (rnd() < .35 ? pick(NAME_B) : '') + pick(NAME_C),
    lush: rampTable(K.ramp), dry: rampTable(K.dry),
    atmo: K.atmo * R, cover: rf(K.cover[0], K.cover[1]), cloudAlt: R * rf(.085, .11), cloudF: rf(2.6, 3.6),
    bias: rf(K.bias[0], K.bias[1]),
    off: [rf(-99, 99), rf(-99, 99), rf(-99, 99)],
    dayLen: rf(420, 600), tilt: rf(-.35, .35), sunCol: pick(SUNS), key: ri(0, 11),
    ring: rnd() < .3 && {
      n: norm([rf(-.5, .5), 1, rf(-.5, .5)]), inner: R * rf(1.5, 1.8), outer: R * rf(2.2, 2.7),
      col: linear(hex(pick(['#d8c8a8', '#b8c4d8', '#e0b090']))), alpha: rf(.5, .85), seed: rf(0, 50),
    },
    moon: rnd() < .6 && { dist: R * rf(9, 11), r: R * rf(.2, .34), speed: rf(.006, .015), phase: rf(0, 6), incl: rf(-.4, .4) },
    craters: Array.from({ length: K.craters || 0 }, () => ({ d: onSphere(), r: rf(.03, .16) })),
  });
}

function terrain(x, y, z) {
  const K = planet.K, [ox, oy, oz] = planet.off;
  const land = (fbm(x * K.cf + ox, y * K.cf + oy, z * K.cf + oz, 5) + planet.bias) * 2.4;
  let h;
  if (land > 0) {
    const m = ridge(x * 3.1 + oy, y * 3.1 + oz, z * 3.1 + ox, 4);
    h = land * K.low + m * m * K.mount * Math.min(1, land * 2.2);
  } else h = land * K.deep;
  h += fbm(x * 13 + oz, y * 13 + ox, z * 13 + oy, 2) * K.rough * (land > 0 ? 1 : .35);
  if (K.terrace) {
    const s = h / K.terrace, f = Math.floor(s);
    h = (f + smooth(.3, .7, s - f)) * K.terrace;
  }
  for (const c of planet.craters) {
    const q = Math.sqrt(Math.max(0, 2 - 2 * (x * c.d[0] + y * c.d[1] + z * c.d[2]))) / c.r;
    if (q > 1.7) continue;
    const depth = c.r * planet.R * .22;
    h += (q < 1 ? depth * (q * q - 1) : 0) + depth * .4 * Math.exp(-(((q - 1) / .2) ** 2));
  }
  return K.sea ? h : Math.max(h, 0);
}

function buildFace(f) {
  const H = planet.height[f], D = dirs[f], W = wet.subarray(f * S * S), [ox, oy, oz] = planet.off;
  planet.albedo[f].fill(0);
  for (let k = 0; k < S * S; k++) {
    const x = D[k * 3], y = D[k * 3 + 1], z = D[k * 3 + 2];
    H[k] = terrain(x, y, z);
    W[k] = clamp(fbm(x * 2.7 - ox, y * 2.7 - oy, z * 2.7 - oz, 2) * 1.7 + .5, 0, 1) * 255;
  }
}

// trees, spires and crystals are bumps stamped into the height map
function scatter() {
  let top = 0, low = 0;
  for (const H of planet.height) for (let i = 0; i < H.length; i++) {
    if (H[i] > top) top = H[i];
    if (H[i] <= 0) low++;
  }
  planet.peak = top;
  planet.flat = low / (6 * S * S);
  for (const P of planet.K.props) {
    const c = hex(P.col);
    for (let n = 0; n < P.n; n++) {
      const f = ri(0, 5), ci = ri(8, S - 9), cj = ri(8, S - 9), k = cj * S + ci;
      const H = planet.height[f], A = planet.albedo[f], h0 = H[k], hn = h0 / top;
      if (hn < P.hn[0] || hn > P.hn[1] || h0 < .3 || wet[f * S * S + k] / 255 < P.wet) continue;
      if (Math.abs(H[k + 1] - H[k - 1]) + Math.abs(H[k + S] - H[k - S]) > 2.2) continue;
      const d0 = faceDir(f, ci, cj), r = rf(P.r[0], P.r[1]), hh = rf(P.h[0], P.h[1]);
      for (let j = cj - 6; j <= cj + 6; j++) for (let i = ci - 6; i <= ci + 6; i++) {
        const q = j * S + i, dist = len(sub(faceDir(f, i, j), d0)) * planet.R / r;
        if (dist >= 1) continue;
        const v = h0 + hh * (P.flat ? smooth(1, .55, dist) : Math.pow(1 - dist, .8));
        if (v <= H[q]) continue;
        H[q] = v;
        A[q * 4] = c[0] * 255; A[q * 4 + 1] = c[1] * 255; A[q * 4 + 2] = c[2] * 255; A[q * 4 + 3] = 1 + (P.glow || 0) * 254;
        planet.mat[f][q] = P.mat;
      }
    }
  }
  planet.top = top + 22;   // tallest prop on the highest ground
}

// normals, colours and materials for one face
function paintFace(f) {
  const H = planet.height[f], A = planet.albedo[f], Nm = planet.normal[f], M = planet.mat[f], D = dirs[f], W = wet.subarray(f * S * S);
  const { R, sea, lush, dry, K, peak } = planet;
  const rock = hex(K.rock), ice = hex(K.ice), bed = hex(K.bed), vein = K.veins && hex(K.veins);
  const rad = q => R + (sea ? Math.max(H[q], 0) : H[q]);
  for (let j = 0, k = 0; j < S; j++) for (let i = 0; i < S; i++, k++) {
    const l = i ? k - 1 : k, r = i < S - 1 ? k + 1 : k, u = j ? k - S : k, d = j < S - 1 ? k + S : k;
    const rl = rad(l), rr = rad(r), ru = rad(u), rd = rad(d);
    const ax = D[r * 3] * rr - D[l * 3] * rl, ay = D[r * 3 + 1] * rr - D[l * 3 + 1] * rl, az = D[r * 3 + 2] * rr - D[l * 3 + 2] * rl;
    const bx = D[d * 3] * rd - D[u * 3] * ru, by = D[d * 3 + 1] * rd - D[u * 3 + 1] * ru, bz = D[d * 3 + 2] * rd - D[u * 3 + 2] * ru;
    const nx = ay * bz - az * by, ny = az * bx - ax * bz, nz = ax * by - ay * bx, nl = Math.hypot(nx, ny, nz);
    const up = (nx * D[k * 3] + ny * D[k * 3 + 1] + nz * D[k * 3 + 2]) / nl, sc = (up < 0 ? -127.5 : 127.5) / nl;
    Nm[k * 4] = nx * sc + 127.5; Nm[k * 4 + 1] = ny * sc + 127.5; Nm[k * 4 + 2] = nz * sc + 127.5;
    if (A[k * 4 + 3]) continue;   // a prop owns this texel
    const h = H[k], m = W[k] / 255;
    let cr, cg, cb;
    if (sea && h <= 0) {
      [cr, cg, cb] = bed;
      M[k] = SAND;
    } else if (vein && Math.abs(m - .5) < .016 && h < peak * .5) {
      [cr, cg, cb] = vein;
      A[k * 4 + 3] = 220;
      M[k] = LAVA;
    } else {
      const slope = 1 - Math.abs(up), hn = clamp(h / peak, 0, 1), q = (hn * 255 | 0) * 3;
      const w = smooth(.3, .6, m), cl = smooth(.1, .28, slope);
      const sn = smooth(-.06, .04, hn - K.snow + (Math.abs(D[k * 3 + 1]) - .72) * K.polar + (m - .5) * .12) * (1 - .6 * smooth(.3, .55, slope));
      cr = lerp(lerp(lerp(dry[q], lush[q], w), rock[0], cl), ice[0], sn);
      cg = lerp(lerp(lerp(dry[q + 1], lush[q + 1], w), rock[1], cl), ice[1], sn);
      cb = lerp(lerp(lerp(dry[q + 2], lush[q + 2], w), rock[2], cl), ice[2], sn);
      M[k] = sn > .5 ? SNOW : cl > .5 ? ROCK : K.ground[hn < .04 ? 0 : w > .5 ? 1 : 2];
    }
    A[k * 4] = cr * 255; A[k * 4 + 1] = cg * 255; A[k * 4 + 2] = cb * 255;
  }
}

function placeBeacons() {
  const list = [];
  for (let i = 0; i < 6000 && list.length < 5; i++) {
    const d = onSphere(), h = heightAt(d), side = norm(cross(d, [.3, .9, .2]));
    if (h < 1.5 || h > planet.peak * (i < 3000 ? .5 : 1)) continue;
    if (Math.abs(heightAt(norm(add(d, mul(side, .01)))) - h) > 1.5) continue;
    if (list.some(b => dot(b.dir, d) > (i < 2000 ? .5 : i < 4000 ? .8 : .96))) continue;
    list.push({ dir: d, base: mul(d, planet.R + h), got: false });
  }
  planet.beacons = list;
}

// ---- gl

const canvas = document.getElementById('view');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
if (!gl) {
  document.body.textContent = 'planet.txt needs WebGL 2';
  throw new Error('no webgl2');
}

function shader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, shader(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {};
  for (let i = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS) - 1; i >= 0; i--) {
    const name = gl.getActiveUniform(p, i).name.replace('[0]', '');
    u[name] = gl.getUniformLocation(p, name);
  }
  return { p, u };
}
function texture(unit, target, min, wrap = gl.CLAMP_TO_EDGE) {
  const t = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(target, t);
  gl.texParameteri(target, gl.TEXTURE_MIN_FILTER, min);
  gl.texParameteri(target, gl.TEXTURE_MAG_FILTER, min === gl.NEAREST ? gl.NEAREST : gl.LINEAR);
  gl.texParameteri(target, gl.TEXTURE_WRAP_S, wrap);
  gl.texParameteri(target, gl.TEXTURE_WRAP_T, wrap);
  if (target === gl.TEXTURE_3D) gl.texParameteri(target, gl.TEXTURE_WRAP_R, wrap);
  return t;
}

const QUAD = `#version 300 es
out vec2 vUv;
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)) * 2. - 1.;
  vUv = p;
  gl_Position = vec4(p, 0., 1.);
}`;

// pass 1: ray march the planet into a small buffer, six pixels per character cell
const SCENE = `#version 300 es
precision highp float;
precision highp sampler3D;

uniform samplerCube uHeight, uNormal, uAlbedo, uMat;
uniform sampler3D uNoise;
uniform vec3 uPos, uFwd, uRight, uUp, uSun, uSunCol;
uniform vec2 uFov;
uniform float uTime, uR, uTop, uPix, uTexel, uAtmo, uAdapt;
uniform vec3 uBeta, uShallow, uCloudCol, uRingN, uRingCol, uBeaconCol;
uniform vec4 uSea, uCloud, uRing, uMoon, uShip;
uniform vec4 uBeacon[5];
in vec2 vUv;
layout(location = 0) out vec4 o;
layout(location = 1) out vec4 info;
float glow;   // how much of this pixel is a light source, 0..1
float mat;    // which set of characters it gets, an index into RAMPS

uint ih(uint x) { x ^= x >> 16; x *= 0x7feb352dU; x ^= x >> 15; x *= 0x846ca68bU; x ^= x >> 16; return x; }
float hash(vec3 p) {
  ivec3 q = ivec3(floor(p));
  return float(ih(uint(q.x) * 1973U + uint(q.y) * 9277U + uint(q.z) * 26699U) >> 8) / 16777216.;
}
float n3(vec3 p) {
  vec3 i = floor(p), f = fract(p);
  f = f * f * (3. - 2. * f);
  return textureLod(uNoise, (i + f + .5) / 32., 0.).r;
}
float fbm(vec3 p) {
  float s = 0., a = .5;
  for (int i = 0; i < 4; i++) { s += a * n3(p); p = p * 2.03 + 7.1; a *= .5; }
  return s / .9375;
}
// distances to where a ray enters and leaves a sphere at the origin
vec2 sphere(vec3 ro, vec3 rd, float r) {
  float b = dot(ro, rd), h = b * b - dot(ro, ro) + r * r;
  if (h < 0.) return vec2(1e9, -1e9);
  h = sqrt(h);
  return vec2(-b - h, -b + h);
}
bool hits(vec2 s) { return s.x > 0. && s.x < s.y; }

float ground(vec3 p) {
  float h = textureLod(uHeight, p, 0.).r;
  return uSea.a > .5 ? max(h, 0.) : h;
}
float above(vec3 p) { return length(p) - uR - ground(p); }

// distance along the ray to the terrain, or -1
float march(vec3 ro, vec3 rd) {
  vec2 s = sphere(ro, rd, uR + uTop);
  if (s.y < 0.) return -1.;
  float t = max(s.x, 0.), tp = t;
  bool hit = false;
  for (int i = 0; i < 110 && t < s.y; i++) {
    float a = above(ro + rd * t);
    if (a < .0015 * t) { hit = true; break; }
    tp = t;
    t += max(a * .5, .004 * t);
  }
  if (!hit) {
    // a grazing ray can run out of steps; let it land on the smooth sphere instead of leaving a hole
    vec2 q = sphere(ro, rd, uR);
    return t < s.y && q.x > t ? q.x : -1.;
  }
  for (int k = 0; k < 5; k++) {
    float tm = .5 * (tp + t);
    if (above(ro + rd * tm) < 0.) t = tm; else tp = tm;
  }
  return t;
}

float shadow(vec3 p) {
  float res = 1., t = .6;
  for (int i = 0; i < 22; i++) {
    vec3 q = p + uSun * t;
    float a = above(q);
    res = min(res, 9. * a / t);
    if (res < .02 || length(q) > uR + uTop) break;
    t += clamp(a, .6, 14.);
  }
  return clamp(res, 0., 1.);
}

float cloudAt(vec3 d) {
  vec3 q = d * uCloud.z + vec3(uTime * .006, 0., uTime * .004);
  float w = fbm(q * .6 + 11.);
  return smoothstep(uCloud.x, uCloud.x + .2, fbm(q + w * 1.4));
}
vec3 sunTint(float mu, float k) { return exp(-uBeta * uAtmo * .25 * k / max(mu + .15, .05)); }
vec3 skyCol() { return uBeta / max(max(uBeta.r, uBeta.g), max(uBeta.b, 1e-6)); }

vec3 cloudLit(vec3 d) {
  float mu = dot(d, uSun);
  float thick = cloudAt(normalize(d + uSun * .025));
  return uCloudCol * (uSunCol * sunTint(mu, .7) * smoothstep(-.12, .2, mu) * mix(1., .4, thick)
                      + skyCol() * smoothstep(-.3, .2, mu) * .15 + .01);
}

float ringBand(float r) {
  float x = (r - uRing.x) / (uRing.y - uRing.x);
  if (x < 0. || x > 1.) return 0.;
  float b = .3 + .7 * n3(vec3(x * 9. + uRing.w, .5, .5));
  return b * smoothstep(0., .05, x) * smoothstep(1., .92, x) * smoothstep(.02, .05, abs(x - .58)) * uRing.z;
}

vec3 surface(vec3 ro, vec3 rd, float t) {
  vec3 p = ro + rd * t, d = normalize(p);
  float lod = clamp(log2(t * uPix / uTexel), 0., 6.);
  float h = textureLod(uHeight, d, 0.).r;
  vec4 al = textureLod(uAlbedo, d, lod);
  vec3 alb = pow(al.rgb, vec3(2.2));
  vec3 n = normalize(textureLod(uNormal, d, lod).xyz * 2. - 1.);
  bool sea = uSea.a > .5 && h < 0.;
  if (sea) n = d;
  mat = sea ? (uSea.a > 1.5 ? ${LAVA}. : ${WATER}.) : floor(textureLod(uMat, d, 0.).r * 255. + .5);

  float mu = dot(d, uSun), day = smoothstep(-.25, .25, mu);
  vec3 amb = skyCol() * day * .1 + vec3(.03, .035, .05);
  float ndl = max(dot(n, uSun), 0.), vis = 1.;
  if (ndl > 0.) vis = shadow(p + n * .3);
  if (uCloud.w > 0. && length(p) < uR + uCloud.y) {
    vec2 s = sphere(p, uSun, uR + uCloud.y);
    vis *= 1. - .75 * uCloud.w * cloudAt(normalize(p + uSun * s.y));
  }
  if (uRing.z > 0.) {
    float k = -dot(p, uRingN) / dot(uSun, uRingN);
    if (k > 0.) vis *= 1. - .8 * ringBand(length(p + uSun * k));
  }
  vec3 sun = uSunCol * sunTint(mu, 1.5) * vis;
  vec3 light = sun * ndl + amb;
  // headlamp, only once it gets dark
  light += vec3(1.5, 1.4, 1.15) * (1. - day) * max(dot(n, -rd), 0.) / (1. + t * t / 250.);
  for (int i = 0; i < 5; i++) {
    vec4 b = uBeacon[i];
    vec3 q = p - b.xyz, v = normalize(b.xyz);
    float along = dot(q, v);
    light += uBeaconCol * b.w * 1.6 / (1. + (dot(q, q) - along * along) / 40.);
  }

  if (!sea) {
    float det = n3(p * .9) * .5 + n3(p * 3.7) * .5;
    alb *= mix(1., .55 + .9 * det, exp(-t * .03));
    float em = step(.01, al.a) * (al.a - .004);
    glow = em;
    return alb * light + alb * em * 7.;
  }
  if (uSea.a > 1.5) {
    float crust = smoothstep(.38, .6, n3(p * .22 + vec3(0., uTime * .02, 0.)) * .6 + n3(p * .9) * .4);
    glow = 1. - crust;
    return mix(vec3(4., .7, .06), vec3(.03, .015, .012) * light, crust);
  }
  vec3 wc = mix(uShallow, uSea.rgb, 1. - exp(h * .3));
  wc = mix(alb, wc, 1. - exp(h * 1.4));
  vec3 rip = vec3(n3(p * 1.1 + uTime * .5), n3(p * 1.1 + 9. - uTime * .4), n3(p * 1.1 + 17. + uTime * .3)) - .5;
  vec3 wn = normalize(d + rip * .14 * exp(-t * .008));
  float fres = pow(1. - max(dot(-rd, wn), 0.), 5.);
  float sp = max(dot(reflect(rd, wn), uSun), 0.);
  glow = pow(sp, 90.) * vis;
  return wc * light * (1. - fres) + (skyCol() * day * .3 + .008) * fres + sun * (pow(sp, 90.) * 7. + pow(sp, 10.) * .2);
}

vec3 stars(vec3 rd) {
  vec3 q = rd * 95.;
  float h = hash(q);
  if (h < .986) return vec3(0.);
  float b = (h - .986) / .014;
  float tw = .75 + .25 * sin(uTime * (1.5 + b * 4.) + b * 60.);
  return mix(vec3(1., .85, .7), vec3(.75, .85, 1.), fract(b * 7.3)) * smoothstep(.5, .1, length(fract(q) - .5)) * (.25 + b * b * 1.5) * tw;
}

// sun and moon; they stay visible through a daytime sky, the stars do not
vec3 lights(vec3 ro, vec3 rd) {
  float sd = max(dot(rd, uSun), 0.);
  vec3 col = uSunCol * (smoothstep(.99965, .9999, sd) * 60. + pow(sd, 900.) * 4. + pow(sd, 50.) * .2);
  glow = smoothstep(.9992, .9999, sd);
  vec2 s = sphere(ro - uMoon.xyz, rd, uMoon.w);
  if (uMoon.w > 0. && hits(s)) {
    vec3 n = normalize(ro + rd * s.x - uMoon.xyz);
    col = vec3(.5, .48, .45) * (.45 + fbm(n * 3.5 + 3.)) * (uSunCol * max(dot(n, uSun), 0.) + .004);
    glow = 0.;
    mat = ${ROCK}.;
  }
  return col;
}

// single scattering: light picked up along the view ray, and how much of what is behind survives
vec3 atmosphere(vec3 ro, vec3 rd, float tMax, out vec3 trans) {
  trans = vec3(1.);
  if (uAtmo <= 0.) return vec3(0.);
  vec2 s = sphere(ro, rd, uR + uAtmo);
  float t0 = max(s.x, 0.), t1 = min(s.y, tMax);
  if (t1 <= t0) return vec3(0.);
  float hs = uAtmo * .25, ds = (t1 - t0) / 8., od = 0.;
  vec3 sum = vec3(0.);
  for (int i = 0; i < 8; i++) {
    vec3 p = ro + rd * (t0 + (float(i) + .5) * ds);
    float dens = exp(-max(length(p) - uR, 0.) / hs) * ds;
    od += dens;
    if (hits(sphere(p, uSun, uR * .99))) continue;   // in the planet's shadow
    float dl = sphere(p, uSun, uR + uAtmo).y / 4., ods = 0.;
    for (int j = 0; j < 4; j++) ods += exp(-max(length(p + uSun * ((float(j) + .5) * dl)) - uR, 0.) / hs) * dl;
    sum += dens * exp(-uBeta * (od + ods));
  }
  trans = exp(-uBeta * od);
  float mu = dot(rd, uSun), m = max(mu, 0.);
  // rayleigh, plus a forward lobe round the sun that carries the sunset colours
  return sum * uSunCol * uAdapt * (uBeta * .45 * (1. + mu * mu) + (.012 * pow(m, 6.) + .09 * pow(m, 90.)) / hs);
}

void main() {
  vec3 ro = uPos, rd = normalize(uFwd + uRight * vUv.x * uFov.x + uUp * vUv.y * uFov.y);
  float t = march(ro, rd), tEnd = 1e5;
  vec3 col, st = vec3(0.);
  glow = 0.;
  mat = ${VOID}.;
  if (t > 0.) { col = surface(ro, rd, t); tEnd = t; }
  else { col = lights(ro, rd); st = stars(rd); }

  vec2 hull = sphere(ro - uShip.xyz, rd, 1.5);
  if (uShip.w > 0. && hits(hull) && hull.x < tEnd) {
    vec3 n = normalize(ro + rd * hull.x - uShip.xyz), up = normalize(uShip.xyz);
    float band = smoothstep(.12, .05, abs(dot(n, up) - .1));
    col = vec3(.5, .52, .56) * (uSunCol * max(dot(n, uSun), 0.) + .06) + uBeaconCol * band * 2.5
        + vec3(4., .3, .2) * smoothstep(.93, .97, dot(n, up)) * step(.5, fract(uTime * .8));
    tEnd = hull.x;
    glow = band;
    mat = ${SPIRE}.;
    st = vec3(0.);
  }

  float tAir = tEnd;
  if (uCloud.w > 0.) {
    vec2 s = sphere(ro, rd, uR + uCloud.y);
    for (int i = 0; i < 2; i++) {
      float tc = i == 0 ? s.y : s.x;
      if (tc <= 0. || tc >= tEnd) continue;
      vec3 d = normalize(ro + rd * tc);
      float a = cloudAt(d) * uCloud.w * smoothstep(0., 14., tc);
      col = mix(col, cloudLit(d), a);
      tAir = mix(tAir, tc, a);
      glow *= 1. - a;
      st *= 1. - a;
      if (a > .5) mat = ${CLOUD}.;
    }
    float inside = cloudAt(normalize(ro)) * uCloud.w * smoothstep(8., 0., abs(length(ro) - uR - uCloud.y));
    col = mix(col, cloudLit(normalize(ro)), inside * .9);
  }

  vec3 tr;
  vec3 sc = atmosphere(ro, rd, tAir, tr);
  col = (col + st * clamp(1. - dot(sc, vec3(4.)), 0., 1.)) * tr + sc;
  if (t < 0. && tEnd > 9e4 && mat != ${CLOUD}. && dot(sc, vec3(1.)) > .03) mat = ${SKY}.;   // open sky, moon included

  if (uRing.z > 0.) {
    float k = -dot(ro, uRingN) / dot(rd, uRingN);
    if (k > 0. && k < tEnd) {
      vec3 q = ro + rd * k;
      float lit = hits(sphere(q, uSun, uR)) ? .03 : 1., a = ringBand(length(q));
      col = mix(col, uRingCol * uSunCol * lit * .5, a);
      if (a > .3) mat = ${SAND}.;
    }
  }

  for (int i = 0; i < 5; i++) {
    vec4 b = uBeacon[i];
    if (b.w <= 0.) continue;
    // closest approach between the view ray and the beam
    vec3 v = normalize(b.xyz), w = ro - b.xyz;
    float bb = dot(rd, v), dd = dot(rd, w), e = dot(v, w), den = 1. - bb * bb;
    float sb = clamp(den < 1e-4 ? e : (e - bb * dd) / den, 0., 170.);
    float tb = clamp(sb * bb - dd, 0., tEnd);
    float dist = length(ro + rd * tb - b.xyz - v * sb), wid = .3 + tb * .0035;
    float g = 1. / (1. + dist * dist / (wid * wid));
    float pulse = .75 + .25 * sin(uTime * 3. - sb * .08 + float(i));
    col += mix(vec3(.6), uBeaconCol, step(.5, b.w)) * b.w * g * pulse * 2.6 * smoothstep(170., 60., sb);
    glow = max(glow, g * b.w);
    if (g * b.w > .45) mat = ${SPIRE}.;
  }

  col = 1. - exp(-col * 1.3);
  o = vec4(pow(col, vec3(.4545)), 1.);
  info = vec4(mat / 255., clamp(glow, 0., 1.), 0., 1.);
}`;

// pass 2: one pixel per character cell. picks the character and its two colours
const CELLS = `#version 300 es
precision highp float;
uniform sampler2D uScene, uInfo, uShapes, uRamps, uAllow;
uniform vec2 uGrid;
uniform int uCount;
uniform float uInk;
uniform float uBack[${RAMPS.length}];
layout(location = 0) out vec4 o0;
layout(location = 1) out vec4 o1;
layout(location = 2) out vec4 o2;

void main() {
  vec2 cell = floor(gl_FragCoord.xy);
  vec3 c[6], avg = vec3(0.), dark;
  float d[6], top = 0., lo = 9., low = 9., em = 0.;
  for (int k = 0; k < 6; k++) {
    vec2 uv = (cell + vec2((float(k & 1) + .5) * .5, 1. - (float(k >> 1) + .5) / 3.)) / uGrid;
    c[k] = textureLod(uScene, uv, 0.).rgb;
    avg += c[k] / 6.;
    em += textureLod(uInfo, uv, 0.).g / 6.;
    float l = dot(c[k], vec3(.299, .587, .114));
    if (l < low) { low = l; dark = c[k]; }
    d[k] = min(1., pow(l, 1.5) * 1.15) * uInk;
    top = max(top, d[k]);
    lo = min(lo, d[k]);
  }
  // push the samples apart so an edge inside the cell survives the match
  if (top > 0.) for (int k = 0; k < 6; k++) d[k] = top * pow(d[k] / top, 1.4);

  vec3 a = vec3(d[0], d[1], d[2]), b = vec3(d[3], d[4], d[5]);
  float edge = smoothstep(.1, .3, (top - lo) / uInk);
  float dither = fract(52.9829189 * fract(dot(cell, vec2(.06711056, .00583715)))) - .5;
  float mean = (a.x + a.y + a.z + b.x + b.y + b.z) / 6.;
  vec3 ca = a - mean, cb = b - mean;
  float spread = dot(ca, ca) + dot(cb, cb);   // how far the cell is from flat

  // a flat cell takes the character its material uses at this brightness;
  // a cell with an edge in it takes whichever character has the closest shape
  int m = int(textureLod(uInfo, (cell + .5) / uGrid, 0.).r * 255. + .5);
  int level = int(clamp(mean / uInk + dither * .025, 0., 1.) * 15. + .5);
  int tone = int(texelFetch(uRamps, ivec2(level, m), 0).r * 255. + .5), glyph = tone;
  float best = 1e9;
  for (int i = 0; i < uCount; i++) {
    if (i != tone && texelFetch(uAllow, ivec2(i, m), 0).r < .5) continue;
    vec3 ga = texelFetch(uShapes, ivec2(i, 0), 0).rgb, gb = texelFetch(uShapes, ivec2(i, 1), 0).rgb;
    float gm = (ga.x + ga.y + ga.z + gb.x + gb.y + gb.z) / 6.;
    vec3 sa = ga - gm - ca, sb = gb - gm - cb;
    // another character only replaces the tone when it really has the shape of this edge
    if (i != tone && dot(sa, sa) + dot(sb, sb) > .6 * spread) continue;
    vec3 da = ga - a, db = gb - b;
    float e = dot(da, da) + dot(db, db);
    e = i == tone ? e * edge : e + 1. - edge;
    if (e < best) { best = e; glyph = i; }
  }

  vec3 fg = vec3(0.);
  float w = 0.;
  for (int k = 0; k < 6; k++) { fg += c[k] * (d[k] + .001); w += d[k] + .001; }
  fg /= w;
  // ink covers a fraction of the cell, so it is drawn brighter than the scene: a little inside
  // a surface, where it is only texture, and a lot along an edge, where it is the outline
  fg = max(mix(vec3(dot(fg, vec3(.299, .587, .114))), fg, 1.2), 0.) * mix(1.45, 2., edge);
  fg /= max(1., max(fg.r, max(fg.g, fg.b)));

  o0 = vec4(fg, float(glyph) / 255.);
  o1 = vec4(avg * uBack[m], 1.);
  o2 = vec4(avg * em, 1.);
}`;

// pass 3: stamp the characters at full resolution, add bloom, lay the interface text on top
const FINAL = `#version 300 es
precision highp float;
uniform sampler2D uScene, uC0, uC1, uGlow, uAtlas, uText;
uniform vec2 uRes, uCell, uGrid, uAtlasGrid;
uniform float uRaw;
out vec4 o;

float ink(int g, vec2 f) { return texture(uAtlas, (vec2(float(g % 16), float(g / 16)) + f) / uAtlasGrid).r; }

void main() {
  vec2 px = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec2 cf = px / uCell, f = fract(cf);
  ivec2 ci = ivec2(cf.x, uGrid.y - 1. - floor(cf.y));
  vec2 uv = vec2(cf.x, uGrid.y - cf.y) / uGrid;

  // text styles: 1 plain, 2 dim, 3 status bar, 4 highlighted block, 5 accent, 6 dim on the bar
  ivec2 tx = ivec2(texelFetch(uText, ivec2(cf), 0).rg * 255. + .5);
  if (tx.y > 0) {
    const vec3 accent = vec3(.36, 1., .84);
    vec3 fg = tx.y == 2 || tx.y == 6 ? vec3(.46) : tx.y == 4 ? vec3(0.) : tx.y == 5 ? accent : vec3(.9);
    vec3 bg = tx.y == 4 ? accent : tx.y == 3 || tx.y == 6 ? vec3(.085) : vec3(0.);
    o = vec4(mix(bg, fg, ink(tx.x, f)), 1.);
    return;
  }
  if (uRaw > .5) { o = vec4(texture(uScene, uv).rgb, 1.); return; }
  vec4 a = texelFetch(uC0, ci, 0);
  // the colour behind the characters is blended between cell centres, so it has no steps
  vec3 col = mix(texture(uC1, uv).rgb, a.rgb, ink(int(a.a * 255. + .5), f));
  col += textureLod(uGlow, uv, 1.).rgb * .45 + textureLod(uGlow, uv, 2.5).rgb * .35 + textureLod(uGlow, uv, 4.).rgb * .25;
  o = vec4(col, 1.);
}`;

const scene = program(QUAD, SCENE), cells = program(QUAD, CELLS), final = program(QUAD, FINAL);
texture(0, gl.TEXTURE_CUBE_MAP, gl.LINEAR);                  // height
texture(1, gl.TEXTURE_CUBE_MAP, gl.LINEAR_MIPMAP_LINEAR);    // normal
texture(2, gl.TEXTURE_CUBE_MAP, gl.LINEAR_MIPMAP_LINEAR);    // albedo
texture(3, gl.TEXTURE_3D, gl.LINEAR, gl.REPEAT);             // noise
const sceneTex = [texture(4, gl.TEXTURE_2D, gl.LINEAR), texture(10, gl.TEXTURE_2D, gl.NEAREST)];
texture(5, gl.TEXTURE_2D, gl.NEAREST);                       // glyph shapes
const cellTex = [texture(6, gl.TEXTURE_2D, gl.NEAREST), texture(7, gl.TEXTURE_2D, gl.LINEAR), texture(8, gl.TEXTURE_2D, gl.LINEAR_MIPMAP_LINEAR)];
texture(9, gl.TEXTURE_2D, gl.NEAREST);                       // glyph atlas
texture(11, gl.TEXTURE_CUBE_MAP, gl.NEAREST);                // material
texture(12, gl.TEXTURE_2D, gl.NEAREST);                      // character per material and brightness
texture(13, gl.TEXTURE_2D, gl.NEAREST);                      // interface text
texture(14, gl.TEXTURE_2D, gl.NEAREST);                      // characters each material may use
gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
{
  const n = new Uint8Array(32 * 32 * 32), r = mulberry(7);
  for (let i = 0; i < n.length; i++) n[i] = r() * 256;
  gl.activeTexture(gl.TEXTURE3);
  gl.texImage3D(gl.TEXTURE_3D, 0, gl.R8, 32, 32, 32, 0, gl.RED, gl.UNSIGNED_BYTE, n);
}
const sceneFbo = gl.createFramebuffer(), cellFbo = gl.createFramebuffer();
gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFbo);
sceneTex.forEach((t, i) => gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, t, 0));
gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
gl.bindFramebuffer(gl.FRAMEBUFFER, cellFbo);
cellTex.forEach((t, i) => gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, t, 0));
gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1, gl.COLOR_ATTACHMENT2]);
gl.bindVertexArray(gl.createVertexArray());

function uploadPlanet() {
  const cube = (unit, faces, internal, format, type, mips) => {
    gl.activeTexture(gl.TEXTURE0 + unit);
    for (let f = 0; f < 6; f++) gl.texImage2D(gl.TEXTURE_CUBE_MAP_POSITIVE_X + f, 0, internal, S, S, 0, format, type, faces[f]);
    if (mips) gl.generateMipmap(gl.TEXTURE_CUBE_MAP);
  };
  cube(0, planet.height, gl.R16F, gl.RED, gl.FLOAT, false);
  cube(1, planet.normal, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, true);
  cube(2, planet.albedo, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, true);
  cube(11, planet.mat, gl.R8, gl.RED, gl.UNSIGNED_BYTE, false);
}

// ---- characters

// GLYPHS is what the picture may be drawn with: every ramp, plus a few line shapes for edges.
// No letters or digits, so nothing in the view reads as words. FONT adds the rest of ASCII
// so the interface can write anything.
const EDGES = '_/\\|()\'",.^-~';
const GLYPHS = [...new Set(RAMPS.join('') + EDGES)].join('');
const FONT = GLYPHS + Array.from({ length: 95 }, (_, i) => String.fromCharCode(32 + i)).filter(c => !GLYPHS.includes(c)).join('');
const MONO = 'ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace';
const view = { size: 0, cw: 8, ch: 13, cols: 0, rows: 0, ss: 2, raw: false, ink: 1 };
let text = new Uint8Array(0);   // glyph and style for every cell of interface text

// draws the font into an atlas and measures how much ink each glyph puts in the six regions of its cell
function buildAtlas() {
  const { cw, ch } = view, n = GLYPHS.length;
  const c = document.createElement('canvas');
  c.width = cw * 16; c.height = ch * 6;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.fillStyle = '#000';
  g.fillRect(0, 0, c.width, c.height);
  g.font = `600 100px ${MONO}`;
  g.font = `600 ${100 * cw / g.measureText('M').width}px ${MONO}`;
  g.fillStyle = '#fff';
  g.textAlign = 'center';
  const base = Math.round((ch + g.measureText('H').actualBoundingBoxAscent) / 2);
  for (let i = 0; i < FONT.length; i++) {
    const x = (i % 16) * cw, y = (i >> 4) * ch;
    g.save();
    g.beginPath(); g.rect(x, y, cw, ch); g.clip();
    g.fillText(FONT[i], x + cw / 2, y + base);
    g.restore();
  }
  const img = g.getImageData(0, 0, c.width, c.height).data;
  const shapes = new Float32Array(n * 6), mean = new Float32Array(n);
  let max = 0;
  for (let i = 0; i < n; i++) for (let k = 0; k < 6; k++) {
    const x0 = (i % 16) * cw + Math.round((k & 1) * cw / 2), x1 = (i % 16) * cw + Math.round(((k & 1) + 1) * cw / 2);
    const y0 = (i >> 4) * ch + Math.round((k >> 1) * ch / 3), y1 = (i >> 4) * ch + Math.round(((k >> 1) + 1) * ch / 3);
    let s = 0;
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) s += img[(y * c.width + x) * 4];
    shapes[i * 6 + k] = s /= 255 * (x1 - x0) * (y1 - y0);
    if (s > max) max = s;
  }
  const data = new Uint8Array(n * 2 * 4);
  for (let i = 0; i < n; i++) for (let k = 0; k < 6; k++) {
    const v = shapes[i * 6 + k] / max;
    data[((k < 3 ? 0 : n) + i) * 4 + k % 3] = v * 255;
    mean[i] += v / 6;
  }
  view.ink = Math.max(...mean);   // the densest glyph is the top of the brightness scale

  // for each material, the character to use at each of 16 brightness levels
  const ramps = new Uint8Array(16 * RAMPS.length);
  RAMPS.forEach((chars, m) => {
    for (let level = 0; level < 16; level++) {
      const want = level / 15 * view.ink;
      let best = 0;
      for (const ch of chars) {
        const i = GLYPHS.indexOf(ch);
        if (Math.abs(mean[i] - want) < Math.abs(mean[best] - want)) best = i;
      }
      ramps[m * 16 + level] = best;
    }
  });
  const upload = (unit, format, w, h, pixels) => {
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.texImage2D(gl.TEXTURE_2D, 0, format === gl.RED ? gl.R8 : gl.RGBA8, w, h, 0, format, gl.UNSIGNED_BYTE, pixels);
  };
  // which characters each material may use: its own set, plus the line shapes for edges
  const allow = new Uint8Array(n * RAMPS.length);
  RAMPS.forEach((chars, m) => {
    for (let i = 0; i < n; i++) allow[m * n + i] = chars.includes(GLYPHS[i]) || EDGES.includes(GLYPHS[i]) ? 255 : 0;
  });
  upload(5, gl.RGBA, n, 2, data);
  upload(12, gl.RED, 16, RAMPS.length, ramps);
  upload(14, gl.RED, n, RAMPS.length, allow);
  gl.activeTexture(gl.TEXTURE9);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, c);
}

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.floor(innerWidth * dpr);
  canvas.height = Math.floor(innerHeight * dpr);
  view.size = view.size || (dpr > 1.5 ? 7 : 8);
  view.cw = Math.round(view.size * dpr);
  view.ch = Math.round(view.cw * 1.6);
  view.cols = Math.ceil(canvas.width / view.cw);
  view.rows = Math.ceil(canvas.height / view.ch);
  text = new Uint8Array(view.cols * view.rows * 2);
  const alloc = (unit, w, h) => {
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  };
  for (const unit of [4, 10]) alloc(unit, view.cols * 2 * view.ss, view.rows * 3 * view.ss);
  for (const unit of [6, 7, 8]) alloc(unit, view.cols, view.rows);
  gl.generateMipmap(gl.TEXTURE_2D);
  buildAtlas();
}

// ---- game

const EYE = 1.7, SENS = .0023;
let mode = 'loading', time = 0, signals = 0;
const cam = { pos: [0, 0, 900], fwd: [0, 0, -1], up: [0, 1, 0], right: [1, 0, 0], fx: 1, fy: .6 };
const ship = { pos: [0, 0, 0], fwd: [0, 0, -1], up: [0, 1, 0], vel: [0, 0, 0], parked: false };
const me = { dir: [0, 1, 0], h: 0, fwd: [1, 0, 0], pitch: 0, vr: 0 };
const look = { x: 0, y: 0 }, stick = { x: 0, y: 0 };
const keys = new Set();
const held = k => (keys.has(k) ? 1 : 0);
const ui = { note: '', msg: '', until: 0, help: false, stats: false };

function say(msg, secs = 5) {
  ui.msg = msg;
  ui.until = time + secs;
}

function sunDir() {
  const a = time / planet.dayLen * Math.PI * 2 + 1, c = Math.cos(planet.tilt);
  return [Math.cos(a) * c, Math.sin(planet.tilt), Math.sin(a) * c];
}
function moonPos() {
  const m = planet.moon, a = time * m.speed + m.phase, c = Math.cos(m.incl);
  return [Math.cos(a) * c * m.dist, Math.sin(m.incl) * m.dist, Math.sin(a) * c * m.dist];
}

function orbit() {
  const a = time * .05;
  cam.pos = mul(norm([Math.sin(a), .28, Math.cos(a)]), planet.R * 3);
  cam.fwd = norm(mul(cam.pos, -1));
  cam.up = [0, 1, 0];
}

function fly(dt) {
  const s = ship;
  let right = norm(cross(s.fwd, s.up));
  const yaw = look.x * SENS + (held('arrowright') - held('arrowleft')) * dt * 1.3;
  const pitch = -look.y * SENS + (held('arrowup') - held('arrowdown')) * dt * 1.3;
  s.fwd = norm(add(s.fwd, add(mul(right, yaw), mul(s.up, pitch))));

  // roll is free in space and eases level with the horizon near the ground
  const out = norm(s.pos), alt = len(s.pos) - planet.R - groundAt(out);
  let up = add(s.up, mul(right, (held('e') - held('q')) * dt * 1.5));
  if (Math.abs(dot(s.fwd, out)) < .96) up = mix3(up, out, 1 - Math.exp(-dt * 3 * smooth(planet.R * .9, 15, alt)));
  s.up = norm(sub(up, mul(s.fwd, dot(up, s.fwd))));
  right = cross(s.fwd, s.up);

  const top = lerp(24, 190, smooth(6, planet.R * 1.4, alt)) * (held('shift') ? 2.2 : 1);
  const push = add(add(mul(s.fwd, held('w') - held('s') - stick.y), mul(right, held('d') - held('a') + stick.x)), mul(s.up, held(' ') - held('c')));
  s.vel = add(mul(s.vel, Math.exp(-dt * 1.3)), mul(push, top * 1.3 * dt));
  s.pos = add(s.pos, mul(s.vel, dt));

  const d = norm(s.pos), floor = planet.R + groundAt(d) + 1.6, r = clamp(len(s.pos), floor, planet.R * 6);
  if (r !== len(s.pos)) {
    s.pos = mul(d, r);
    const vr = dot(s.vel, d);
    if (vr * (r === floor ? 1 : -1) < 0) s.vel = sub(s.vel, mul(d, vr));
  }
  cam.pos = s.pos; cam.fwd = s.fwd; cam.up = s.up;
}

const floorAt = d => Math.max(heightAt(d), planet.sea ? -.9 : -1e9);

function walk(dt) {
  const m = me;
  let right = cross(m.fwd, m.dir);
  m.fwd = norm(add(m.fwd, mul(right, look.x * SENS + (held('arrowright') - held('arrowleft')) * dt * 1.6)));
  m.pitch = clamp(m.pitch - look.y * SENS + (held('arrowup') - held('arrowdown')) * dt * 1.2, -1.5, 1.5);
  right = cross(m.fwd, m.dir);

  const f = held('w') - held('s') - stick.y, r = held('d') - held('a') + stick.x;
  if (f || r) {
    const step = mul(norm(add(mul(m.fwd, f), mul(right, r))), (held('shift') ? 11 : 5) * dt);
    const to = norm(add(mul(m.dir, planet.R + m.h), step));
    // anything steeper than about 60 degrees is a wall, and water or lava deeper than a metre is too
    const climb = floorAt(to) - Math.max(m.h, floorAt(m.dir));
    if (climb < len(step) * 1.7 + .02 && !(planet.sea && heightAt(to) < -1)) m.dir = to;
  }
  const floor = floorAt(m.dir);
  m.vr -= 7 * dt;
  m.h += m.vr * dt;
  if (m.h <= floor) {
    m.h = floor;
    m.vr = held(' ') ? 4.6 : 0;
  }
  m.fwd = norm(sub(m.fwd, mul(m.dir, dot(m.fwd, m.dir))));
  cam.pos = mul(m.dir, planet.R + m.h + EYE);
  cam.fwd = add(mul(m.fwd, Math.cos(m.pitch)), mul(m.dir, Math.sin(m.pitch)));
  cam.up = m.dir;

  for (const b of planet.beacons) {
    if (b.got || len(sub(cam.pos, b.base)) > 5) continue;
    b.got = true;
    signals++;
    chime();
    say(signals < planet.beacons.length ? `signal ${signals} of ${planet.beacons.length}: ${facts()[signals - 1]}`
                                        : `survey of ${planet.name} complete. n for another world`, 9);
  }
}

function facts() {
  const p = planet, flat = Math.round(p.flat * 100);
  return [
    `radius ${p.R} m, ${Math.round(2 * Math.PI * p.R)} m around`,
    `one day lasts ${Math.floor(p.dayLen / 60)} min ${Math.round(p.dayLen % 60)} s`,
    p.sea === 1 ? `${flat}% of the surface is water` : p.sea ? `${flat}% of the surface is molten` : 'no liquid on the surface',
    `highest ground ${Math.round(p.peak)} m above the datum`,
  ];
}

function land() {
  const d = norm(ship.pos), alt = len(ship.pos) - planet.R - groundAt(d);
  if (alt > 40) return say('too high to land');
  if (planet.sea && heightAt(d) < -1) return say('no ground to stand on here');
  me.dir = d;
  me.h = len(ship.pos) - planet.R - EYE;
  me.vr = Math.min(0, dot(ship.vel, d));
  const flat = sub(ship.fwd, mul(d, dot(ship.fwd, d)));
  me.fwd = norm(len(flat) > .05 ? flat : cross(d, [.3, .9, .2]));
  me.pitch = Math.asin(clamp(dot(ship.fwd, d), -1, 1));
  // the ship sets down a few steps behind you
  const spot = norm(sub(mul(d, planet.R), mul(me.fwd, 6)));
  ship.pos = mul(spot, planet.R + groundAt(spot) + 1.3);
  ship.parked = true;
  mode = 'walk';
}

function board() {
  if (len(sub(cam.pos, ship.pos)) > 15) say('ship recalled', 2);
  ship.pos = mul(me.dir, planet.R + me.h + EYE + .2);
  ship.fwd = norm(cam.fwd); ship.up = me.dir; ship.vel = mul(me.dir, 8);
  ship.parked = false;
  mode = 'fly';
}

// ---- input

function press(k) {
  if (k === '?' || k === '/') ui.help = !ui.help;
  if (k === 'escape') ui.help = false;
  if (mode === 'title' && (k === 'enter' || k === ' ')) return start();
  if (k === 'n' && mode !== 'loading') return newPlanet(randomSeed());
  if (k === 'i') ui.stats = !ui.stats;
  if (k === 'v') view.raw = !view.raw;
  if (k === 'm') mute();
  if (k === '-' || k === '_' || k === '=' || k === '+') {
    view.size = clamp(view.size + (k === '-' || k === '_' ? 1 : -1), 4, 16);
    resize();
  }
  if (mode !== 'fly' && mode !== 'walk') return;
  if (k === 'f') mode === 'fly' ? land() : board();
  if (k === 'p') saveText();
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (!e.repeat) press(k);
  keys.add(k);
  if (k === ' ' || k.startsWith('arrow')) e.preventDefault();
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());
addEventListener('resize', resize);

function grabMouse() {
  const p = canvas.requestPointerLock && canvas.requestPointerLock();
  if (p) p.catch(() => {});
}
canvas.addEventListener('click', () => {
  if (mode === 'title') start();
  else if (mode !== 'loading') grabMouse();
});
addEventListener('mousemove', e => {
  if (document.pointerLockElement !== canvas) return;
  look.x += e.movementX; look.y += e.movementY;
});

// touch: left half of the screen is a stick, right half looks around
const pad = document.getElementById('pad'), fingers = new Map();
let touched = false;
canvas.addEventListener('touchstart', e => {
  touched = true;
  pad.style.display = 'flex';
  for (const t of e.changedTouches) fingers.set(t.identifier, { x: t.clientX, y: t.clientY, ox: t.clientX, oy: t.clientY, move: t.clientX < innerWidth / 2 });
  if (mode === 'title') start();
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) {
    const f = fingers.get(t.identifier);
    if (!f) continue;
    if (f.move) {
      stick.x = clamp((t.clientX - f.ox) / 60, -1, 1);
      stick.y = clamp((t.clientY - f.oy) / 60, -1, 1);
    } else {
      look.x += (t.clientX - f.x) * 2; look.y += (t.clientY - f.y) * 2;
    }
    f.x = t.clientX; f.y = t.clientY;
  }
  e.preventDefault();
}, { passive: false });
const lift = e => {
  for (const t of e.changedTouches) {
    if (fingers.get(t.identifier)?.move) stick.x = stick.y = 0;
    fingers.delete(t.identifier);
  }
};
canvas.addEventListener('touchend', lift);
canvas.addEventListener('touchcancel', lift);
for (const b of pad.children) {
  const k = b.dataset.k;
  b.addEventListener('touchstart', e => { press(k); keys.add(k); e.preventDefault(); }, { passive: false });
  b.addEventListener('touchend', () => keys.delete(k));
}

// ---- sound

let ac, master, wind, windBand, hum, muted = false;

function startAudio() {
  if (ac) return;
  ac = new AudioContext();
  master = ac.createGain();
  master.gain.value = 0;
  master.gain.setTargetAtTime(muted ? 0 : .6, ac.currentTime, 1.5);
  master.connect(ac.destination);

  const buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource();
  src.buffer = buf; src.loop = true;
  windBand = ac.createBiquadFilter();
  windBand.type = 'bandpass'; windBand.Q.value = .7;
  wind = ac.createGain();
  wind.gain.value = 0;
  src.connect(windBand).connect(wind).connect(master);
  src.start();

  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 150;
  hum = ac.createGain();
  hum.gain.value = 0;
  for (const f of [48, 48.5, 96.4]) {
    const o = ac.createOscillator();
    o.type = 'sawtooth'; o.frequency.value = f;
    o.connect(lp); o.start();
  }
  lp.connect(hum).connect(master);
  drone();
}

// a slow chord that keeps re-voicing itself in the planet's key
function drone() {
  const t = ac.currentTime, root = 55 * 2 ** (planet.key / 12);
  const upper = [12, 14, 15, 19, 22, 24, 26, 27, 31];
  for (const semi of [0, 7, upper[Math.floor(Math.random() * 4)], upper[4 + Math.floor(Math.random() * 5)]]) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = root * 2 ** (semi / 12) * (1 + (Math.random() - .5) * .004);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.045, t + 5);
    g.gain.linearRampToValueAtTime(0, t + 16);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + 16.5);
  }
  setTimeout(drone, 9000);
}

function chime() {
  if (!ac) return;
  const root = 220 * 2 ** (planet.key / 12);
  [0, 7, 12, 19].forEach((semi, i) => {
    const t = ac.currentTime + i * .13, o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle'; o.frequency.value = root * 2 ** (semi / 12);
    g.gain.setValueAtTime(.12, t);
    g.gain.exponentialRampToValueAtTime(.001, t + 1.4);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + 1.5);
  });
}

function mute() {
  muted = !muted;
  if (ac) master.gain.setTargetAtTime(muted ? 0 : .6, ac.currentTime, .2);
  say(muted ? 'sound off' : 'sound on', 2);
}

function soundTick() {
  if (!ac) return;
  const alt = len(cam.pos) - planet.R - groundAt(norm(cam.pos)), speed = mode === 'fly' ? len(ship.vel) : 0;
  const air = planet.atmo ? Math.exp(-Math.max(alt, 0) / (planet.atmo * .3)) : 0, t = ac.currentTime;
  wind.gain.setTargetAtTime(air * (.03 + Math.min(speed / 150, 1) * .3), t, .3);
  windBand.frequency.setTargetAtTime(350 + speed * 9, t, .3);
  hum.gain.setTargetAtTime(mode === 'fly' ? .1 + Math.min(speed / 200, 1) * .25 : 0, t, .4);
}

// ---- screen

const stats = { frames: 0, t: 0, fps: 0, slow: 0 };

function drawScene() {
  const { cols, rows, cw, ch, ss } = view, p = planet;
  cam.right = norm(cross(cam.fwd, cam.up));
  const up = cross(cam.right, cam.fwd), alt = len(cam.pos) - p.R, hs = p.atmo * .25 || 1;
  cam.fx = cam.fy * (cols * cw) / (rows * ch);

  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFbo);
  gl.viewport(0, 0, cols * 2 * ss, rows * 3 * ss);
  gl.useProgram(scene.p);
  let u = scene.u;
  gl.uniform1i(u.uHeight, 0); gl.uniform1i(u.uNormal, 1); gl.uniform1i(u.uAlbedo, 2); gl.uniform1i(u.uNoise, 3); gl.uniform1i(u.uMat, 11);
  gl.uniform3fv(u.uPos, cam.pos); gl.uniform3fv(u.uFwd, cam.fwd); gl.uniform3fv(u.uRight, cam.right); gl.uniform3fv(u.uUp, up);
  gl.uniform2f(u.uFov, cam.fx, cam.fy);
  gl.uniform3fv(u.uSun, sunDir());
  gl.uniform3fv(u.uSunCol, p.sunCol);
  gl.uniform1f(u.uTime, time);
  gl.uniform1f(u.uR, p.R);
  gl.uniform1f(u.uTop, p.top);
  gl.uniform1f(u.uPix, 2 * cam.fy / (rows * 3));
  gl.uniform1f(u.uTexel, Math.PI / 2 * p.R / S);
  gl.uniform1f(u.uAtmo, p.atmo);
  gl.uniform3fv(u.uBeta, p.K.tau.map(t => t / hs));
  // the sky is brighter to an eye standing in it than it is from orbit
  gl.uniform1f(u.uAdapt, lerp(2.6, 1, smooth(0, p.atmo * 1.2, alt)));
  gl.uniform4f(u.uSea, ...linear(hex(p.K.deepCol)), p.sea);
  gl.uniform3fv(u.uShallow, linear(hex(p.K.shallow)));
  gl.uniform4f(u.uCloud, p.cover, p.cloudAlt, p.cloudF, p.cover < 1 ? 1 : 0);
  gl.uniform3fv(u.uCloudCol, linear(hex(p.K.cloudCol)));
  const ring = p.ring;
  gl.uniform4f(u.uRing, ring ? ring.inner : 0, ring ? ring.outer : 0, ring ? ring.alpha : 0, ring ? ring.seed : 0);
  gl.uniform3fv(u.uRingN, ring ? ring.n : [0, 1, 0]);
  gl.uniform3fv(u.uRingCol, ring ? ring.col : [0, 0, 0]);
  gl.uniform4f(u.uMoon, ...(p.moon ? moonPos() : [0, 0, 0]), p.moon ? p.moon.r : 0);
  gl.uniform4f(u.uShip, ...ship.pos, ship.parked ? 1 : 0);
  gl.uniform3f(u.uBeaconCol, .2, 1, .9);
  const beams = new Float32Array(20);
  p.beacons.forEach((b, i) => beams.set([...b.base, b.got ? .25 : 1], i * 4));
  gl.uniform4fv(u.uBeacon, beams);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.bindFramebuffer(gl.FRAMEBUFFER, cellFbo);
  gl.viewport(0, 0, cols, rows);
  gl.useProgram(cells.p);
  u = cells.u;
  gl.uniform1i(u.uScene, 4); gl.uniform1i(u.uInfo, 10); gl.uniform1i(u.uShapes, 5); gl.uniform1i(u.uRamps, 12); gl.uniform1i(u.uAllow, 14);
  gl.uniform2f(u.uGrid, cols, rows);
  gl.uniform1i(u.uCount, GLYPHS.length);
  gl.uniform1f(u.uInk, view.ink);
  gl.uniform1fv(u.uBack, BACKING);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.activeTexture(gl.TEXTURE8);
  gl.generateMipmap(gl.TEXTURE_2D);
}

function drawScreen() {
  const { cols, rows, cw, ch } = view, u = final.u;
  gl.activeTexture(gl.TEXTURE13);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RG8, cols, rows, 0, gl.RG, gl.UNSIGNED_BYTE, text);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(final.p);
  gl.uniform1i(u.uScene, 4); gl.uniform1i(u.uC0, 6); gl.uniform1i(u.uC1, 7); gl.uniform1i(u.uGlow, 8); gl.uniform1i(u.uAtlas, 9); gl.uniform1i(u.uText, 13);
  gl.uniform2f(u.uRes, canvas.width, canvas.height);
  gl.uniform2f(u.uCell, cw, ch);
  gl.uniform2f(u.uGrid, cols, rows);
  gl.uniform2f(u.uAtlasGrid, 16, 6);
  gl.uniform1f(u.uRaw, view.raw ? 1 : 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// interface text is written straight into the character grid
function put(x, y, str, style = 1) {
  if (y < 0 || y >= view.rows) return;
  for (let i = 0; i < str.length; i++) {
    const cx = Math.round(x) + i, k = (y * view.cols + cx) * 2;
    if (cx < 0 || cx >= view.cols) continue;
    text[k] = Math.max(FONT.indexOf(str[i]), 0);
    text[k + 1] = style;
  }
}

const HELP = [
  ['mouse', 'steer, look'],
  ['w a s d', 'thrust and strafe, walk'],
  ['space c', 'up and down, jump'],
  ['q e', 'roll'],
  ['shift', 'boost, run'],
  ['f', 'land and step out, board and lift off'],
  ['n', 'next planet'],
  ['p', 'save the view as a text file'],
  ['v', 'show the render under the text'],
  ['- =', 'text size'],
  ['m', 'sound'],
  ['i', 'frame rate'],
];

// how far the nearest signal still out there is, and which way to turn
function nextSignal() {
  let near = null, best = 1e9;
  for (const b of planet.beacons) {
    const d = len(sub(b.base, cam.pos));
    if (!b.got && d < best) { best = d; near = b; }
  }
  if (!near) return '';
  const r = sub(near.base, cam.pos), a = Math.atan2(dot(r, cam.right), dot(r, cam.fwd)) * 180 / Math.PI;
  const way = Math.abs(a) < 25 ? 'ahead' : Math.abs(a) > 140 ? 'behind' : a > 0 ? 'right' : 'left';
  return `   next signal ${Math.round(best)}m ${way}`;
}

function drawText() {
  const p = planet, cols = Math.floor(canvas.width / view.cw), bar = Math.floor(canvas.height / view.ch) - 1;
  const playing = mode === 'fly' || mode === 'walk';
  text.fill(0);

  // one status line along the bottom, the way an editor does it
  put(0, bar, ' '.repeat(view.cols), 3);
  put(0, bar + 1, ' '.repeat(view.cols), 3);
  const tag = mode === 'fly' ? ' FLY ' : mode === 'walk' ? ' WALK ' : ' planet.txt ';
  put(0, bar, tag, 4);
  let left = ui.note, right = '';
  if (mode !== 'loading') {
    const alt = len(cam.pos) - p.R - groundAt(norm(cam.pos)), speed = mode === 'fly' ? len(ship.vel) : 0;
    left = `${p.name}  ${p.K.label}`;
    right = !playing ? (touched ? 'tap to descend' : 'click to descend   n next planet   ? keys')
          : `alt ${Math.round(alt)}m` + (mode === 'fly' ? `   ${Math.round(speed)}m/s` : '') + nextSignal() + `   found ${signals}/${p.beacons.length}`;
    if (ui.stats) right += `   ${stats.fps}fps ${view.cols}x${view.rows}`;
  }
  put(tag.length + 1, bar, left, 3);
  put(cols - right.length - 1, bar, right, playing ? 3 : 6);

  if (time < ui.until) put((cols - ui.msg.length) / 2, bar - 2, ` ${ui.msg} `, ui.until - time < .6 ? 2 : 1);
  if (ui.help) HELP.forEach(([k, what], i) => {
    put(2, 2 + i, ` ${k.padEnd(9)}`, 1);
    put(12, 2 + i, ` ${what.padEnd(40)}`, 2);
  });
}

function saveText() {
  const { cols, rows } = view, px = new Uint8Array(cols * rows * 4), lines = [];
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, cellFbo);
  gl.readBuffer(gl.COLOR_ATTACHMENT0);
  gl.readPixels(0, 0, cols, rows, gl.RGBA, gl.UNSIGNED_BYTE, px);
  for (let y = rows - 1; y >= 0; y--) {
    let s = '';
    for (let x = 0; x < cols; x++) s += GLYPHS[px[(y * cols + x) * 4 + 3]] || ' ';
    lines.push(s.trimEnd());
  }
  const out = lines.join('\n') + '\n', a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([out], { type: 'text/plain' }));
  a.download = planet.name.toLowerCase().replace(/\W+/g, '-') + '.txt';
  a.click();
  URL.revokeObjectURL(a.href);
  say(`wrote ${a.download}, ${cols} x ${rows} characters`, 4);
  if (navigator.clipboard) navigator.clipboard.writeText(out).then(() => say(`wrote ${a.download} and copied it`, 4), () => {});
}

// ---- boot

const randomSeed = () => (NAME_A[Math.floor(Math.random() * 16)] + NAME_B[Math.floor(Math.random() * 16)]).toLowerCase() + '-' + Math.floor(Math.random() * 900 + 100);
const nextFrame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r)));

async function newPlanet(seed) {
  mode = 'loading';
  if (document.pointerLockElement) document.exitPointerLock();
  design(seed);
  for (let f = 0; f < 6; f++) {
    ui.note = `charting ${planet.name}  ${f + 1}/6`;
    await nextFrame();
    planet.mat[f].fill(0);
    buildFace(f);
  }
  scatter();
  await nextFrame();
  for (let f = 0; f < 6; f++) paintFace(f);
  placeBeacons();
  uploadPlanet();
  signals = 0;
  ship.parked = false;
  ui.until = 0;
  try { history.replaceState(null, '', '?seed=' + encodeURIComponent(seed)); } catch (e) { /* some browsers refuse on file:// */ }
  mode = 'title';
}

function start() {
  ship.pos = cam.pos; ship.fwd = cam.fwd; ship.up = cam.up; ship.vel = [0, 0, 0];
  mode = 'fly';
  startAudio();
  if (!fingers.size) grabMouse();
  say(`${planet.beacons.length} signals on the surface. fly down, f to land, walk to them`, 9);
}

let last = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const real = (now - last) / 1000 || 0, dt = Math.min(.05, real);
  last = now;
  if (mode !== 'loading') {
    time += dt;
    if (mode === 'title') orbit();
    else if (mode === 'fly') fly(dt);
    else if (mode === 'walk') walk(dt);
    drawScene();
    soundTick();
  }
  look.x = look.y = 0;
  drawText();
  drawScreen();

  stats.frames++;
  stats.t += real;
  if (stats.t >= .5) {
    stats.fps = Math.round(stats.frames / stats.t);
    // two bad seconds in a row: stop supersampling, then start using bigger characters
    stats.slow = stats.fps < 40 && mode !== 'loading' ? stats.slow + 1 : 0;
    if (stats.slow >= 4 && (view.ss > 1 || view.size < 12)) {
      if (view.ss > 1) view.ss = 1; else view.size += 2;
      stats.slow = 0;
      resize();
    }
    stats.frames = 0; stats.t = 0;
  }
}

resize();
newPlanet(new URLSearchParams(location.search).get('seed') || randomSeed());
requestAnimationFrame(frame);
</script>
</body>
</html>
